# Local distributed re-eval over the merged final-combined bug-finding tree.
#
# Source experiment tree:
#   /data/crsbench/final-combined/final-combined/atlantis-multilang-given_fuzzer
# (= experiment_filestore / experiment.name)
#
# benchmarks list is the explicit set of trial folders present under the tree
# above, so re-eval scope matches the on-disk layout exactly.
#
# Usage (3 terminals):
#
#   # 1) Redis
#   docker run --rm -p 6379:6379 --name crsbench-redis redis:7-alpine
#
#   # 2) Evaluator (split build/verify pools on a 128-core box)
#   CRSBENCH_EVALUATOR_ROUTING_MODEL=shared \
#   CRSBENCH_REDIS_HOST=localhost:6379 \
#     uv run crsbench evaluator \
#       --experiment-config experiment-configs/reeval/atlantis-multilang-given_fuzzer-final-combined.yaml \
#       --benchmarks-root /home/acorn421/work/crsbench/CRSBench/benchmarks \
#       --cpuset 0-127 \
#       --build-jobs 8  --build-cores-per-job 16 \
#       --verify-jobs 64 --verify-cores-per-job 2
#
#   # 3) Re-eval driver
#   uv run crsbench re-eval \
#     -c experiment-configs/reeval/atlantis-multilang-given_fuzzer-final-combined.yaml \
#     --redis-host localhost:6379 \
#     --output /data/crsbench/reeval-data/atlantis-multilang-given_fuzzer-final-combined
#
# Notes:
#   - per-trial POV cap defaults to 100 (stratified mtime sampling). Prefix
#     BOTH the evaluator and re-eval commands with CRSBENCH_REEVAL_POV_SAMPLE_SIZE=0
#     to verify every POV instead.
#   - --output keeps the source trial tree untouched; re-eval results land in
#     the given directory instead of being written in-place.

