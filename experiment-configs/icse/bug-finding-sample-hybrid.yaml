# CRSBench experiment configuration
# Generated by: crsbench gen-config
#
# Reference: docs/experiment-config-distributed-example.yaml
# Validate with: crsbench gen-config --validate --output <file>

description: 'ICSE bug-finding run: crs-sample-hybrid over selected CPV targets, 1h
  run timeout, 16 cores/trial, full parallel.'

experiment:
  name: icse-sample-hybrid-finding-8h
  task: bugfinding
  mode: auto
  # Per-benchmark harness + CPV selectors (benchmark -> harness -> [cpv ids]).
  # Targets the exact (benchmark, harness, cpv) tuples for this ICSE run.
  benchmarks:
    - afc-apache-commons-compress-delta-02:
        ExpanderFuzzer:
          - cpv_0
    - atlanta-faad2-delta-01:
        fuzz_decode_drm_fixed:
          - cpv_1
    - atlanta-jq-delta-01:
        jq_fuzz_fixed:
          - cpv_0
    - atlanta-pcre2-full-01:
        pcre2_fuzzer:
          - cpv_0
          - cpv_1
    - atlanta-tmux-delta-01:
        input-fuzzer:
          - cpv_0

# Per-CRS resource allocation. Adjust num_cores/mem_limit per CRS.
# Additional options: mem_limit, additional_env
crs_compose:
  crs-sample-hybrid:
    num_cores: 16
    mem_limit: 64G
    additional_env:
      ANTHROPIC_MODEL: claude-opus-4-6

# Runtime settings. For distributed mode, add redis_host.
# Additional options: per_pov_verify_timeout, snapshot_period,
#   pov_early_stop, litellm, inputs (pov/sarif/seed/diff)
runtime:
  trials: 1
  max_total_time: 36000
  build_timeout: 3600
  run_timeout: 28800
  verify_timeout: 1800
  redis_host: localhost
  pov_early_stop: true
  litellm:
    mode: external
    cost_budget: 10.0

# Storage paths. For distributed mode, consider shared mount points.
# Additional options: keep_only_results, cleanup_after_trial,
#   copy_results_after_trial, results_filestore
storage:
  experiment_filestore: .run/icse/experiment-data/icse-sample-hybrid-finding-8h
  report_filestore: .run/icse/report-data/icse-sample-hybrid-finding-8h

# Worker settings — parallel trial execution capacity.
# Additional options: continuous, worker_name, minimum_disk_size
worker:
  jobs: 6
  cores_per_job: 16

# Evaluator settings — parallel POV build/verify capacity.
# Additional options: idle_timeout, build_jobs, verify_jobs
evaluator:
  jobs: 2
  cores_per_job: 8

# Per-trial resource envelope: 16 cores / 64G each, fully parallel
# (worker.jobs=6 x cores_per_job=16 = 96 cores for the 6 CPV trials).
resources:
  cores_per_trial: 16
  memory_per_trial: "64G"
