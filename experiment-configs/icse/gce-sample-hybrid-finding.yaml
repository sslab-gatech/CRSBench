# GCE cloud bug-finding: crs-sample-hybrid over the ICSE "hybrid CRS" target set.
#
# Targets come from crsbench-paper/reviews/analysis/hybrid_crs_target.csv:
#   28 benchmarks / 35 (benchmark, harness) runs, CPV-targeted.
#   3 trials each -> 108 jobs total. (35 harnesses x 3 = 105, plus one harness
#   whose targeted CPVs span both address and undefined -> +3; see sanitizer note.)
#
# Cloud/GCE layout mirrors experiment-configs/ccs-bugfinding/*.yaml.
# CRS service + CPV-selector format mirrors the local icse sample-hybrid configs.
#
# Sanitizers: address + undefined are both listed, but with CPV targeting and
# only_cpv_harnesses=true (default) the run-matrix intersects each sanitizer
# against the targeted CPVs' own sanitizers -- a sanitizer no targeted CPV uses
# produces zero trials. So each harness runs only the sanitizer(s) it needs.
#
# Prerequisites:
#   1. gcloud auth login && gcloud auth application-default login
#   2. uv run crsbench cloud keygen (add public key to GitHub deploy keys)
#   3. HF_TOKEN in .env or environment
#
# Usage:
#   CONFIG=experiment-configs/icse/gce-sample-hybrid-finding.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: icse-sample-hybrid-finding
  task: bugfinding
  mode: auto
  sanitizers:
    - address
    - undefined
  # Per-benchmark harness + CPV selectors (benchmark -> harness -> [cpv ids]).
  benchmarks:
    - afc-apache-commons-compress-delta-02:
        ExpanderFuzzer:
          - cpv_0
    - afc-apache-poi-delta-01:
        POIXSSFFuzzer:
          - cpv_1
    - afc-curl-delta-04:
        curl_fuzzer_ws:
          - cpv_1
    - afc-freerdp-full-01:
        TestFuzzCoreServer:
          - cpv_0
    - afc-lcms-full-01:
        cms_postscript_fuzzer:
          - cpv_0
    - afc-libexif-delta-02:
        exif_from_data_fuzzer:
          - cpv_0
    - afc-sqlite3-full-01:
        customfuzz3:
          - cpv_0
          - cpv_1
    - afc-tika-full-01:
        RTFParserFuzzer:
          - cpv_1
        TikaAppUnpackerFuzzer:
          - cpv_4
    - asc-nginx-delta-01:
        pov_harness:
          - cpv_8
    - atlanta-activemq-var-delta-01:
        ActivemqVariantOne:
          - cpv_0
          - cpv_1
          - cpv_2
          - cpv_3
          - cpv_4
          - cpv_5
          - cpv_6
          - cpv_7
          - cpv_8
          - cpv_9
          - cpv_10
          - cpv_11
    - atlanta-binutils-delta-01:
        fuzz_nm:
          - cpv_3
    - atlanta-faad2-delta-01:
        fuzz_decode_drm_fixed:
          - cpv_1
    - atlanta-file-delta-01:
        magic_fuzzer_loaddb:
          - cpv_1
    - atlanta-jackson-databind-full-01:
        ObjectReader2Fuzzer:
          - cpv_1
    - atlanta-jenkins-delta-01:
        JenkinsThree:
          - cpv_2
          - cpv_5
          - cpv_6
          - cpv_7
          - cpv_9
          - cpv_10
        JenkinsThreeFDP:
          - cpv_18
          - cpv_22
          - cpv_23
          - cpv_26
    - atlanta-jq-delta-01:
        jq_fuzz_fixed:
          - cpv_0
    - atlanta-jsoup-full-01:
        HtmlFuzzer:
          - cpv_4
    - atlanta-libavc-full-01:
        mvc_dec_fuzzer:
          - cpv_1
        svc_dec_fuzzer:
          - cpv_0
    - atlanta-libssh2-delta-01:
        ssh2_client_fuzzer:
          - cpv_0
    - atlanta-libtiff-full-01:
        tiffinfo:
          - cpv_0
    - atlanta-mosquitto-delta-01:
        broker_fuzz_test_config:
          - cpv_0
          - cpv_1
        dynsec_fuzz_load:
          - cpv_2
        libcommon_fuzz_utf8:
          - cpv_3
    - atlanta-netty-delta-01:
        ByteBufUtilFuzzer:
          - cpv_0
        HttpRequestDecoderFuzzer:
          - cpv_1
        ServerCookieDecoderFuzzer:
