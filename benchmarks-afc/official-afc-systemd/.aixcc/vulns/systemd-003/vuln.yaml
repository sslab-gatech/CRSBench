metadata_spec_version: v1

# Developer-given name of the vulnerability
name: macro_confusion

# Author of the vuln (anonymous if desired)
author: nemo

# Collective information used to generate SARIF reports
details:

  # one or more CWEs that correspond to this vuln
  cwes:
    - CWE-122

  # short, descriptive message detailing the vuln
  # * written as a report description *
  description: >
    Bug is a backdoor triggered by a catalog entry dependent on the __COUNTER__ C preprocessor macro
    the value of the __COUNTER__ macro is a token containing a monotonically increasing integer for use in macro tokens, but here it has been used
    as an integer.
  # list notable locations of the vuln
  # this list can be 1-N locations
  # this is not to be comprehensive of all changes
  locations:
    - path_from_root: "src/libsystemd/sd-journal/catalog.c"
      startLine: 41
      startColumn: 1
      endLine: 45
      endColumn: 1
    - path_from_root: "src/libsystemd/sd-journal/catalog.c"
      startLine: 162
      startColumn: 1
      endLine: 164
      endColumn: 1

pov:
  harness: 'fuzz-catalog'
  blob: 'data.bin'

patch:
  good: 'good_patch.diff'
  bad: 'bad_patch.diff'
