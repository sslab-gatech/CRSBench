id: cpv_0

name: OSI Options Dissector Global Buffer Overflow via Type Mismatch

cwes:
- CWE-125
- CWE-843
- CWE-787

description: |
  A global buffer overflow vulnerability caused by a type mismatch between an extern 
  declaration and its actual definition. The variable `clnp_decode_atn_options` is 
  defined as a 1-byte `bool` in packet-clnp.c but accessed as a 4-byte `gboolean` 
  through an extern declaration in packet-osi-options.c. When the dissector processes 
  OSI option packets with the OSI_OPT_SECURITY option, it evaluates the condition 
  `if (clnp_decode_atn_options)` at line 519, which attempts to read 4 bytes from a 
  1-byte variable. This reads 3 bytes beyond the allocated space into adjacent global 
  memory, potentially causing information disclosure, memory corruption, or denial of 
  service. The vulnerability was introduced during type modernization from `gboolean` 
  to C99 `bool`, where the extern declaration was updated but the ABI mismatch was 
  not properly handled.

locations:
- path_from_root: epan/dissectors/packet-osi-options.c
  function_name: dissect_osi_options
  startLine: 519
  startColumn: 16
  endLine: 519
  endColumn: 16