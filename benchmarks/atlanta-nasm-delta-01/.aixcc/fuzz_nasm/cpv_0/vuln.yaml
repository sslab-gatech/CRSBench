id: cpv_0

name: NASM Preprocessor Zero-Length Token Stack-Use-After-Return

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-825
- CWE-416
- CWE-119

description: |
  A stack-use-after-return vulnerability exists in NASM's preprocessor module.
  The root cause is in the tokenize function (asm/preproc.c), which can create
  zero-length tokens when parsing malformed assembly input. When toklen is
  calculated as ep - line and results in zero, the original code unconditionally
  creates an invalid token structure. This invalid token propagates through macro
  expansion functions (pp_getline -> pp_tokline -> expand_mmac_params), where
  manipulation of the token list causes a write through a tail pointer that
  references freed stack memory from the dup_tlist function. This results in
  memory corruption when writing to address 0x7f1aedf59f60 at line 5373 of
  expand_mmac_params.

locations:
- type: crash_site
  path_from_root: asm/preproc.c
  function_name: expand_mmac_params
  startLine: 5373
  startColumn: 11
  endLine: 5373
  endColumn: 11
- type: root_cause
  path_from_root: asm/preproc.c
  function_name: tokenize
  startLine: 1677
  startColumn: 9
  endLine: 1682
  endColumn: 22