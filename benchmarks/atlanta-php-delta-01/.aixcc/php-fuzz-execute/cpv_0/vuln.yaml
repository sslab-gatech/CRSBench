id: cpv_0

name: Global buffer overflow in PCRE delimiter mapping

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-125
- CWE-119

description: |
  A global buffer overflow vulnerability exists in the pcre_get_compiled_regex_cache_ex
  function in ext/pcre/php_pcre.c. When processing PCRE regular expression delimiters,
  the function uses a hardcoded string "([{< )]}>)" for delimiter mapping. If the
  delimiter is a closing parenthesis ')', strchr() returns a pointer to index 5,
  and then pp[5] attempts to access index 10, which is out of bounds (the string
  is only 10 characters, indices 0-9). This results in a 1-byte out-of-bounds read,
  potentially leading to information disclosure or denial of service.

locations:
- type: crash_site
  path_from_root: ext/pcre/php_pcre.c
  function_name: pcre_get_compiled_regex_cache_ex
  startLine: 649
  startColumn: 3
  endLine: 649
  endColumn: 20