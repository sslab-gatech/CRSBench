id: cpv_0

name: XML External Entity (XXE) Injection in TriX Parser

origin: 1-day

release_date: 08/20/2018

references:
- https://nvd.nist.gov/vuln/detail/CVE-2018-1000644
- https://github.com/advisories/GHSA-6xq8-pvg4-3mf3
- https://github.com/eclipse/rdf4j/pull/1146
- https://github.com/eclipse/rdf4j/issues/1056

cwes:
- CWE-611
- CWE-918
- CWE-776

description: |
  An XML External Entity (XXE) injection vulnerability exists in the Eclipse RDF4j
  TriX parser. The TriXParser class creates an XMLReader without properly configuring
  security features to prevent external entity processing. This allows the XML parser
  to process DOCTYPE declarations, resolve external general and parameter entities,
  and load external DTDs. An attacker can craft a malicious TriX file containing
  external entity references to trigger Server-Side Request Forgery (SSRF) attacks,
  disclose local files via file:// URIs, or cause denial of service through XML
  entity expansion attacks. The root cause is insecure-by-default XML parser
  configuration that fails to disable dangerous XML features.

