id: cpv_0

name: XML External Entity (XXE) Injection in RDF4J TriXParser Enabling SSRF

cwes:
- CWE-611
- CWE-918
- CWE-776

description: |
  An XML External Entity (XXE) injection vulnerability exists in the RDF4J TriXParser
  component when parsing TriX (Triples in XML) format RDF documents. The vulnerability
  occurs in the parse() method where an XMLReader is created without configuring secure
  XML parsing features. Specifically, the parser fails to disable DOCTYPE declarations,
  external general entity processing, external parameter entity processing, and loading
  of external DTDs.
  
  When XMLReaderFactory.createXMLReader() is called with default settings, it allows
  processing of DOCTYPE declarations and resolution of external entities. An attacker
  can craft a malicious TriX XML document containing a DOCTYPE declaration with an
  external entity definition that references an attacker-controlled URL. When the parser
  processes this document and encounters the entity reference, it attempts to resolve
  the external entity by making an HTTP request to the specified URL.
  
  This vulnerability enables Server-Side Request Forgery (SSRF) attacks, allowing
  attackers to: read local files using file:// protocol handlers, make the server
  initiate requests to internal systems bypassing firewall restrictions, trigger
  denial of service through XML entity expansion attacks (billion laughs), probe
  internal network infrastructure through port scanning, and exfiltrate sensitive
  data to external servers.

locations:
- path_from_root: rio/trix/src/main/java/org/eclipse/rdf4j/rio/trix/TriXParser.java
  function_name: parse
  startLine: 179
