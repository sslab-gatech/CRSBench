id: cpv_1

name: XML External Entity (XXE) Injection in RDF4J RDFXMLParser leading to SSRF

cwes:
- CWE-611
- CWE-918
- CWE-776

description: |
  The RDF4J RDFXMLParser suffers from an XML External Entity (XXE) vulnerability 
  that can lead to Server-Side Request Forgery (SSRF) attacks. The vulnerability 
  exists because the XML parser does not properly restrict external entity 
  resolution in XML documents.
  
  The root cause is that the parser's default configuration only enables 
  SECURE_PROCESSING but fails to disable DOCTYPE declarations and external 
  entity processing. This allows attackers to craft malicious RDF/XML documents 
  containing XML entity declarations that reference external URLs.
  
  When the parser processes a document with external entity references (e.g., 
  <!ENTITY xxe SYSTEM "http://attacker.com">), it attempts to resolve the 
  external entity by making an HTTP connection to the attacker-controlled URL.
  
  Impact includes information disclosure through reading local files or internal 
  network resources, SSRF attacks against internal services, port scanning of 
  internal networks, denial of service through entity expansion attacks, and 
  potential data exfiltration to attacker-controlled servers.

locations:
- path_from_root: rio/rdfxml/src/main/java/org/eclipse/rdf4j/rio/rdfxml/RDFXMLParser.java
  function_name: parse
  startLine: 328
  startColumn: 0
  endLine: 328
