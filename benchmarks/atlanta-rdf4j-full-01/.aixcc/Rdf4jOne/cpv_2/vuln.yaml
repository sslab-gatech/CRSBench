id: cpv_2

name: Zip Slip Path Traversal in RDF4J ZipUtil

origin: 1-day

release_date: 12/19/2018

references:
- https://nvd.nist.gov/vuln/detail/cve-2018-20227
- https://github.com/eclipse/rdf4j/issues/1210
- https://github.com/eclipse/rdf4j/pull/1211

cwes:
- CWE-22
- CWE-23

description: |
  A Zip Slip vulnerability exists in the ZipUtil.writeEntry() method which
  extracts entries from ZIP archives without validating that the entry names
  don't contain path traversal sequences. The code creates a File object by
  concatenating the destination directory with the entry name from the ZIP file
  without checking if the resulting path escapes the intended directory. An
  attacker can craft a malicious ZIP file with entries containing relative path
  traversal sequences (e.g., ../../../../malicious-file), allowing them to write
  files to arbitrary locations on the filesystem, potentially overwriting critical
  system files or placing malicious files in sensitive locations.

locations:
