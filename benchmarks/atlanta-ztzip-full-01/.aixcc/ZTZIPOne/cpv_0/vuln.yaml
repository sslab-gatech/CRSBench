id: cpv_0

name: Zip Slip - Path Traversal in ZIP Extraction

origin: 1-day

release_date: 07/25/2018

references:
- https://nvd.nist.gov/vuln/detail/CVE-2018-1002201
- https://security.snyk.io/vuln/SNYK-JAVA-ORGZEROTURNAROUND-31681
- https://github.com/zeroturnaround/zt-zip/commit/759b72f33bc8f4d69f84f09fcb7f010ad45d6fff

cwes:
- CWE-22
- CWE-29

description: |
  A Zip Slip vulnerability exists in the ZipUtil.unpack() method and its internal
  Unpacker and BackslashUnpacker classes. The code directly concatenates ZIP entry
  filenames with the target output directory without validating that the resulting
  path stays within the intended extraction directory. A malicious ZIP archive can
  contain entries with path traversal sequences (e.g., ../../evil.sh), causing files
  to be written outside the target directory. This allows an attacker to write files
  to arbitrary locations on the filesystem, overwrite critical system files, and
  potentially achieve remote code execution.

