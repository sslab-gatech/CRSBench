id: cpv_0

name: Zip Slip Path Traversal in zt-zip Library

cwes:
- CWE-22
- CWE-23
- CWE-59

description: |
  A Zip Slip vulnerability exists in the zt-zip library's ZipUtil class, specifically in the Unpacker and BackslashUnpacker inner classes. The vulnerability occurs when extracting ZIP archives, as the code constructs file paths directly from ZIP entry names without validating that the resulting paths remain within the intended output directory.
  
  An attacker can craft a malicious ZIP archive containing entries with path traversal sequences (e.g., "../../evil.txt"). When ZipUtil.unpack() is called, the Unpacker.process() method retrieves the entry name and creates a File object using "new File(outputDir, name)" without validation. This allows files to be written outside the target extraction directory via FileUtils.copy(), enabling arbitrary file writes on the filesystem.
  
  The vulnerability can lead to remote code execution (by overwriting executable files), system compromise (by overwriting critical system files), or denial of service (by corrupting important files). The crash log shows a detected attempt to write to a path containing "../../jazzer-traversal", demonstrating the path traversal escape.

