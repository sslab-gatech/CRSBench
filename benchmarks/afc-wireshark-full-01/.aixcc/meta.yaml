patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

full_mode:
  base_commit: 92eb57b38da4073747ea64cdccf99dd90b48f2f6

harness_files:
- name: handler_openvpn.udp
  path: $REPO/fuzz/fuzzshark.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: stack-buffer-overflow'

- name: handler_telnet
  path: $REPO/fuzz/fuzzshark.c
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-use-after-free'

- name: handler_bat.vis
  path: $REPO/fuzz/fuzzshark.c
  vulns:
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: SEGV on unknown address'

- name: handler_netbios
  path: $REPO/fuzz/fuzzshark.c
  vulns:
  - vuln_keyword: cpv_3
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'

- name: handler_aim
  path: $REPO/fuzz/fuzzshark.c
  vulns:
  - vuln_keyword: cpv_4
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: ABRT on unknown address'

- name: handler_zbee_zdp
  path: $REPO/fuzz/fuzzshark.c
  vulns:
  - vuln_keyword: cpv_5
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: SEGV on unknown address'

- name: handler_wlan_noqos
  path: $REPO/fuzz/fuzzshark.c
