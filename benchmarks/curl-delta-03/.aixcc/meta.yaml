patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: 458897b4ba4d743c1dbc2fce0607dc3802b695e3
  ref_commit: 99be15bff0dc349d2892cdb27678c4ca2ee09e29

full_mode:
  base_commit: 99be15bff0dc349d2892cdb27678c4ca2ee09e29

