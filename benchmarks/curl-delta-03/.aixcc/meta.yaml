- name: curl_fuzzer_file
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc

- name: curl_fuzzer_ftp
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc

- name: curl_fuzzer_gopher
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc

- name: curl_fuzzer_http
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc

- name: curl_fuzzer_https
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc

- name: curl_fuzzer_imap
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc

- name: curl_fuzzer_mqtt
