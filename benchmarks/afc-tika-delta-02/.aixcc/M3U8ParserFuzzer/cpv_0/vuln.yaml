description: >
  The M3U8Parser can be triggered to fetch the contents of a URL that an
  attacker may not have authorization to fetch. The handleLink method opens a
  TikaInputStream from a URL read directly from the M3U8 playlist content
  without validating or restricting the target, enabling Server-Side Request
  Forgery via a crafted M3U8 file.

