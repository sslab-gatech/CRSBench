id: cpv_1

name: Heap Buffer Overflow in UTF-8 Canonicalization

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap buffer overflow vulnerability exists in the utf8JavaByteArrayToUtf8Bytes
  function in src/main/java/org/sqlite/core/NativeDB.c. The function allocates a
  buffer sized for UTF-8 input but fails to account for character expansion during
  ASCII canonicalization. Certain Unicode characters (φ, ß, €, etc.) expand from
  single UTF-8 characters to multiple ASCII characters. When the input contains many
  such characters, writing the expanded output overflows the undersized temporary
  buffer, corrupting heap metadata and causing a crash. This can lead to denial of
  service and potential memory corruption when processing JDBC connection strings
  containing expanding Unicode characters.

locations:
- type: root_cause
  path_from_root: src/main/java/org/sqlite/core/NativeDB.c
  function_name: utf8JavaByteArrayToUtf8Bytes
