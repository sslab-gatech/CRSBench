id: cpv_1

name: UTF-8 Canonicalization Heap Buffer Overflow in Connection Handling

cwes:
- CWE-122
- CWE-787
- CWE-590

description: |
  A heap buffer overflow vulnerability occurs in the sqlite-jdbc native library's
  utf8JavaByteArrayToUtf8Bytes function when processing JDBC connection URLs containing
  multi-byte UTF-8 characters. The vulnerable code allocates a buffer sized for the
  original UTF-8 byte array length, but then calls canonicalize_string_to_ascii which
  expands multi-byte UTF-8 sequences (such as φ or ß) into longer ASCII representations.
  When the expanded string is copied back via memcpy, it overflows the fixed-size heap
  buffer, corrupting heap metadata. This leads to an invalid free operation when the
  corrupted memory is later freed, triggering AddressSanitizer detection. The vulnerability
  can cause application crashes (denial of service) and potentially enables arbitrary code
  execution through heap corruption exploitation.

locations:
- path_from_root: src/main/java/org/sqlite/core/NativeDB.c
  function_name: utf8JavaByteArrayToUtf8Bytes
  startLine: 230
  startColumn: 0
  endLine: 246
  endColumn: 0