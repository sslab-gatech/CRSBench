id: cpv_0

name: Empty Parameter ArrayIndexOutOfBoundsException in SQLite JDBC URL Parsing

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-129
- CWE-20

description: |
  An ArrayIndexOutOfBoundsException vulnerability exists in the extractPragmasFromFilename
  method in SQLiteConnection.java. When processing JDBC connection URLs with consecutive
  ampersand characters (e.g., jdbc:sqlite:aaa?&&&a), the code splits parameters by '&'
  and filters out empty strings, resulting in a zero-length array. The code then
  unconditionally accesses kvp[0] without checking if the array is empty, causing an
  ArrayIndexOutOfBoundsException. This leads to denial of service through an uncaught
  exception that can crash the application or disrupt service availability.

locations:
- type: crash_site
  path_from_root: src/main/java/org/sqlite/SQLiteConnection.java
  function_name: extractPragmasFromFilename
  startLine: 513
  startColumn: 0
  endLine: 513
  endColumn: 0