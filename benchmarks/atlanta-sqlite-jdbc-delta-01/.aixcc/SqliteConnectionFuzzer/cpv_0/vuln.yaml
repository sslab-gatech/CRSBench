id: cpv_0

name: Array Index Out of Bounds in JDBC URL Parameter Parsing

cwes:
- CWE-129
- CWE-20

description: |
  An Array Index Out of Bounds vulnerability exists in the extractPragmasFromFilename 
  method of SQLiteConnection when parsing malformed JDBC connection URLs. The vulnerability 
  is triggered when consecutive ampersands (&&&) in the connection URL create empty parameters. 
  The code splits parameters on '=' and filters empty strings, which can result in a zero-length 
  array. Subsequent access to kvp[0] without length validation causes an ArrayIndexOutOfBoundsException. 
  This vulnerability allows an attacker to cause a denial of service by crafting JDBC URLs with 
  consecutive ampersands (e.g., "jdbc:sqlite:aaa?&&&a"), leading to application crashes when 
  attempting to establish database connections.

locations:
- path_from_root: src/main/java/org/sqlite/SQLiteConnection.java
  function_name: extractPragmasFromFilename
  startLine: 517
  startColumn: 0
  endLine: 517
  endColumn: 0