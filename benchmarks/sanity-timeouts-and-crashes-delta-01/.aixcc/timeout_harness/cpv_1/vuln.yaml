id: cpv_1

name: Global Buffer Overflow via Unchecked Array Index in mock_vp.c

cwes:
- CWE-787
- CWE-119

description: |
  A global buffer overflow vulnerability exists in both func_a and func_b functions
  in mock_vp.c. The functions read two integers from untrusted input: 'num' and 'index'.
  When num * 0x1337 equals 24201480 (satisfied when num = 4920), the code writes to
  g_buf[index] without validating that index is within the valid range of the 10-byte
  global buffer (indices 0-9). An attacker can craft input with num = 4920 and index >= 10
  to trigger an out-of-bounds write, causing memory corruption, potential code execution,
  or denial of service. The POV demonstrates this with index = 11, writing 2 bytes beyond
  the allocated buffer.

locations:
- path_from_root: mock_vp.c
  function_name: func_a
  startLine: 14
  startColumn: 0
  endLine: 14
  endColumn: 0
- path_from_root: mock_vp.c
  function_name: func_b
  startLine: 29
  startColumn: 0
  endLine: 29
  endColumn: 0