id: cpv_0

name: XMLDecoder Deserialization Command Injection

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-502
- CWE-77

description: |
  An XML deserialization vulnerability exists in the LoaderXML.loadAsDataSet method
  in src/main/java/oripa/persistence/doc/loader/LoaderXML.java. The method uses
  Java's XMLDecoder to deserialize XML data from user-controlled input without any
  validation or sanitization. XMLDecoder supports arbitrary method invocation during
  deserialization, allowing an attacker to craft malicious XML payloads that
  instantiate arbitrary Java classes and invoke their methods. This leads to OS
  command injection through ProcessBuilder instantiation, enabling remote code
  execution with the application's privileges.

locations:
- type: crash_site
  path_from_root: src/main/java/oripa/persistence/doc/loader/LoaderXML.java
  function_name: loadAsDataSet
  startLine: 44
  startColumn: 1
  endLine: 44
  endColumn: 2