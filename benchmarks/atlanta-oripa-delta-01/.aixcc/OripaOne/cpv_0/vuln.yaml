id: cpv_0

name: XMLDecoder Insecure Deserialization leading to OS Command Injection

origin: 1-day

release_date: 03/29/2024

references:
- https://github.com/oripa/oripa/issues/355

cwes:
- CWE-502
- CWE-94
- CWE-78

description: |
  An insecure deserialization vulnerability exists in the loadAsDataSet function
  in oripa/persistence/doc/loader/LoaderXML.java. The application uses Java's
  XMLDecoder class to deserialize user-provided XML files without proper input
  validation. An attacker can craft a malicious XML file containing serialized
  ProcessBuilder objects that execute arbitrary OS commands when the file is
  opened. This allows for remote code execution with the privileges of the user
  running the application.

locations:
- type: crash_site
  path_from_root: src/main/java/oripa/persistence/doc/loader/LoaderXML.java
  function_name: loadAsDataSet
  startLine: 44
  startColumn: 0
  endLine: 44
  endColumn: 0