id: cpv_0

name: Signed Integer Overflow in Tile Offset Calculation

cwes:
- CWE-190
- CWE-681

description: |
  A signed integer overflow vulnerability exists in the dav1d_decode_frame_init function
  when calculating tile start offsets during video decoding. The vulnerability occurs when
  computing tile offsets using signed int types for arithmetic operations involving tile
  dimensions and block sizes. The calculation 'row_off + b_diff * col_start_sb * sb_step * 4'
  can produce values exceeding INT_MAX (2,147,483,647), resulting in undefined behavior.
  
  The root cause is the use of signed int types for variables (row_off, b_diff, tile_start_off)
  that represent memory offsets and sizes, which should be unsigned. For video frames with
  large dimensions, these calculations can legitimately require values beyond the signed
  integer range, leading to overflow.
  
  This vulnerability can result in incorrect tile offset calculations, potential out-of-bounds
  memory access, memory corruption, decoder crashes, and denial of service. It is triggered
  by crafted video files with specific frame dimensions and tiling configurations that produce
  large multiplication results, particularly in multithreaded decoding paths.

