id: cpv_1

name: MVC CABAC Coefficient Parsing Heap Buffer Overflow

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-787
- CWE-125

description: |
  A heap buffer overflow vulnerability exists in the MVC (Multiview Video Coding)
  decoder component during CABAC (Context-Adaptive Binary Arithmetic Coding)
  coefficient parsing. The bitstream buffer is allocated with insufficient padding
  (only 8 bytes) to account for look-ahead reads performed by the NEXTBITS macro
  during 4x4 transform unit processing. The NEXTBITS macro can read up to 8 bytes
  ahead in the buffer, and in specially crafted bitstreams, this causes a 4-byte
  out-of-bounds read beyond the allocated heap buffer boundary. This can lead to
  information disclosure or denial of service.

locations:
- type: crash_site
  path_from_root: decoder/ih264d_parse_cabac.c
  function_name: ih264d_read_coeff4x4_cabac
  startLine: 203
  startColumn: 25
  endLine: 203
  endColumn: 25
- type: root_cause
  path_from_root: decoder/mvc/imvcd_api.c
  function_name: imvcd_view_decode
  startLine: 736
  startColumn: 1
  endLine: 736
  endColumn: 60