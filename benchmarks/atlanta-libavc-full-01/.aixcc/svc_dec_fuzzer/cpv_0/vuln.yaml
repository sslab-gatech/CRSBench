id: cpv_0

name: SVC Decoder Display Dimension Mismatch Heap Buffer Overflow

origin: 1-day

release_date: 06/16/2024

references: []

cwes:
- CWE-122
- CWE-787
- CWE-1284

description: |
  A heap-based buffer overflow vulnerability exists in the libavc SVC decoder.
  The decoder fails to validate that display dimensions match between the
  initialized decoder state and subset sequence parameters when processing
  slice headers. This allows an attacker to craft a malformed SVC video stream
  with inconsistent display dimensions, causing the decoder to use mismatched
  dimensions during format conversion. The vulnerability triggers during the
  memcpy operation in ih264d_fmt_conv_420sp_to_420sp_swap_uv, writing 48 bytes
  beyond the allocated buffer boundary. This can lead to denial of service or
  potentially arbitrary code execution.

locations:
- type: crash_site
  path_from_root: decoder/ih264d_format_conv.c
  function_name: ih264d_fmt_conv_420sp_to_420sp_swap_uv
  startLine: 497
  endLine: 497
- type: root_cause
  path_from_root: decoder/svc/isvcd_parse_slice.c
  function_name: isvcd_parse_decode_slice_ext_nal
  startLine: 771
  endLine: 772
- type: root_cause
  path_from_root: decoder/svc/isvcd_parse_slice.c
  function_name: isvcd_parse_decode_slice
  startLine: 2016
  endLine: 2017
