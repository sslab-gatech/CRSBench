id: cpv_0

name: SVC Decoder Display Dimension Mismatch Heap Buffer Overflow

cwes:
- CWE-787
- CWE-122
- CWE-1284

description: |
  A heap buffer overflow vulnerability occurs in the libavc SVC decoder's format conversion
  function. The vulnerability is triggered by a mismatch between the decoder's display dimensions
  and the subset sequence dimensions in H.264/SVC video streams. When the decoder updates display
  dimensions from subset sequence parameters without validation, subsequent format conversion
  operations use the larger dimensions to copy data into buffers that were allocated based on
  smaller dimensions. This causes memcpy to write beyond the allocated heap buffer boundary.
  
  The root cause is in isvcd_parse_slice_ext_nal where display dimensions (u2_disp_height and
  u2_disp_width) are updated from ps_subset_seq without checking if they match the dimensions
  used during initial buffer allocation. When ih264d_format_convert is called with these
  mismatched dimensions, it passes larger width and height values to
  ih264d_fmt_conv_420sp_to_420sp_swap_uv, resulting in a heap buffer overflow during the memcpy
  operation.
  
  A malicious H.264/SVC video stream can declare initial dimensions to trigger buffer allocation,
  then update subset sequence parameters with larger dimensions, causing the decoder to write
  past the allocated buffer. This can lead to memory corruption, denial of service, and
  potentially arbitrary code execution.

locations:
- path_from_root: decoder/ih264d_format_conv.c
  function_name: ih264d_fmt_conv_420sp_to_420sp_swap_uv
  startLine: 497
  startColumn: 9
  endLine: 497
  endColumn: 9