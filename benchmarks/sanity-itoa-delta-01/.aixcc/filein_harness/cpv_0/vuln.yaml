id: cpv_0

name: Stack buffer overflow in itoa integer-to-string conversion

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-121
- CWE-787
- CWE-131

description: |
  A stack-based buffer overflow vulnerability exists in the bad0 function
  in mock_vp.c. The function allocates a 10-byte buffer on the stack to hold
  the string representation of an integer, but this is insufficient for large
  integer values. When itoa is called with INT_MAX (2147483647), it requires
  11 bytes (10 digits plus null terminator), causing a write beyond the buffer
  boundary. This can lead to memory corruption, denial of service, or potential
  control flow hijacking.

locations:
- type: crash_site
  path_from_root: cp-user-itoa/mock_vp.c
  function_name: itoa
  startLine: 27
  startColumn: 10
  endLine: 27
  endColumn: 10
- type: root_cause
  path_from_root: cp-user-itoa/mock_vp.c
  function_name: bad0
  startLine: 54
  startColumn: 10
  endLine: 54
  endColumn: 18