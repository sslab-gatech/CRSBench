id: cpv_0

name: Stack Buffer Overflow in itoa Integer-to-String Conversion

cwes:
- CWE-121
- CWE-787
- CWE-120

description: |
  A stack-based buffer overflow vulnerability exists in the bad0() function in mock_vp.c.
  The function allocates a 10-byte buffer on the stack and passes it to the itoa() function
  to convert an integer to a string without verifying that the buffer is large enough.
  
  When converting large integers such as INT_MAX (2147483647), the resulting string requires
  10 characters plus a null terminator (11 bytes total), exceeding the 10-byte buffer capacity.
  This causes a 1-byte overflow when the null terminator is written, corrupting adjacent stack
  memory.
  
  The vulnerability can be triggered by providing large integer values as input, potentially
  leading to memory corruption, program crashes, or exploitation of corrupted return addresses
  on the stack. The itoa() function performs no bounds checking on the destination buffer,
  making it unsafe for use with fixed-size buffers and large integer values.

locations:
- path_from_root: mock_vp.c
  function_name: bad0
  startLine: 49
  startColumn: 5
  endLine: 49
  endColumn: 19