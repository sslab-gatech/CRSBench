id: cpv_1

name: Heap buffer overflow in itoa due to insufficient buffer allocation

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap buffer overflow vulnerability exists in the bad1 function in mock_vp.c.
  The function allocates a buffer using user-controlled size (docWidth) but then
  passes it to itoa() to store the string representation of a large integer.
  When docWidth is smaller than required to hold the integer string (e.g., 1 byte
  for INT_MAX which needs 11 bytes), itoa() writes beyond the allocated buffer,
  causing heap corruption. This can lead to arbitrary code execution or denial
  of service.

locations:
- type: crash_site
  path_from_root: cp-user-itoa/mock_vp.c
  function_name: itoa
  startLine: 24
  startColumn: 14
  endLine: 24
  endColumn: 14
- type: root_cause
  path_from_root: cp-user-itoa/mock_vp.c
  function_name: bad1
  startLine: 61
  startColumn: 1
  endLine: 66
  endColumn: 42