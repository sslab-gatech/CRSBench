patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
delta_mode:
  base_commit: 71c2ab509a8628dbbad4bc7b3f98a64aa90d3297
  ref_commit: b8d58e2b26dc4c61c803f2bd4c13dac22d6213c0
full_mode:
  base_commit: b8d58e2b26dc4c61c803f2bd4c13dac22d6213c0
harness_files:
- name: jq_fuzz_compile
  path: $REPO/tests/jq_fuzz_compile.c
- name: jq_fuzz_execute
  path: $REPO/tests/jq_fuzz_execute.cpp
- name: jq_fuzz_load_file
  path: $REPO/tests/jq_fuzz_load_file.c
- name: jq_fuzz_parse
  path: $REPO/tests/jq_fuzz_parse.c
- name: jq_fuzz_parse_stream
  path: $REPO/tests/jq_fuzz_parse_stream.c
- name: jq_fuzz_fixed
  path: $REPO/tests/jq_fuzz_fixed.cpp
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: stack-buffer-overflow'
- name: jq_fuzz_parse_extended
  path: $REPO/tests/jq_fuzz_parse_extended.c
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
