id: cpv_0

name: Stack Buffer Overflow via NaN Payload in Decimal Number Comparison

cwes:
- CWE-121
- CWE-787
- CWE-131

description: |
  A stack-based buffer overflow vulnerability exists in jq's decimal number handling code.
  When jq parses a NaN (Not-a-Number) value with a large payload (e.g., "nan6000000005"),
  it stores the payload digits in a decimal number structure. During number comparison
  operations such as array grouping, the jvp_number_cmp function allocates a local structure
  'res' with minimal capacity (DECNUMDIGITS=1, approximately 2 units). When handling NaN
  values with payloads exceeding this capacity, the decNumberCopy function writes beyond
  the allocated buffer while copying the NaN payload, corrupting the stack.
  
  The vulnerability occurs because the stack-allocated buffer size calculation does not
  account for NaN values with large payloads. A NaN with a 10-digit payload requires
  approximately 4 units (with DECDPUN=3), but the local 'res' structure only provides
  space for about 2 units, causing an out-of-bounds write during the copy operation.
  
  Impact: Memory corruption, denial of service (crash), and potential arbitrary code
  execution through stack corruption.

locations:
- path_from_root: src/jv.c
  function_name: jvp_number_cmp
  startLine: 743
  startColumn: 0
  endLine: 746
  endColumn: 0
- path_from_root: src/decNumber/decNumber.c
  function_name: decNumberCopy
  startLine: 3375
  startColumn: 45
  endLine: 3375
  endColumn: 45