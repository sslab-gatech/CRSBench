id: cpv_0

name: Stack Buffer Overflow via NaN with Payload in jq Number Comparison

author:

validator: Yu-Fu Fu

origin: 1-day

release_date: 03/28/2025

references:
- https://nvd.nist.gov/vuln/detail/CVE-2024-53427
- https://github.com/jqlang/jq/security/advisories/GHSA-x6c3-qv5r-7q22

cwes:
- CWE-121 # Stack-based buffer overflow
- CWE-787 # Out-og-bounds Write
- CWE-843 # CVE report; Type Confusion

description: |
  A stack-based buffer overflow vulnerability exists in jq versions 1.7 and 1.7.1,
  representing an incomplete fix for CVE-2023-50268. The vulnerability occurs when
  comparing NaN values with payloads containing 10 or more decimal digits. When such
  values are parsed through jvp_literal_number_new(), they create decNumber structures
  with multiple digits stored in the payload. During comparison operations in
  jvp_number_cmp(), a stack-allocated result buffer with space for only 2 decNumberUnits
  (16 bytes) is created. However, when decNumberCompare() processes NaN values with
  large payloads, it requires more Units to store intermediate results. The
  decNumberCopy() function then writes beyond the allocated stack buffer, causing a
  2-byte out-of-bounds write. This can lead to memory corruption, potential code
  execution, or denial of service.

locations:
- type: crash_site
  path_from_root: src/decNumber/decNumber.c
  function_name: decNumberCopy
  startLine: 3375
  startColumn: 46
  endLine: 3375
  endColumn: 48
- type: root_cause
  path_from_root: src/jv.c
  function_name: jvp_literal_number_new
  startLine: 586
  endLine: 594
