id: cpv_1

name: Heap buffer overflow in decimal number string conversion

origin: 1-day

release_date: 12/13/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-50246
- https://github.com/jqlang/jq/security/advisories/GHSA-686w-5m7m-54vc

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  An off-by-one heap buffer overflow vulnerability exists in jq's decimal number
  string conversion functionality. When converting decimal numbers to their string
  representation, the jvp_literal_number_literal function in src/jv.c allocates a
  buffer of size digits + 14 bytes. However, this calculation does not account for
  the null terminator byte that decNumberToString writes at the end of the string.
  The vulnerability manifests when processing decimal numbers with large exponents
  or many significant digits, causing the null terminator to be written 1 byte
  beyond the allocated buffer boundary. This results in heap memory corruption that
  can lead to application crashes, denial of service, or potentially arbitrary code
  execution.

locations:
- type: root_cause
  path_from_root: src/jv.c
  function_name: jvp_literal_number_literal
  startLine: 638
  startColumn: 5
  endLine: 639
  endColumn: 50
- type: crash_site
  path_from_root: src/decNumber/decNumber.c
  function_name: decToString
  startLine: 3764
  startColumn: 3
  endLine: 3764
  endColumn: 14