patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: 18a0d8a347a465e855589740d95ed19c1fc9f0d1
  ref_commit: 0f204b5e36bd89d1afe5de29b32e49dc4a5d2acf

full_mode:
  base_commit: 0f204b5e36bd89d1afe5de29b32e49dc4a5d2acf

harness_files:
- name: sleuthkit_fls_apfs_fuzzer
  path: $PROJECT/sleuthkit_fls_apfs_fuzzer.cc

- name: sleuthkit_fls_ext_fuzzer
  path: $PROJECT/sleuthkit_fls_fuzzer.cc

- name: sleuthkit_fls_fat_fuzzer
  path: $PROJECT/sleuthkit_fls_fuzzer.cc

- name: sleuthkit_fls_hfs_fuzzer
  path: $PROJECT/sleuthkit_fls_fuzzer.cc

- name: sleuthkit_fls_iso9660_fuzzer
  path: $PROJECT/sleuthkit_fls_fuzzer.cc

- name: sleuthkit_fls_ntfs_fuzzer
  path: $PROJECT/sleuthkit_fls_fuzzer.cc
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: memcpy-param-overlap'

- name: sleuthkit_mmls_dos_fuzzer
  path: $PROJECT/sleuthkit_mmls_fuzzer.cc

- name: sleuthkit_mmls_gpt_fuzzer
  path: $PROJECT/sleuthkit_mmls_fuzzer.cc

- name: sleuthkit_mmls_mac_fuzzer
  path: $PROJECT/sleuthkit_mmls_fuzzer.cc

- name: sleuthkit_mmls_sun_fuzzer
  path: $PROJECT/sleuthkit_mmls_fuzzer.cc
