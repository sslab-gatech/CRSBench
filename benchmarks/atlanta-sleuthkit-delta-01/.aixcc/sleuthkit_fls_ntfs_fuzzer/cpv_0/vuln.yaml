id: cpv_0

name: NULL pointer dereference in tsk_fs_load_file_action

origin: synthetic

release_date: 02/01/2026

references:
- https://github.com/sleuthkit/sleuthkit/issues/2807
- https://github.com/sleuthkit/sleuthkit/commit/18a0d8a347a465e855589740d95ed19c1fc9f0d1

cwes:
- CWE-476
- CWE-823
- CWE-787

description: |
  A NULL pointer dereference and buffer overflow vulnerability exists in The Sleuth Kit's
  file loading functionality in the tsk_fs_load_file_action callback function. The function
  performs memcpy operations without validating that the destination pointer (buf1->cur) is
  non-NULL or that it stays within the allocated buffer bounds. When processing a maliciously
  crafted NTFS file system image, an attacker can trigger the NTFS directory traversal code
  path to invoke the callback with a NULL or invalid cur pointer, resulting in a crash or
  potential memory corruption. This can lead to denial of service, memory corruption, and
  potentially arbitrary code execution.

