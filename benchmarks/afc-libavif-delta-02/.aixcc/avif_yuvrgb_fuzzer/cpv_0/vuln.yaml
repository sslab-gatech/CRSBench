id: cpv_0

name: chroma_spill

cwes:
- CWE-126

description: The bug occurs in YUV->RGB translation if the input image is crafted in such a way that the "spill" in all YUV420
  2x2 pixel boxes is maximized, triggering the dampening which is missing a bounds check on the image and will crash for odd
  dimensions.

