patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: 0511bf366c4059c35ec0edef1ed5bec6ea6b1867
  ref_commit: 3ba60be51afc4b24d2386dabafdcd8ddde9da5f9

full_mode:
  base_commit: 3ba60be51afc4b24d2386dabafdcd8ddde9da5f9

harness_files:
- name: avif_yuvrgb_fuzzer
  path: $REPO/tests/oss-fuzz/avif_yuvrgb_fuzzer.cc
