patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
full_mode:
  base_commit: 7f62bd03b140a935c4fff190b4c9a567d5038a78
harness_files:
- name: json_fuzz
  path: $PROJECT/json_fuzz.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_3
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_4
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'
