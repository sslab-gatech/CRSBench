id: cpv_1
name: BCEL Pass2Verifier Source File Path Traversal

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-22
- CWE-73

description: |
  A file path traversal vulnerability exists in the visitSourceFile method
  of Apache BCEL's Pass2Verifier class. The method extracts a source file
  name from the SourceFile attribute of a Java class file's constant pool
  and attempts to open and read that file without proper validation. An
  attacker can craft a malicious class file with a SourceFile attribute
  containing an arbitrary file path, allowing them to read arbitrary files
  accessible to the application running the BCEL verifier.

locations:
- type: crash_site
  path_from_root: src/main/java/org/apache/bcel/verifier/statics/Pass2Verifier.java
  function_name: visitSourceFile
  startLine: 973
  startColumn: 1
  endLine: 973
  endColumn: 999
- type: root_cause
