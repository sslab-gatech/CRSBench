id: cpv_0

name: Apache BCEL Pass2Verifier Arbitrary File Read via SourceFile Attribute Path Traversal

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-22
- CWE-73
- CWE-706

description: |
  A path traversal vulnerability exists in Apache BCEL's Pass2Verifier class.
  The visitSourceFile method extracts a source file name from the Java class 
  file's constant pool and directly uses it to open a file with FileReader 
  without any path validation or sanitization. An attacker can craft a malicious 
  Java class file with a specially-crafted SourceFile attribute containing path 
  traversal sequences (e.g., ../../../etc/passwd, /jazzer-traversal, etc.) to 
  read arbitrary files on the filesystem that the verifier process has access to.
  This allows bypassing intended file access restrictions and can lead to 
  information disclosure.

locations:
- type: crash_site
  path_from_root: src/main/java/org/apache/bcel/verifier/statics/Pass2Verifier.java
  function_name: visitSourceFile
  startLine: 973
  startColumn: 0
  endLine: 973
  endColumn: 0