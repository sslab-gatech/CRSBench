description: >
  The MAJOR_VERSION_PATTERN regex defined in XSSFEventBasedExcelExtractor uses a
  pattern with catastrophic backtracking: (-?(?:\d{1,30})*)(?:\.(\dc?)*). When
  handleAppVersion calls Matcher.find() on a crafted AppVersion string from an xlsx
  file, the regex engine enters deep recursion in Pattern$Loop.match, causing a
  StackOverflowError (ReDoS).

locations:
