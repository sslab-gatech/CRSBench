id: cpv_0

name: OS Command Injection in PNG zTXt Chunk Keyword Processing

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-78
- CWE-88
- CWE-20

description: |
  An OS command injection vulnerability exists in the PngChunkZtxt constructor
  in the Apache Commons Imaging library. The vulnerability occurs when processing
  PNG zTXt chunks, where a keyword field extracted from the PNG file is directly
  concatenated into a shell command string without sanitization or validation.
  The unsanitized keyword is then passed to ProcessBuilder and executed as OS
  commands. An attacker can craft a malicious PNG file with a specially crafted
  zTXt chunk keyword (e.g., containing semicolons or other shell metacharacters)
  to execute arbitrary commands with the privileges of the Java process. This can
  lead to remote code execution, data exfiltration, or denial of service.

