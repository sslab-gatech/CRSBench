id: cpv_1

name: Regular Expression Injection in GIF ApplicationExtension Parser

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-1333
- CWE-20
- CWE-74

description: |
  A Regular Expression Injection vulnerability exists in the ApplicationExtension
  constructor in the Apache Commons Imaging library's GIF parser. The constructor
  concatenates untrusted input from a GIF file's application extension label
  directly into a regex pattern without proper escaping. When the label contains
  regex metacharacters (such as parentheses, brackets, or other special characters),
  it causes a PatternSyntaxException or could lead to Regular Expression Denial of
  Service (ReDoS) through catastrophic backtracking. An attacker can craft a
  malicious GIF file with a specially crafted application extension label to trigger
  this vulnerability, affecting application availability.

locations:
- type: crash_site
  path_from_root: src/main/java/org/apache/commons/imaging/formats/gif/ApplicationExtension.java
  function_name: ApplicationExtension
  startLine: 34
  startColumn: 0
  endLine: 34
  endColumn: 0