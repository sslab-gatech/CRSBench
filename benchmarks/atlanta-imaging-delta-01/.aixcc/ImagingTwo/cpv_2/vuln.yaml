id: cpv_2

name: XPath Injection in PatSegment JPEG Segment Parser

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-643
- CWE-91

description: |
  An XPath injection vulnerability exists in the getEntryPointFromSegmentData
  method of the PatSegment class. The method constructs an XPath query by
  directly concatenating unsanitized user input from JPEG segment data without
  validation or escaping. An attacker can inject malicious XPath syntax through
  a specially crafted JPEG file, potentially leading to information disclosure,
  authentication bypass, or denial of service.

locations:
- type: crash_site
  path_from_root: src/main/java/org/apache/commons/imaging/formats/jpeg/segments/PatSegment.java
  function_name: getEntryPointFromSegmentData
  startLine: 93
  startColumn: 1
  endLine: 93
  endColumn: 79