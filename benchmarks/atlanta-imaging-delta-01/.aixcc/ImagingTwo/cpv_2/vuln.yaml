id: cpv_2

name: XPath Injection in JPEG PAT Segment Parser

cwes:
- CWE-643
- CWE-20

description: |
  An XPath injection vulnerability exists in the Apache Commons Imaging library's
  JPEG PAT (Patent) segment parser. The vulnerability occurs in the PatSegment class
  when parsing custom PAT segments (marker 0xFFFD) in JPEG files. The getEntryPointFromSegmentData
  method directly concatenates a user-controlled key parameter into an XPath query string
  without validation or sanitization at line 74: xpath.compile("//entry[@key='" + key + "']").
  
  An attacker can craft a malicious JPEG file with a PAT segment containing a specially
  crafted key that includes XPath metacharacters (e.g., single quotes). This can lead to
  XPath expression syntax errors causing denial of service, potential information disclosure
  by extracting unauthorized data from XML documents, or bypassing intended access controls
  in the XML structure. The vulnerability affects any application processing untrusted JPEG
  files using Apache Commons Imaging library methods that parse JPEG metadata.

locations:
- path_from_root: src/main/java/org/apache/commons/imaging/formats/jpeg/segments/PatSegment.java
  function_name: getEntryPointFromSegmentData
  startLine: 74
  startColumn: 0
  endLine: 74
  endColumn: 0