id: cpv_0

name: OS Command Injection in PNG zTXt Chunk Parser

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-78
- CWE-77

description: |
  An OS Command Injection vulnerability exists in the PngChunkZtxt constructor
  in Apache Commons Imaging's PNG parser. When parsing a PNG file's zTXt chunk,
  the keyword field is extracted from attacker-controlled data and directly
  concatenated into a shell command string without validation or sanitization.
  This allows an attacker to craft a malicious PNG file with a specially crafted
  zTXt chunk keyword (e.g., containing semicolons or other shell metacharacters)
  to execute arbitrary system commands via ProcessBuilder. This can lead to remote
  code execution, complete system compromise, data exfiltration, or malware installation.

