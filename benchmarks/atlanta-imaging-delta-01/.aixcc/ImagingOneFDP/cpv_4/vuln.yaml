id: cpv_4
name: Regular Expression Injection in Apache Commons Imaging GIF ApplicationExtension Parser

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-1333
- CWE-400
- CWE-730

description: |
  A Regular Expression Injection (ReDoS) vulnerability exists in the ApplicationExtension
  class constructor in the Apache Commons Imaging library's GIF image parser. The vulnerability
  occurs at line 34 where untrusted user input from GIF file parsing is directly concatenated
  into a regular expression pattern without sanitization. When processing a malicious GIF file,
  an attacker can inject special regex metacharacters in the application extension label field
  that cause PatternSyntaxException crashes or catastrophic backtracking leading to CPU exhaustion.
  This can result in denial of service through resource exhaustion and application crashes in
  server-side image processing systems.

locations:
- type: crash_site
  path_from_root: src/main/java/org/apache/commons/imaging/formats/gif/ApplicationExtension.java
  function_name: ApplicationExtension
  startLine: 34
  startColumn: 0
  endLine: 34
  endColumn: 0