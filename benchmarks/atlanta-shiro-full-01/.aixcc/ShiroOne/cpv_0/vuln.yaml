id: cpv_0

name: Apache Shiro RememberMe Deserialization RCE

origin: 1-day

release_date: 06/07/2016

references:
- https://nvd.nist.gov/vuln/detail/CVE-2016-4437
- https://shiro.apache.org/security-reports.html

cwes:
- CWE-502
- CWE-78

description: |
  An insecure deserialization vulnerability exists in Apache Shiro's "Remember Me"
  functionality in the convertBytesToPrincipals method of AbstractRememberMeManager.
  The method blindly deserializes untrusted user-controlled data from the rememberMe
  cookie without proper validation using Java's native ObjectInputStream.readObject().
  This allows attackers to execute arbitrary code through deserialization gadget chains
  (e.g., PriorityQueue -> BeanComparator -> TemplatesImpl) present in the classpath,
  leading to remote code execution via OS command injection. The vulnerability enables
  authentication bypass and complete system compromise.

locations:
- type: crash_site
  path_from_root: core/src/main/java/org/apache/shiro/mgt/AbstractRememberMeManager.java
  function_name: convertBytesToPrincipals
  startLine: 427
  startColumn: 1
  endLine: 432
  endColumn: 5