patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
full_mode:
  base_commit: d0de0fdeb4ff004fed99b5bffa6bac75a8e0d9f1
harness_files:
- name: ArchiverArFuzzer
  path: $PROJECT/ArchiverArFuzzer.java
- name: ArchiverArjFuzzer
  path: $PROJECT/ArchiverArjFuzzer.java
- name: ArchiverCpioFuzzer
  path: $PROJECT/ArchiverCpioFuzzer.java
- name: ArchiverDumpFuzzer
  path: $PROJECT/ArchiverDumpFuzzer.java
- name: ArchiverTarStreamFuzzer
  path: $PROJECT/ArchiverTarStreamFuzzer.java
- name: ArchiverZipStreamFuzzer
  path: $PROJECT/ArchiverZipStreamFuzzer.java
- name: CompressorBZip2Fuzzer
  path: $PROJECT/CompressorBZip2Fuzzer.java
- name: CompressorDeflate64Fuzzer
  path: $PROJECT/CompressorDeflate64Fuzzer.java
- name: CompressorGzipFuzzer
  path: $PROJECT/CompressorGzipFuzzer.java
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueCritical: OS Command Injection'
- name: CompressorLZ4Fuzzer
  path: $PROJECT/CompressorLZ4Fuzzer.java
- name: CompressorSnappyFuzzer
  path: $PROJECT/CompressorSnappyFuzzer.java
- name: CompressorZFuzzer
  path: $PROJECT/CompressorZFuzzer.java
- name: CompressSevenZFuzzer
  path: $PROJECT/CompressSevenZFuzzer.java
- name: CompressTarFuzzer
  path: $PROJECT/CompressTarFuzzer.java
  vulns:
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueHigh: Remote Code Execution'
- name: CompressZipFuzzer
  path: $PROJECT/CompressZipFuzzer.java
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueMedium: Server Side Request Forgery
        (SSRF)'
- name: ExpanderFuzzer
  path: $PROJECT/ExpanderFuzzer.java
  vulns:
  - vuln_keyword: cpv_3
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueCritical: File path traversal'
