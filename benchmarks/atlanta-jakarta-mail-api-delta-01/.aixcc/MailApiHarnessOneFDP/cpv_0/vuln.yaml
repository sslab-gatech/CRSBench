id: cpv_0

name: XXE-based SSRF in Jakarta Mail text/xml Handler

cwes:
- CWE-918
- CWE-611
- CWE-827

description: |
  Server-Side Request Forgery (SSRF) vulnerability in the Jakarta Mail API's text_xml 
  data content handler caused by XML External Entity (XXE) injection. The text_xml.writeTo() 
  method creates a TransformerFactory instance without configuring security features to 
  prevent XXE processing. When processing XML content from untrusted sources (e.g., email 
  MIME messages), an attacker can embed malicious XML with external entity declarations 
  that reference external URLs. This allows attackers to perform SSRF attacks, potentially 
  leading to information disclosure from internal services, internal network reconnaissance, 
  denial of service through entity expansion attacks, and in some configurations, remote 
  code execution.

locations:
- path_from_root: core/src/main/java/org/eclipse/angus/mail/handlers/text_xml.java
  function_name: writeTo
  startLine: 89
  startColumn: 0
  endLine: 95
  endColumn: 0