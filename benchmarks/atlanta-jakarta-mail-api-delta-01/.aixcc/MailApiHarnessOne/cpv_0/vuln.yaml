id: cpv_0

name: XML External Entity (XXE) Injection in Angus Mail text_xml Handler

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-611
- CWE-918

description: |
  An XML External Entity (XXE) injection vulnerability exists in the writeTo()
  method of the text_xml handler class in Eclipse Angus Mail. The vulnerability
  occurs because the TransformerFactory is created without secure XML processing
  features enabled. By default, the XML parser processes external entities
  defined in Document Type Definitions (DTDs), allowing an attacker to define
  external entities that reference remote URLs. This forces the application to
  make HTTP requests to attacker-controlled servers, leading to Server-Side
  Request Forgery (SSRF). The vulnerability can be exploited to exfiltrate
  sensitive data, access internal network resources, or perform denial of service
  attacks.

locations:
- type: root_cause
  path_from_root: core/src/main/java/org/eclipse/angus/mail/handlers/text_xml.java
  function_name: writeTo
  startLine: 89
  startColumn: 0
  endLine: 90
  endColumn: 0