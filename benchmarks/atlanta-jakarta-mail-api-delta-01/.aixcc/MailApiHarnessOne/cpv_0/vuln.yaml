id: cpv_0

name: XML External Entity (XXE) Injection Leading to SSRF in Jakarta Mail XML Handler

cwes:
- CWE-611
- CWE-918
- CWE-827

description: |
  This vulnerability is a Server-Side Request Forgery (SSRF) attack caused by XML External Entity (XXE) injection
  in the Jakarta Mail API's XML content handler. The text_xml.writeTo() method in the 
  org.eclipse.angus.mail.handlers.text_xml class creates a TransformerFactory instance without disabling external
  entity processing. When processing email messages with text/xml or application/xml content types, an attacker
  can inject malicious XML containing external entity declarations that reference remote resources.
  
  The vulnerability occurs because TransformerFactory.newInstance().newTransformer() is called without security
  restrictions, allowing the XML parser to process external entities defined in malicious XML documents. An attacker
  can craft a MIME message with a DOCTYPE declaration defining an external entity pointing to an attacker-controlled
  URL. When the XML parser resolves this entity, it makes an unauthorized HTTP request, enabling SSRF attacks.
  
  The impact includes information disclosure through exfiltration of sensitive data from internal systems, internal
  network scanning to probe services and identify active hosts/ports, denial of service by consuming server resources,
  and potential remote code execution through file:// URIs to read sensitive files.

locations:
- path_from_root: core/src/main/java/org/eclipse/angus/mail/handlers/text_xml.java
  function_name: writeTo
  startLine: 87
  startColumn: 0
  endLine: 95
  endColumn: 0