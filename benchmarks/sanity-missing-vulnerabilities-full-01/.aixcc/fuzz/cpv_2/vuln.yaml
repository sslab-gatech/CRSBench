id: cpv_2

name: Intra-object Buffer Overflow in set_username via Incorrect Buffer Size Calculation

cwes:
- CWE-131
- CWE-787
- CWE-120

description: |
  An intra-object buffer overflow vulnerability exists in the set_username() function in user.c.
  The vulnerability is caused by an incorrect buffer size calculation in UserSession::get_max_copy()
  which returns the size from the username field to the end of the entire UserSession object,
  rather than the actual 16-byte size of the username buffer. The method incorrectly calculates
  sizeof(UserSession) - offsetof(UserSession, username), which includes subsequent fields (post,
  privilege_level) and padding. When user-supplied data contains a username length greater than
  16 bytes (e.g., 38 bytes), the unchecked memcpy operation writes beyond the username buffer
  boundaries, corrupting adjacent object fields within the UserSession structure. This can lead
  to memory corruption, privilege escalation by overwriting the privilege_level field, and
  undefined behavior affecting session state integrity.

locations:
- path_from_root: user.c
  function_name: set_username
  startLine: 5
  startColumn: 5
  endLine: 5
  endColumn: 5