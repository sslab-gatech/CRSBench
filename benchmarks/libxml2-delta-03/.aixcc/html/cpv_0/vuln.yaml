id: cpv_0

name: Heap Based Buffer Overflow in UTF-32 implementation.

cwes:
- CWE-122

description: The goal of this challenge is to test CRS' ability to comprehend disconnected parts of code. The encoders in
  libxml2 are written in a generic way, where first an encoder is loaded into a function pointer based on libxml2's detection
  based on reading the first few bytes of the file. Then, much later in the code, encoders are called to ingest the file,
  and there are baseline assumptions of a certain buffer size constraint; and when this new code is added (there aren't implicit
  vulnerabilities in the new added code), it violates this assumption. So, apart from libxml2, there is no bug in the UTF-32
  encoder if supplied with proper data, but the assumptions in libxml2 will cause an exploitable bug to be to be present with
  this disconnect.

locations:
- path_from_root: xmlIO.c
  function_name: UTF32ToUTF8
  startLine: 2168
  startColumn: 17
  endLine: 2177
  endColumn: 4
