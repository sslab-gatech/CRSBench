id: cpv_1

name: Out-of-bounds Array Access in func_b due to Missing Input Validation

cwes:
- CWE-125
- CWE-20
- CWE-823

description: |
  An out-of-bounds array access vulnerability exists in the func_b() function in mock_vp.c.
  The function reads an integer value from user input via scanf() without performing bounds
  checking, then directly uses this value as an index to access the global items[3][10] array.
  When the input value is outside the valid range [0-2], the program attempts to access memory
  outside the array bounds, leading to a segmentation fault. The vulnerability is triggered when
  an attacker provides an out-of-range index (e.g., 501), causing the program to dereference
  an invalid memory address when attempting to print the array contents. This can result in
  application crash (denial of service), potential information disclosure through out-of-bounds
  reads, or in certain scenarios could be chained with other vulnerabilities for code execution.

locations:
- path_from_root: mock-cp-src/mock_vp.c
  function_name: func_b
  startLine: 24
  startColumn: 0
  endLine: 27
  endColumn: 0