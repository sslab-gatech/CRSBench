id: cpv_1

name: Out-of-bounds array access in func_b

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-129
- CWE-787
- CWE-125

description: |
  An out-of-bounds array access vulnerability exists in the func_b function
  in mock_vp.c. The function accepts user input for an array index without
  performing bounds validation before using it to access the items array.
  When an out-of-bounds index is provided (e.g., 501 for a 3-element array),
  the code computes a wild pointer that points to unmapped memory, leading
  to a segmentation fault when dereferenced. This can lead to information
  disclosure, denial of service, or potentially arbitrary code execution
  depending on the context.

