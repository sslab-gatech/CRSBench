id: cpv_0

name: Global buffer overflow in func_a via strcspn index

cwes:
- CWE-787
- CWE-120
- CWE-119

description: |
  A global buffer overflow vulnerability exists in the func_a() function of mock_vp.c.
  The vulnerability occurs when processing user input through fgets() and strcspn() functions.
  
  The global array items[3][5] allocates only 15 bytes of memory, but the code reads input
  using fgets(buff, 4, stdin) and then attempts to remove newline characters using
  buff[strcspn(buff, "\n")] = 0. When the input does not contain a newline character within
  the buffer boundaries, strcspn() may search beyond the allocated buffer and return a large
  offset value. This large offset is then used as an array index for writing a null terminator,
  causing an out-of-bounds write of up to 38 bytes.
  
  The overflow corrupts adjacent global variables (specifically the pipefd array) and can lead
  to memory corruption, arbitrary code execution, denial of service, and data integrity issues.
  AddressSanitizer detected the vulnerability as a multi-byte write global buffer overflow with
  a scariness score of 45.

locations:
- path_from_root: mock-cp-src/mock_vp.c
  function_name: func_a
  startLine: 14
  startColumn: 9
  endLine: 14
  endColumn: 9