id: cpv_0

name: Global buffer overflow in func_a via oversized fgets

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-787
- CWE-120
- CWE-131

description: |
  A global buffer overflow vulnerability exists in the func_a function in
  mock_vp.c. The items array is declared as char items[3][10], providing
  3 items of 10 bytes each. However, at line 14, fgets(buff, 40, stdin)
  attempts to read up to 40 bytes into a buffer that can only hold 10 bytes.
  This buffer size mismatch creates a 30-byte overflow potential. When input
  exceeds 10 bytes, it overflows into adjacent memory, potentially corrupting
  other global variables or causing crashes. This can lead to denial of
  service or arbitrary code execution.

locations:
- type: crash_site
  path_from_root: mock_vp.c
  function_name: func_a
  startLine: 14
  startColumn: 9
  endLine: 14
  endColumn: 9