id: cpv_2

name: SSRF via WADL Stylesheet Parameter

origin: 1-day

release_date: 07/19/2024

references:
- https://nvd.nist.gov/vuln/detail/CVE-2024-29736
- https://github.com/advisories/GHSA-5m3j-pxh7-455p
- https://cxf.apache.org/security-advisories.data/CVE-2024-29736.txt

cwes:
- CWE-918

description: |
  A Server-Side Request Forgery (SSRF) vulnerability exists in Apache CXF's 
  WADL service description functionality. The vulnerability allows an attacker 
  to force the server to make HTTP/HTTPS requests to arbitrary URLs. The root 
  cause is in the doFilter method of WadlGenerator.java which improperly 
  validates user-supplied path parameters when stylesheetReference is configured. 
  The code checks if a path ends with .xsl but fails to validate that the path 
  refers only to legitimate local resources, allowing attackers to specify 
  arbitrary external URLs. This can lead to data exfiltration, internal network 
  scanning, credential theft, and bypass of access controls.

locations:
- type: root_cause
  path_from_root: rt/rs/description/src/main/java/org/apache/cxf/jaxrs/model/wadl/WadlGenerator.java
  function_name: doFilter
  startLine: 245
  startColumn: 1
  endLine: 248
  endColumn: 50
- type: crash_site
  path_from_root: rt/frontend/jaxrs/src/main/java/org/apache/cxf/jaxrs/utils/ResourceUtils.java
  function_name: getResourceStream
  startLine: 577
  startColumn: 1
  endLine: 577
  endColumn: 50