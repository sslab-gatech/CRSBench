id: cpv_0

name: Apache CXF XOP Include SSRF via Content-ID URL Injection

origin: 1-day

release_date: 12/13/2022

references:
- https://nvd.nist.gov/vuln/detail/CVE-2022-46364
- https://github.com/advisories/GHSA-x3x3-qwjq-8gj4
- https://issues.apache.org/jira/browse/CXF-8706
- https://cxf.apache.org/security-advisories.data/CVE-2022-46364.txt

cwes:
- CWE-918
- CWE-20

description: |
  A Server-Side Request Forgery (SSRF) vulnerability exists in Apache CXF's
  handling of XOP:Include elements in MTOM (Message Transmission Optimization
  Mechanism) requests. The getAttachmentDataSource function in AttachmentUtil.java
  fails to properly validate that the href attribute uses only the "cid:" URI
  scheme per RFC-2392. When processing a contentId starting with "cid:", the code
  strips the prefix but does not prevent the remaining string from containing
  arbitrary URLs. An attacker can provide a malicious contentId like
  "cid:http://attacker.example.com/exploit" which after stripping becomes
  "http://attacker.example.com/exploit", causing the application to create a
  URLDataSource with the attacker-controlled URL. This allows attackers to
  exfiltrate sensitive data from internal services, manipulate internal services,
  or use the server for DDoS attacks.

locations:
- type: root_cause
  path_from_root: core/src/main/java/org/apache/cxf/attachment/AttachmentUtil.java
  function_name: getAttachmentDataSource
  startLine: 556
  startColumn: 1
  endLine: 561
  endColumn: 80