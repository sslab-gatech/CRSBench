id: cpv_1

name: Apache CXF SSRF via MTOM Attachment XOP Include href

origin: 1-day

release_date: 12/13/2022

references:
- https://nvd.nist.gov/vuln/detail/CVE-2022-46364
- https://github.com/advisories/GHSA-x3x3-qwjq-8gj4
- https://cxf.apache.org/security-advisories.html

cwes:
- CWE-918

description: |
  A Server-Side Request Forgery (SSRF) vulnerability exists in the AttachmentUtil.getAttachment
  method in Apache CXF's MTOM attachment handling. When processing XOP:Include elements, if an
  attachment ID is not found in the local collection, the method unconditionally attempts to
  fetch the ID as a remote URL without validation. An attacker can provide an arbitrary URL in
  the href attribute, causing the server to make HTTP/HTTPS requests to attacker-specified
  destinations. This enables information disclosure, port scanning, data exfiltration, and
  bypassing network security controls.

locations:
- type: crash_site
  path_from_root: rt/databinding/aegis/src/main/java/org/apache/cxf/aegis/type/mtom/AttachmentUtil.java
  function_name: getAttachment
  startLine: 71
  startColumn: 1
  endLine: 77
  endColumn: 78