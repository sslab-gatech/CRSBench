id: cpv_1

name: Apache CXF XOP Attachment SSRF via Unvalidated URL Loading

cwes:
- CWE-918
- CWE-20

description: |
  Server-Side Request Forgery (SSRF) vulnerability in Apache CXF's AttachmentUtil class.
  The getAttachment() method unconditionally attempts to load remote URLs when an attachment
  is not found in the local collection. When processing XOP Include references, if an
  attachment ID is not found locally, the method treats the ID as a URL and attempts to
  fetch it remotely without validation or security controls. An attacker can exploit this
  by providing a malicious URL in the attachment reference, causing the server to make
  unauthorized HTTP/HTTPS requests to internal or external systems. This can lead to data
  exfiltration, internal network reconnaissance, bypassing access controls, or denial of
  service. The vulnerability occurs at lines 71-77 where URLDataSource is created with
  user-controlled input without checking if URL following should be allowed.

locations:
- path_from_root: rt/databinding/aegis/src/main/java/org/apache/cxf/aegis/type/mtom/AttachmentUtil.java
  function_name: getAttachment
  startLine: 71
  startColumn: 0
  endLine: 77
  endColumn: 0