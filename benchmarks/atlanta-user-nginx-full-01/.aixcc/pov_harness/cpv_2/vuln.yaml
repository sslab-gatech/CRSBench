id: cpv_2

name: Integer Underflow in nginx HTTP Sub Filter Module Once Mode

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-191
- CWE-787
- CWE-682

description: |
  An integer underflow vulnerability exists in the ngx_http_sub_parse function
  in src/http/modules/ngx_http_sub_filter_module.c. When the ctx->once flag is
  set (indicating substitution should only happen once), an off-by-one error in
  the offset calculation causes downstream integer underflow. This results in a
  negative size parameter being passed to ngx_cpymem (memcpy wrapper) at line 735,
  triggering AddressSanitizer's negative-size-param detection. The vulnerability
  can lead to crashes and potential memory corruption.

locations:
- type: root_cause
  path_from_root: src/http/modules/ngx_http_sub_filter_module.c
  function_name: ngx_http_sub_parse
  startLine: 631
  startColumn: 18
  endLine: 631
  endColumn: 18
- type: crash_site
  path_from_root: src/http/modules/ngx_http_sub_filter_module.c
  function_name: ngx_http_sub_parse
  startLine: 735
  startColumn: 9
  endLine: 735
  endColumn: 9