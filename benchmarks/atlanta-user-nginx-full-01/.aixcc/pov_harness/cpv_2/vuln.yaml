id: cpv_2

name: Integer Underflow in nginx HTTP Substitution Filter Leading to Negative Size Parameter

cwes:
- CWE-191
- CWE-787
- CWE-682

description: |
  An integer underflow vulnerability exists in the nginx HTTP substitution filter module
  (ngx_http_sub_filter_module.c), specifically in the ngx_http_sub_parse() function.
  When the sub_filter_once directive is enabled, the code incorrectly calculates the offset
  value as `offset = end + (ngx_int_t) tables->min_match_len`, which can cause offset to
  exceed the end value. This leads to a negative result when calculating `end - len` at
  line 735, which wraps around to a very large unsigned value when passed to ngx_cpymem().
  This causes an out-of-bounds memory write, potentially leading to memory corruption, denial
  of service, or arbitrary code execution. The vulnerability is triggered by specially crafted
  HTTP requests processed by the substitution filter.

locations:
- path_from_root: src/http/modules/ngx_http_sub_filter_module.c
  function_name: ngx_http_sub_parse
  startLine: 735
  startColumn: 9
  endLine: 735
  endColumn: 9