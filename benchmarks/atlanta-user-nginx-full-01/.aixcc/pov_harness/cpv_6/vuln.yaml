id: cpv_6

name: nginx HTTP Chunked Transfer Encoding NULL Pointer Dereference

cwes:
- CWE-476
- CWE-252

description: |
  A NULL pointer dereference vulnerability in nginx's HTTP chunked transfer encoding parser.
  When processing HTTP requests with Transfer-Encoding: chunked headers, the
  ngx_http_discard_request_body_filter function allocates a new request body structure but
  explicitly sets rb->chunked to NULL instead of properly initializing it. This NULL pointer
  is then passed to ngx_http_parse_chunked, which immediately dereferences it by accessing
  ctx->state, causing a segmentation fault. An attacker can trigger this vulnerability by
  sending specially crafted HTTP requests with chunked transfer encoding, leading to denial
  of service by crashing nginx worker processes.

locations:
- path_from_root: src/http/ngx_http_parse.c
  function_name: ngx_http_parse_chunked
  startLine: 2171
  startColumn: 18
  endLine: 2171
  endColumn: 18
- path_from_root: src/http/ngx_http_request_body.c
  function_name: ngx_http_discard_request_body_filter
  startLine: 863
  startColumn: 0
  endLine: 870
  endColumn: 0