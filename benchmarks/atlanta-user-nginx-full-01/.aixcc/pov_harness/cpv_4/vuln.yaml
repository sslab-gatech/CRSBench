id: cpv_4

name: Heap buffer overflow in nginx WebDAV COPY operation

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-131
- CWE-787

description: |
  A heap-based buffer overflow vulnerability exists in the ngx_http_dav_copy_tree_file
  function in src/http/modules/ngx_http_dav_module.c. The function correctly calculates
  the required buffer size but then allocates a hardcoded 10-byte buffer instead of using
  the calculated length. When processing WebDAV COPY requests with destination paths longer
  than 10 bytes, the subsequent ngx_cpymem call writes beyond the allocated buffer boundary,
  causing heap corruption. This can lead to denial of service, memory corruption, or
  potential code execution depending on heap layout and overflow size.

locations:
- type: root_cause
  path_from_root: src/http/modules/ngx_http_dav_module.c
  function_name: ngx_http_dav_copy_tree_file
  startLine: 975
  startColumn: 12
  endLine: 975
  endColumn: 35
- type: crash_site
  path_from_root: src/http/modules/ngx_http_dav_module.c
  function_name: ngx_http_dav_copy_tree_file
  startLine: 980
