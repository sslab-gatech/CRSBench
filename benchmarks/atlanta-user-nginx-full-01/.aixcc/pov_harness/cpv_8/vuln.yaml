id: cpv_8

name: Stack Buffer Overflow in HTTP Version Parsing

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-121
- CWE-787
- CWE-120

description: |
  A stack-based buffer overflow vulnerability exists in the ngx_http_parse_request_line
  function in src/http/ngx_http_parse.c. When parsing HTTP request lines with minor
  version numbers exceeding 99, the code allocates a 3-byte stack buffer but uses
  sprintf without bounds checking. For minor version numbers with 4 or more digits
  (e.g., "HTTP/1.1110"), the sprintf call writes beyond the allocated buffer, causing
  stack corruption. This can lead to arbitrary code execution or denial of service.

locations:
- type: crash_site
  path_from_root: src/http/ngx_http_parse.c
  function_name: ngx_http_parse_request_line
  startLine: 765
  startColumn: 17
  endLine: 765
  endColumn: 17