id: cpv_5

name: Nginx HTTP Header Name Heap Buffer Overflow

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap buffer overflow vulnerability exists in nginx's HTTP request header processing.
  In the ngx_http_process_request_headers() function, a fixed-size buffer of 32 bytes
  (NGX_HTTP_LC_HEADER_LEN) is allocated to store the lowercase version of an HTTP header name.
  However, the code then copies h->key.len bytes into this buffer without validating that
  the header name length does not exceed 32 bytes. When an HTTP request contains a header
  name longer than 32 characters, the ngx_strlow() function writes beyond the allocated
  buffer boundary, causing a heap buffer overflow. This can lead to memory corruption,
  denial of service, and potentially arbitrary code execution depending on what heap data
  is overwritten.

locations:
- path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_process_request_headers
  startLine: 1483
  startColumn: 0
  endLine: 1493
  endColumn: 0