id: cpv_7

name: NULL pointer dereference in nginx URI processing for empty path absolute-form URIs

origin: synthetic

release_date: 02/01/2026

references:
- https://trac.nginx.org/nginx/ticket/2079

cwes:
- CWE-476
- CWE-665

description: |
  A NULL pointer dereference vulnerability exists in nginx's HTTP request processing
  when handling absolute-form URIs with empty paths followed by query strings
  (e.g., "GET http://localhost? HTTP/1.1"). The ngx_http_process_request_uri function
  in src/http/ngx_http_request.c incorrectly skips memory allocation for r->uri.data
  when the empty_path_in_uri flag is set. Subsequently, ngx_http_parse_complex_uri
  attempts to write a '/' character to the NULL pointer, causing a SEGV. This leads
  to worker process crashes and denial of service. The issue affects nginx's ability
  to properly handle RFC 7230 and RFC 3986 compliant absolute-form request URIs.

locations:
- type: crash_site
  path_from_root: src/http/ngx_http_parse.c
  function_name: ngx_http_parse_complex_uri
  startLine: 1277
  startColumn: 14
  endLine: 1277
  endColumn: 14
- type: root_cause
  path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_process_request_uri
  startLine: 1258
  startColumn: 1
  endLine: 1264
  endColumn: 9