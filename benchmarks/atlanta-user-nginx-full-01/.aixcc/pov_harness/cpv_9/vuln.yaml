id: cpv_9

name: Type confusion via custom ATLANTA HTTP method

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-843
- CWE-704
- CWE-822

description: |
  A type confusion vulnerability exists in the HTTP request parser when
  processing a custom "ATLANTA" HTTP method. The parser incorrectly casts
  the integer constant NGX_HTTP_ATLANTA (0x00020000) to a pointer type and
  assigns it to r->connection. When subsequent code attempts to dereference
  this invalid pointer in ngx_http_read_request_header, it causes a
  segmentation fault. This vulnerability can be remotely triggered by
  sending a crafted HTTP request with "ATLANTA" as the method, leading to
  denial of service.

locations:
- type: root_cause
  path_from_root: src/http/ngx_http_parse.c
  function_name: ngx_http_parse_request_line
  startLine: 252
  startColumn: 1
  endLine: 255
  endColumn: 60
- type: crash_site
  path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_read_request_header
  startLine: 1562
  startColumn: 1
  endLine: 1563
  endColumn: 40