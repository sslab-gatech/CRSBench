id: cpv_9

name: nginx Custom Method Type Confusion Leading to Denial of Service

cwes:
- CWE-843
- CWE-704
- CWE-822

description: |
  A type confusion vulnerability in nginx's HTTP request parsing code that occurs when
  processing a specially crafted HTTP request with a custom "ATLANTA" method. In the
  ngx_http_parse_request_line function (ngx_http_parse.c), when parsing a 7-character
  HTTP method matching "ATLANTA", the code incorrectly casts the integer constant
  NGX_HTTP_ATLANTA (0x00020000) to a pointer type and assigns it to r->connection,
  corrupting the connection pointer. When ngx_http_read_request_header later attempts
  to dereference this invalid pointer to access the connection's read event, it triggers
  a segmentation fault at address 0x000000020008. This vulnerability allows remote
  attackers to cause a denial of service by crashing the nginx worker process with a
  single crafted HTTP request containing "ATLANTA" as the method. No authentication is
  required to exploit this vulnerability.

locations:
- path_from_root: src/http/ngx_http_parse.c
  function_name: ngx_http_parse_request_line
  startLine: 252
  startColumn: 0
  endLine: 255
  endColumn: 0