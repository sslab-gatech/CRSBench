id: cpv_0

name: Heap Buffer Overflow in nginx userid Cookie Base64 Decoding

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-787
- CWE-120

description: |
  A heap buffer overflow vulnerability exists in nginx's userid filter module
  during base64 decoding of HTTP cookies. The ngx_http_userid_get_uid function
  checks for minimum cookie length (22 bytes) but does not enforce a maximum
  length before passing the cookie value to ngx_decode_base64. The destination
  buffer ctx->uid_got is a fixed-size array (16 bytes), which can only hold
  decoded data from 22 bytes of base64 input. When a cookie value longer than
  22 bytes is provided, the base64 decoding writes beyond the allocated buffer,
  resulting in heap memory corruption. This can lead to arbitrary code execution
  or denial of service.

locations:
- type: crash_site
  path_from_root: src/core/ngx_string.c
  function_name: ngx_decode_base64_internal
  startLine: 1330
  startColumn: 14
  endLine: 1330
  endColumn: 14
- type: root_cause
  path_from_root: src/http/modules/ngx_http_userid_filter_module.c
  function_name: ngx_http_userid_get_uid
  startLine: 357
  startColumn: 5
  endLine: 357
  endColumn: 5