id: cpv_3

name: nginx FLV Module NULL Pointer Dereference via Invalid Start Parameter

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-476
- CWE-703

description: |
  A NULL pointer dereference vulnerability exists in the nginx FLV module's
  request handler (ngx_http_flv_handler). When processing HTTP requests with
  a 'start' query parameter for FLV pseudo-streaming, if the start value is
  greater than or equal to the file length, the code sets the request pointer
  to NULL to mark the request as invalid. However, execution continues without
  checking if the pointer is NULL, and subsequently attempts to access
  r->headers_out.status, causing a segmentation fault. This can be exploited
  by a remote attacker to crash nginx worker processes, leading to denial of
  service.

locations:
- type: crash_site
  path_from_root: src/http/modules/ngx_http_flv_module.c
  function_name: ngx_http_flv_handler
  startLine: 192
  startColumn: 27
  endLine: 192
  endColumn: 27
- type: root_cause
  path_from_root: src/http/modules/ngx_http_flv_module.c
  function_name: ngx_http_flv_handler
  startLine: 178
  startColumn: 13
  endLine: 181
  endColumn: 27