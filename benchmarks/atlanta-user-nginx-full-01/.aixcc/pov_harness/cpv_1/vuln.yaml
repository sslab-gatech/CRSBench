id: cpv_1

name: nginx HTTP Request URI Heap Buffer Overflow

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap buffer overflow vulnerability exists in nginx's HTTP request processing code.
  When processing HTTP requests with complex URIs containing URL-encoded characters,
  the ngx_http_process_request_uri function allocates a fixed 128-byte buffer for URI
  data, regardless of the actual URI length. When a URI exceeds 128 bytes, the
  ngx_http_parse_complex_uri function writes past the allocated buffer boundary during
  decoding, causing a heap buffer overflow. An unauthenticated remote attacker can send
  a specially crafted HTTP request with a long URI containing URL-encoded characters to
  trigger memory corruption, potentially leading to denial of service or arbitrary code
  execution.

locations:
- type: crash_site
  path_from_root: src/http/ngx_http_parse.c
  function_name: ngx_http_parse_complex_uri
  startLine: 1298
  startColumn: 22
  endLine: 1298
  endColumn: 22
- type: root_cause
  path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_process_request_uri
  startLine: 1259
  startColumn: 1
  endLine: 1259
  endColumn: 1