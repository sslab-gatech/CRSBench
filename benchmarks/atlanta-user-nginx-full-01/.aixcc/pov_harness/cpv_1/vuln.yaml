id: cpv_1

name: Nginx HTTP URI Parser Heap Buffer Overflow

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap-based buffer overflow vulnerability exists in nginx's HTTP request URI parsing
  functionality within the ngx_http_parse_complex_uri function. When processing HTTP requests
  with complex URIs containing percent-encoded characters, the code allocates a fixed 128-byte
  buffer to store the processed URI. However, the parsing function does not validate that the
  output buffer has sufficient space before writing decoded characters, allowing URIs longer
  than 128 bytes to trigger an out-of-bounds write. An attacker can exploit this by sending
  a crafted HTTP request with a URI exceeding 128 bytes, causing memory corruption that could
  lead to denial of service, arbitrary code execution, or security bypass. The root cause is
  the fixed-size buffer allocation in ngx_http_process_request_uri (line 1259) combined with
  lack of bounds checking during URI processing at line 1298 where characters are written
  beyond the allocated buffer boundary.

locations:
- path_from_root: src/http/ngx_http_parse.c
  function_name: ngx_http_parse_complex_uri
  startLine: 1298
  startColumn: 22
  endLine: 1298
  endColumn: 22