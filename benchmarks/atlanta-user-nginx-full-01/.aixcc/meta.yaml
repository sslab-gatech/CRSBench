patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

full_mode:
  base_commit: bf08577a6f7af7c0fdbb066352e2c5ccbb2aee23

harness_files:
- name: pov_harness
  path: $PROJECT/fuzz/pov_harness.cc
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: negative-size-param'
  - vuln_keyword: cpv_3
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: SEGV'
  - vuln_keyword: cpv_4
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_5
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_6
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: SEGV'
  - vuln_keyword: cpv_7
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: SEGV'
  - vuln_keyword: cpv_8
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: stack-buffer-overflow'
  - vuln_keyword: cpv_9
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: SEGV'
