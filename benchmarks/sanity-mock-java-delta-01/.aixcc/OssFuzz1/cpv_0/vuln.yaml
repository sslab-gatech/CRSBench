id: cpv_0

name: OS Command Injection via Unvalidated executeCommand Input

cwes:
- CWE-78
- CWE-77
- CWE-88

description: |
  A critical OS command injection vulnerability exists in the executeCommand() method of the App class.
  The method accepts arbitrary user-controlled input via the 'data' parameter and passes it directly
  to ProcessBuilder.command() without any validation or sanitization. Despite a code comment stating
  that only 'ls', 'pwd', and 'echo' commands are allowed, the implementation completely lacks any
  enforcement mechanism to validate the input against this policy. This allows an attacker to execute
  arbitrary OS commands with the privileges of the Java process, leading to potential remote code
  execution, system compromise, data exfiltration, and denial of service attacks.

locations:
- path_from_root: src/main/java/com/aixcc/mock_java/App.java
  function_name: executeCommand
  startLine: 14
  startColumn: 0
  endLine: 14
  endColumn: 0