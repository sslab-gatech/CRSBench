patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
full_mode:
  base_commit: 83a644ae818361874db017f9678632eb5f9416ab
harness_files:
- name: api
  path: $REPO/fuzz/api.c
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: attempting double-free'
- name: html
  path: $REPO/fuzz/html.c
- name: lint
  path: $REPO/fuzz/lint.c
- name: reader
  path: $REPO/fuzz/reader.c
- name: regexp
  path: $REPO/fuzz/regexp.c
- name: schema
  path: $REPO/fuzz/schema.c
- name: uri
  path: $REPO/fuzz/uri.c
- name: valid
  path: $REPO/fuzz/valid.c
- name: xinclude
  path: $REPO/fuzz/xinclude.c
- name: xml
  path: $REPO/fuzz/xml.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
- name: xpath
  path: $REPO/fuzz/xpath.c
