id: cpv_0

name: Use-After-Free in drop_note Due to Improper Pointer Nullification

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-416
- CWE-672

description: |
  A use-after-free vulnerability exists in the drop_note function in mock_vp.c.
  After freeing a note structure, the function sets a local pointer variable to NULL
  instead of clearing the entry in the global note_list array. This leaves a dangling
  pointer in note_list that points to freed memory. When view_note is subsequently
  called with the same index, it dereferences the freed memory, leading to a
  heap-use-after-free condition. This vulnerability can potentially lead to arbitrary
  memory read/write operations and code execution in non-ASAN builds.

locations:
- type: root_cause
  path_from_root: cp-user-babynote-src/mock_vp.c
  function_name: drop_note
  startLine: 162
  startColumn: 3
  endLine: 162
  endColumn: 10
- type: crash_site
  path_from_root: cp-user-babynote-src/mock_vp.c
  function_name: view_note
