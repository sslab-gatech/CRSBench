patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
delta_mode:
  base_commit: b57c112dcd52a85aaed0bab544255f7dbf013fbd
  ref_commit: 502302127e1415534d92166f24f17be2d699e4f7
full_mode:
  base_commit: 502302127e1415534d92166f24f17be2d699e4f7
harness_files:
- name: filein_harness
  path: $PROJECT/fuzz/filein_harness.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-use-after-free'
