patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

full_mode:
  base_commit: a492cd96dcf4fed08afb07ff913e83e55e50f39b

harness_files:
- name: POIHMEFFuzzer
  path: $PROJECT/src/main/java/org/apache/poi/POIHMEFFuzzer.java
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: libFuzzer: timeout'
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueLow: Out of memory'

- name: POIPOIFSDumpFuzzer
  path: $PROJECT/src/main/java/org/apache/poi/POIPOIFSDumpFuzzer.java
  vulns:
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueCritical: File path traversal'

