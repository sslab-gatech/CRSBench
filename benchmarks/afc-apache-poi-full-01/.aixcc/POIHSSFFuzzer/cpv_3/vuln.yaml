description: >
  A backdoor in InternalWorkbook.checkName uses reflection to access
  sun.misc.Unsafe and calls putAddress(0, 0) when a sheet name matches a
  hardcoded hex-encoded string. A crafted xls file with the trigger sheet name
  causes a JVM crash (SIGSEGV) via illegal memory access.

