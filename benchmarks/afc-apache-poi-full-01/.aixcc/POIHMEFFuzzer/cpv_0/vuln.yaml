id: cpv_0

name: Infinite reading challenges

author:

validator: Ze Sheng

difficulty_level:

origin: 1-day

release_date: 03/04/2022

reference: https://nvd.nist.gov/vuln/detail/CVE-2022-26336

cwes:
- CWE-834
- CWE-20

description: >
  MAPIAttribute parser fails to apply reasonable limits on the number of loops
  specified by user-controlled data. Further, the parser fails to check for the
  end of the InputStream during read and skip, causing an infinite loop or hang
  when processing a crafted TNEF (winmail.dat) file.

