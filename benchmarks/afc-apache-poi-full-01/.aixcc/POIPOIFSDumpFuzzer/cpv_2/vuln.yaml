origin: 1-day

release_date: 07/23/2025

reference: https://github.com/apache/poi/pull/855

cwes:
- CWE-35
- CWE-20

description: >
  POIFSDump.dump does not validate the file name within an OLE2 container before
  writing extracted content to disk. A crafted OLE2 file can include directory
  traversal sequences (e.g., ../../) in its entry names, allowing writes outside
  the expected output directory.

