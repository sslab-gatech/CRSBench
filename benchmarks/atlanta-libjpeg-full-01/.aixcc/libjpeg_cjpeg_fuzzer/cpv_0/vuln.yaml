id: cpv_0

name: Heap buffer over-read in get_8bit_row via unchecked BMP colormap index

origin: 1-day

release_date: 03/07/2019

references:
- https://nvd.nist.gov/vuln/detail/CVE-2018-14498
- https://github.com/libjpeg-turbo/libjpeg-turbo/issues/258
- https://github.com/libjpeg-turbo/libjpeg-turbo/commit/9c78a04df4e44ef6487eee99c4258397f4fdca55

cwes:
- CWE-125
- CWE-787
- CWE-119

description: |
  A heap-based buffer over-read vulnerability exists in the get_8bit_row()
  function in rdbmp.c when processing 8-bit BMP files with color palettes.
  The function reads pixel data as palette indices and uses them to look up
  RGB values in the colormap array without validating that these indices are
  within the valid range for the allocated colormap size. A maliciously
  crafted 8-bit BMP file can specify a small colormap but include pixel data
  containing palette indices that exceed this size, causing an out-of-bounds
  read when accessing colormap[0][t]. This can lead to denial of service
  through application crash and potential information disclosure by reading
  arbitrary heap memory.

