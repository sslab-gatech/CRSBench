id: cpv_0

name: Stack Buffer Underflow in RPN Calculator Wide Character Print Command

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-787
- CWE-125
- CWE-121

description: |
  A stack buffer underflow vulnerability exists in the main_loop function's
  handling of the 'pw' (print wide character) command. The code iterates
  backwards through the values array without proper bounds checking, allowing
  the loop index to become negative. This causes out-of-bounds reads from the
  values array and out-of-bounds writes to the wcs array, leading to stack
  memory corruption and stack-use-after-return conditions. An attacker can
  trigger this by crafting input that fills the stack with non-zero values,
  causing the loop to continue past valid array boundaries.

