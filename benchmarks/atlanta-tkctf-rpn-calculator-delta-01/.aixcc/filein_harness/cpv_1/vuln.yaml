id: cpv_1

name: Division and Modulo by Zero in RPN Calculator

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-369

description: |
  A division by zero and modulo by zero vulnerability exists in the main_loop
  function of the RPN (Reverse Polish Notation) calculator implementation.
  The calculator performs division (/) and modulo (%) operations without
  checking if the divisor is zero. When the second operand on the stack is
  zero, executing these operations triggers a Floating Point Exception (FPE),
  causing the program to crash. This leads to a deterministic denial of
  service vulnerability.

