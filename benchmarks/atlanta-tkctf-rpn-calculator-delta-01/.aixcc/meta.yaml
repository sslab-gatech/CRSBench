patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: 132d176f97d3e52e1ca5b9bc25dfc90264620cc3
  ref_commit: b1895ecd79336b262e2178c1e663622910f960fc

full_mode:
  base_commit: b1895ecd79336b262e2178c1e663622910f960fc

harness_files:
- name: filein_harness
  path: $PROJECT/fuzz/filein_harness.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: stack-use-after-return'
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: FPE'
