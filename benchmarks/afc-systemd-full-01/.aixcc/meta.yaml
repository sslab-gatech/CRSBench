patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
full_mode:
  base_commit: f4ac1ed1e2e5ddcf827b58bbd4147ac4e7d3694a
harness_files:
- name: fuzz-udev-rule-parse-value
  path: $REPO/src/udev/fuzz-udev-rule-parse-value.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'
- name: fuzz-catalog
  path: $REPO/src/fuzz/fuzz-catalog.c
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'
- name: fuzz-link-parser
  path: $REPO/src/udev/net/fuzz-link-parser.c
  vulns:
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-use-after-free'
- name: fuzz-systemctl-parse-argv
  path: $REPO/src/systemctl/fuzz-systemctl-parse-argv.c
  vulns:
  - vuln_keyword: cpv_3
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: attempting double-free'
- name: fuzz-network-parser
  path: $REPO/src/network/fuzz-network-parser.c
