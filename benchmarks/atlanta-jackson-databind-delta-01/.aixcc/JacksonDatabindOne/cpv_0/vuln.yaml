id: cpv_0

name: Polymorphic deserialization vulnerability in FasterXML jackson-databind

origin: 1-day

release_date: 12/07/2017

references:
- https://nvd.nist.gov/vuln/detail/CVE-2017-17485
- https://github.com/FasterXML/jackson-databind/issues/1855

cwes:
- CWE-502

description: |
  A deserialization vulnerability exists in FasterXML jackson-databind
  versions before 2.8.11 and 2.9.x before 2.9.3. The vulnerability
  allows remote attackers to cause a denial of service or potentially
  have other unspecified impact via a crafted JSON payload that triggers
  unsafe deserialization through the org.springframework.context.support.FileSystemXmlApplicationContext
  class. The issue occurs during polymorphic type handling in the
  BeanDeserializerFactory class.

locations:
- type: crash_site
  path_from_root: src/main/java/com/fasterxml/jackson/databind/deser/BeanDeserializerFactory.java
  function_name: buildThrowableDeserializer
  startLine: 1456
  startColumn: 0
  endLine: 1456
  endColumn: 0
- type: root_cause
  path_from_root: src/main/java/com/fasterxml/jackson/databind/jsontype/impl/SubTypeValidator.java
  function_name: validateSubType
  startLine: 54
  startColumn: 0
  endLine: 66
  endColumn: 0