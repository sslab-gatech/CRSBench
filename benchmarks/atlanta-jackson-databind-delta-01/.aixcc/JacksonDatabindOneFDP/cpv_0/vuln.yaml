id: cpv_0

name: Jackson-databind Unsafe Deserialization via Spring Framework Gadget

origin: 1-day

release_date: 01/10/2018

references:
- https://nvd.nist.gov/vuln/detail/CVE-2017-17485
- https://github.com/advisories/GHSA-rfx6-vp9g-rh7v

cwes:
- CWE-502
- CWE-78
- CWE-184

description: |
  A remote code execution vulnerability exists in FasterXML jackson-databind
  caused by unsafe polymorphic deserialization. The vulnerability allows
  attackers to execute arbitrary code by sending malicious JSON that instructs
  Jackson to deserialize dangerous classes. Specifically, the attack exploits
  org.springframework.context.support.FileSystemXmlApplicationContext to load
  a malicious Spring XML configuration containing Spring Expression Language
  (SpEL) that executes OS commands. The root cause is missing security
  validation in BeanDeserializerFactory that allowed deserialization of any
  Bean-like class without blacklist checking for dangerous classes.

locations:
- type: root_cause
  path_from_root: src/main/java/com/fasterxml/jackson/databind/deser/BeanDeserializerFactory.java
  function_name: createBeanDeserializer
  startLine: 130
  startColumn: 1
  endLine: 134
  endColumn: 50
- type: crash_site
  path_from_root: src/main/java/com/fasterxml/jackson/databind/deser/std/StdValueInstantiator.java
  function_name: createFromString
  startLine: 320
  startColumn: 1
  endLine: 331
  endColumn: 80