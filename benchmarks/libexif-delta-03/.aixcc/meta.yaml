patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: 33e52cd19e4df56fdb363d6ea40245e21d870c7b
  ref_commit: dfb41bfe7bb5f2a513bc364b0dfd142b2dd2c59f

full_mode:
  base_commit: dfb41bfe7bb5f2a513bc364b0dfd142b2dd2c59f

harness_files:
- name: exif_from_data_fuzzer
  path: $PROJECT/exif_from_data_fuzzer.cc
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'

- name: exif_loader_fuzzer
  path: $PROJECT/exif_loader_fuzzer.cc
