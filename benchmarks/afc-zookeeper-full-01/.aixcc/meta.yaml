patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
full_mode:
  base_commit: 68d3aa8164cec45c3fc158c26d73cd845306211d
harness_files:
- name: DataTreeFuzzer
  path: $PROJECT/DataTreeFuzzer.java
- name: MessageTrackerPeekReceivedFuzzer
  path: $PROJECT/MessageTrackerPeekReceivedFuzzer.java
- name: MultiProcessTxnFuzzer
  path: $PROJECT/MultiProcessTxnFuzzer.java
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueHigh: Remote Code Execution'
- name: ProcessTxnFuzzer
  path: $PROJECT/ProcessTxnFuzzer.java
- name: SerializeFuzzer
  path: $PROJECT/SerializeFuzzer.java
