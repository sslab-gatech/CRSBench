patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: 23435ad1d36b5d28fd7befbfb290907060b586b2
  ref_commit: d7f7897f40671ad716f975b3d3c077e45cc7cd10

full_mode:
  base_commit: d7f7897f40671ad716f975b3d3c077e45cc7cd10

harness_files:
- name: exif_from_data_fuzzer
  path: $PROJECT/exif_from_data_fuzzer.cc
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'

- name: exif_loader_fuzzer
  path: $PROJECT/exif_loader_fuzzer.cc
