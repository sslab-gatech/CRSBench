id: cpv_1

name: Heap buffer overflow in config__add_listener via off-by-one error

cwes:
- CWE-122
- CWE-787
- CWE-193

description: |
  A heap-based buffer overflow vulnerability exists in the config__add_listener function
  in src/conf.c of the Mosquitto MQTT broker. The vulnerability is caused by an off-by-one
  indexing error when adding a new listener to the configuration.
  
  When reallocating the listeners array to accommodate a new listener (size: listener_count + 1),
  the code incorrectly accesses the array at index [listener_count - 1] instead of [listener_count].
  When listener_count is 0 (first listener being added), this results in accessing index -1,
  causing a heap buffer overflow when the subsequent memset() writes 224 bytes to the invalid address.
  
  The vulnerability is triggered by configuration files containing the deprecated "port" option,
  which causes the broker to create a default listener. This results in memory corruption,
  denial of service through broker crashes, and potentially arbitrary code execution depending
  on what heap structures are corrupted.

locations:
- path_from_root: src/conf.c
  function_name: config__add_listener
  startLine: 167
  startColumn: 0
  endLine: 167
  endColumn: 0