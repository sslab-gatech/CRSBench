id: cpv_1

name: Heap buffer overflow due to off-by-one error in config__add_listener

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-787
- CWE-193

description: |
  A heap-based buffer overflow vulnerability caused by an off-by-one indexing error
  in the Mosquitto MQTT broker's configuration parser. When adding a new listener to
  the configuration, the config__add_listener function incorrectly calculates the
  array index for the new listener element. After reallocating the listeners array
  to accommodate one additional listener, the code uses config->listeners[config->listener_count-1]
  instead of config->listeners[config->listener_count], accessing the last existing
  element rather than the newly allocated slot. The subsequent memset operation writes
  224 bytes to this incorrect location, causing an 8-byte write beyond the allocated
  216-byte heap buffer. This can lead to heap corruption, crashes, and potential
  arbitrary code execution if an attacker can control configuration file contents.

locations:
- type: root_cause
  path_from_root: src/conf.c
  function_name: config__add_listener
  startLine: 165
  startColumn: 13
  endLine: 165
  endColumn: 49
- type: crash_site
  path_from_root: src/conf.c
