id: cpv_0

name: Off-by-one heap buffer overflow in config__add_listener

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-787
- CWE-122

description: |
  A heap-based buffer overflow vulnerability exists in the config__add_listener
  function in src/conf.c due to an off-by-one indexing error. When adding a new
  listener to the configuration, the code reallocates the listeners array to size
  config->listener_count+1 but incorrectly calculates the pointer to the new
  listener as &config->listeners[config->listener_count-1], which points to the
  last existing element instead of the newly allocated slot. This causes memset
  to write 224 bytes (size of struct mosquitto__listener) beyond the allocated
  buffer, leading to heap memory corruption and potential arbitrary code execution.

locations:
