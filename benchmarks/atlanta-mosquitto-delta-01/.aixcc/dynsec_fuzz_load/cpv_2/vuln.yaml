id: cpv_2

name: Heap Use-After-Free in Dynamic Security Duplicate Client Processing

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-416
- CWE-672

description: |
  A heap-use-after-free vulnerability exists in the Eclipse Mosquitto dynamic
  security plugin's client management code. The dynsec_clients__config_load
  function fails to validate whether a client with a given username already
  exists before adding it to the internal hash table. When a malicious JSON
  configuration contains duplicate client entries with the same username, the
  loading process creates multiple client structures with identical usernames
  and adds them to the hash table. During cleanup, when iterating through and
  freeing duplicate entries, the HASH_FIND macro attempts to access hash table
  entries that were already freed, resulting in an 8-byte read from freed heap
  memory. This can lead to information disclosure, denial of service, or
  potentially code execution.

locations:
- type: crash_site
  path_from_root: plugins/dynamic-security/clients.c
  function_name: dynsec_clients__find
  startLine: 67
  startColumn: 3
  endLine: 67
  endColumn: 3
- type: root_cause
  path_from_root: plugins/dynamic-security/clients.c
  function_name: dynsec_clients__config_load
  startLine: 129
  startColumn: 0
  endLine: 137
  endColumn: 0