id: cpv_3

name: Off-by-one Error in UTF-8 Validation Leading to Heap Buffer Overflow

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-193
- CWE-122
- CWE-787

description: |
  An off-by-one error exists in the mosquitto_validate_utf8 function in
  libcommon/utf8_common.c. The bounds checking logic at line 67 uses an
  equality comparison (==) instead of greater-than-or-equal (>=) when
  validating UTF-8 multi-byte sequences. This allows the function to proceed
  when there is insufficient data remaining in the buffer. The subsequent loop
  that reads continuation bytes increments the index beyond buffer bounds,
  causing a heap-buffer-overflow READ of size 1. This can lead to information
  disclosure or denial of service.

locations:
- type: root_cause
  path_from_root: libcommon/utf8_common.c
  function_name: mosquitto_validate_utf8
  startLine: 67
  startColumn: 5
  endLine: 67
  endColumn: 25
- type: crash_site
  path_from_root: libcommon/utf8_common.c
  function_name: mosquitto_validate_utf8
  startLine: 72
  startColumn: 8
  endLine: 72
  endColumn: 8