id: cpv_1

name: FreeRDP Obfuscated Arbitrary Code Execution

cwes:
- CWE-94

description: This vulnerability is an obfuscated backdoor, hidden within a convoluted & complex application tag message, when
  triggered allows arbitrary code execution; this is intended to be hard for an CRS to understand what is happening within
  it. This vulnerability should be difficult to build an affective payload to demonstrate the vulnerability, but relatively
  easy to patch.

