patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

full_mode:
  base_commit: 841e93022f76033007cf97bdbc72fa5eebff023d

harness_files:
- name: TestFuzzCodecs
  path: $REPO/libfreerdp/codec/test/TestFuzzCodecs.c

- name: TestFuzzCommonAssistanceBinToHexString
  path: $REPO/libfreerdp/common/test/TestFuzzCommonAssistanceBinToHexString.c

- name: TestFuzzCommonAssistanceHexStringToBin
  path: $REPO/libfreerdp/common/test/TestFuzzCommonAssistanceHexStringToBin.c

- name: TestFuzzCommonAssistanceParseFileBuffer
  path: $REPO/libfreerdp/common/test/TestFuzzCommonAssistanceParseFileBuffer.c

- name: TestFuzzCoreClient
  path: $REPO/libfreerdp/core/test/TestFuzzCoreClient.c

- name: TestFuzzCoreServer
  path: $REPO/libfreerdp/core/test/TestFuzzCoreServer.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: SEGV'

- name: TestFuzzCryptoCertificateDataSetPEM
  path: $REPO/libfreerdp/core/test/TestFuzzCryptoCertificateDataSetPEM.c
