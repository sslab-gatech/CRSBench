id: cpv_2

name: Infinite Loop in ServerCookieDecoder AIxCC Cookie Parsing

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-835
- CWE-400

description: |
  An infinite loop vulnerability exists in the ServerCookieDecoder.decode()
  method in the Netty HTTP cookie decoder implementation. The code contains
  a while loop that checks if a cookie value starting with "Team-" contains
  a semicolon character, but the loop counter is never incremented. This
  creates an infinite loop when parsing cookies named "AIxCC" with values
  starting with "Team-" that do not contain a semicolon after the prefix.
  An attacker can trigger this with a single malicious HTTP request containing
  a crafted cookie header, causing denial of service through CPU exhaustion
  and thread pool exhaustion.

locations:
- type: crash_site
  path_from_root: codec-http/src/main/java/io/netty/handler/codec/http/cookie/ServerCookieDecoder.java
  function_name: decode
  startLine: 166
  startColumn: 24
  endLine: 172
  endColumn: 25