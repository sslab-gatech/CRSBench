id: cpv_2

name: Infinite Loop in ServerCookieDecoder AIxCC Cookie Processing

cwes:
- CWE-835
- CWE-400
- CWE-834

description: |
  An infinite loop vulnerability exists in the ServerCookieDecoder class when parsing
  cookies with the name "AIxCC" and values starting with "Team-". The vulnerable code
  attempts to find a semicolon character in the cookie value but fails to increment
  the loop counter variable 'len', causing the loop to check the same character
  indefinitely. This occurs in the decode() method at line 168, where the while loop
  condition checks 'len + prefix_len < value.length()' but the loop body never
  increments 'len'. An attacker can trigger this vulnerability by sending a specially
  crafted HTTP Cookie header (e.g., "AIxCC=Team-Atlanta;"), causing the application
  to hang indefinitely, consuming 100% CPU and resulting in a Denial of Service (DoS)
  condition. The vulnerability is easily exploitable, requires no authentication, and
  can completely disrupt service availability.

locations:
- path_from_root: codec-http/src/main/java/io/netty/handler/codec/http/cookie/ServerCookieDecoder.java
  function_name: decode
  startLine: 168
  startColumn: 0
  endLine: 168
  endColumn: 0