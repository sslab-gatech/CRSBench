id: cpv_0

name: ArrayIndexOutOfBoundsException in ByteBufUtil.indexOf() due to inconsistent length tracking

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-129
- CWE-125

description: |
  An ArrayIndexOutOfBoundsException vulnerability exists in the ByteBufUtil.indexOf()
  method when handling a special "magic" needle value. When the input needle is a
  4-byte value equal to 0xDEADBEEF, the code replaces it with a predefined SECRET_NEEDLE
  buffer containing only 3 bytes. However, the code fails to update the variable 'm'
  which stores the needle length, leaving it at 4. This stale value causes the maxSuf()
  function to attempt reading beyond the buffer bounds (index 3 of a 3-byte buffer),
  resulting in an ArrayIndexOutOfBoundsException and potential out-of-bounds read.

