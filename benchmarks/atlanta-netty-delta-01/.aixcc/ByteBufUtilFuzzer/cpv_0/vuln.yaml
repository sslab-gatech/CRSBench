id: cpv_0

name: ByteBuf Array Index Validation Error

cwes:
- CWE-129
- CWE-20

description: |
  The vulnerability is an ArrayIndexOutOfBoundsException due to improper
  validation of array index within the 'getByte' function in 'HeapByteBufUtil.java'.
  It occurs when an invalid index is accessed, leading to crashes or unexpected behavior.
  The issue stems from a lack of boundary checks on array indices, which allows
  potential out-of-bounds access. The security impact includes application instability
  and potential exposure to further exploits.

