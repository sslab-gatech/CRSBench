id: cpv_1

name: OS Command Injection via Backdoor Header in HttpRequestDecoder

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-78
- CWE-77

description: |
  A synthetic OS command injection vulnerability exists in the splitHeaderName
  method of the HttpRequestDecoder class. The code checks for HTTP header names
  starting with "Backd00r" and extracts everything after this prefix as a command
  string, which is then executed directly using ProcessBuilder.start() without
  any sanitization or validation. An attacker can execute arbitrary OS commands
  by crafting HTTP requests with specially-formatted header names, leading to
  remote code execution.

locations:
- type: crash_site
  path_from_root: codec-http/src/main/java/io/netty/handler/codec/http/HttpRequestDecoder.java
  function_name: splitHeaderName
  startLine: 265
  startColumn: 0
  endLine: 265
  endColumn: 0