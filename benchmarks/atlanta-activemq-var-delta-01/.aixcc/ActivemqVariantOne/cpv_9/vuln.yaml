id: cpv_9

name: Apache ActiveMQ OpenWire Unsafe Deserialization RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-184

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable() method in
  BaseDataStreamMarshaller deserializes exception objects from OpenWire protocol
  messages without proper validation. The method uses Class.forName() to load
  arbitrary classes on the classpath based on attacker-controlled input, followed
  by instantiation via reflection. An attacker can craft a malicious OpenWire
  message containing an ExceptionResponse object with a carefully chosen class name
  (e.g., org.springframework.context.support.ClassPathXmlApplicationContext) to
  achieve remote code execution. No authentication is required, and the vulnerability
  can be exploited by any network entity with access to the OpenWire port.

locations:
- type: crash_site
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v10/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 233
  startColumn: 1
  endLine: 233
  endColumn: 80
- type: root_cause
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v10/BaseDataStreamMarshaller.java
  function_name: createThrowable
