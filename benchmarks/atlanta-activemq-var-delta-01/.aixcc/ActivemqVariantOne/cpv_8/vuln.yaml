id: cpv_8

name: OpenWire Protocol Arbitrary Class Instantiation

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604
- https://www.cve.org/CVERecord?id=CVE-2023-46604

cwes:
- CWE-502
- CWE-470

description: |
  A critical remote code execution vulnerability in Apache ActiveMQ's OpenWire
  protocol marshaller allows a remote attacker with network access to execute
  arbitrary code. The createThrowable method in BaseDataStreamMarshaller.java
  accepts a class name from externally controlled deserialized data and uses
  reflection to instantiate it without validating that the class actually
  extends Throwable. This allows an attacker to instantiate any class on the
  classpath that has a constructor accepting a single String parameter, leading
  to remote code execution. The vulnerability has a CVSS score of 9.8 and is
  actively exploited in the wild.

