id: cpv_8

name: Apache ActiveMQ OpenWire Protocol Unsafe Deserialization RCE

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  Remote Code Execution vulnerability caused by unsafe deserialization and arbitrary 
  class instantiation in Apache ActiveMQ's OpenWire protocol implementation. The 
  createThrowable() method in BaseDataStreamMarshaller accepts an externally-controlled 
  class name from network data and uses reflection to instantiate it without proper 
  validation. The method only checks if the class name starts with "j" before using 
  Class.forName() to load the class and Constructor.newInstance() to instantiate it.
  
  An attacker can craft a malicious OpenWire protocol message containing an 
  ExceptionResponse with a carefully chosen class name that passes the weak validation. 
  When the server unmarshals this message, it instantiates the attacker-controlled class, 
  potentially leading to remote code execution through gadget chains available on the 
  classpath. The vulnerability occurs during the unmarshalling of exception objects in 
  the OpenWire protocol, affecting all protocol versions (v1-v12).

locations:
- path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v9/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 228
  startColumn: 0
  endLine: 239
  endColumn: 0