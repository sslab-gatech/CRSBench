id: cpv_3

name: ActiveMQ OpenWire Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/news/cve-2023-46604
- https://osv.dev/vulnerability/CVE-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-78

description: |
  A critical Remote Code Execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol implementation. The createThrowable method in
  BaseDataStreamMarshaller accepts an externally-controlled class name from
  the OpenWire protocol and instantiates it using reflection without
  validating that the class is actually a Throwable subclass. This allows
  an unauthenticated remote attacker to instantiate any arbitrary class on
  the classpath that has a constructor accepting a single String parameter.
  Common exploit uses ClassPathXmlApplicationContext with a URL pointing to
  a malicious XML config file to achieve remote code execution. This
  vulnerability has been actively exploited in ransomware attacks.

locations:
