id: cpv_10

name: OpenWire Protocol Arbitrary Class Instantiation RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in BaseDataStreamMarshaller
  accepts a className string from untrusted network input and uses reflection to
  instantiate it without validating that the class extends Throwable. This allows
  an attacker to instantiate arbitrary classes on the classpath that have a
  constructor accepting a single String parameter. Known exploits use
  ClassPathXmlApplicationContext to load malicious XML configuration files from
  remote servers, leading to full remote code execution with CVSS score 10.0.

