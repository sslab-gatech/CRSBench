id: cpv_11

name: Apache ActiveMQ OpenWire Protocol Unsafe Deserialization RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt

cwes:
- CWE-502
- CWE-470
- CWE-913

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol implementation. The BaseDataStreamMarshaller.createThrowable()
  method deserializes exception objects from the OpenWire protocol without
  validating that the loaded class actually extends Throwable. An attacker can
  send a malicious ExceptionResponse message specifying an arbitrary class name
  (e.g., ClassPathXmlApplicationContext) and constructor arguments, leading to
  instantiation of arbitrary classes via reflection. This allows unauthenticated
  remote code execution and has been actively exploited in the wild, including
  in ransomware attacks. CVSS 9.8 Critical.

locations:
- type: crash_site
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v12/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 233
  startColumn: 0
  endLine: 235
  endColumn: 0
- type: root_cause
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v12/ExceptionResponseMarshaller.java
  function_name: looseUnmarshal
  startLine: 109
  startColumn: 0
  endLine: 115
  endColumn: 0