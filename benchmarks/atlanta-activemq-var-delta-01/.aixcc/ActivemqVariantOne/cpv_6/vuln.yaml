id: cpv_6

name: Apache ActiveMQ OpenWire Insecure Deserialization Remote Code Execution

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  An insecure deserialization vulnerability in Apache ActiveMQ's OpenWire protocol
  implementation allows remote code execution. The createThrowable() method in
  BaseDataStreamMarshaller.java accepts an externally-controlled className parameter
  from network data and instantiates arbitrary classes via reflection without proper
  validation. While the code attempts to restrict class names with a weak "j" prefix
  check, this can be easily bypassed. When processing ExceptionResponse messages, an
  attacker can supply a malicious class name (e.g., jaz.Zer) that passes the weak
  filter, causing Class.forName() to load the attacker-specified class and invoke its
  constructor at line 232. This allows arbitrary code execution if the class has a
  constructor accepting a String parameter. The vulnerability affects multiple OpenWire
  protocol versions (v1-v12) and can lead to full system compromise, data breach, or
  service disruption depending on the privileges of the ActiveMQ process.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v7/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 232
  startColumn: 0
  endLine: 232
  endColumn: 0