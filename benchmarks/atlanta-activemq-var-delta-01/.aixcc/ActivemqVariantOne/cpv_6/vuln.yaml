id: cpv_6

name: Apache ActiveMQ OpenWire Insecure Deserialization RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt
- https://www.cisa.gov/known-exploited-vulnerabilities-catalog

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical insecure deserialization vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The BaseDataStreamMarshaller.createThrowable()
  method accepts an externally-controlled class name from a deserialized OpenWire
  packet and instantiates it using reflection without proper validation. The only
  check is whether the class name starts with "j", which is insufficient. An
  attacker can send a crafted OpenWire packet containing an ExceptionResponse
  with an arbitrary class name, causing the class to be loaded and instantiated
  with attacker-controlled constructor parameters. This leads to remote code
  execution on ActiveMQ brokers and clients with no authentication required.
  The vulnerability has been exploited in the wild by ransomware and cryptominers.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v7/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 231
  startColumn: 13
  endLine: 232
  endColumn: 89