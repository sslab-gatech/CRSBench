id: cpv_1

name: Apache ActiveMQ OpenWire Arbitrary Class Instantiation RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller accepts externally-controlled class names without
  validating that the specified class extends Throwable. This allows an
  attacker to instantiate any class on the classpath that has a constructor
  accepting a single String parameter. By sending a crafted OpenWire packet
  with an arbitrary class name (such as ClassPathXmlApplicationContext), an
  attacker can achieve remote code execution on both ActiveMQ brokers and
  clients. The vulnerability has been actively exploited in the wild and is
  listed in the CISA KEV catalog with a CVSS score of 9.8 (CRITICAL).

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v2/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 233
  startColumn: 13
  endLine: 234
  endColumn: 89