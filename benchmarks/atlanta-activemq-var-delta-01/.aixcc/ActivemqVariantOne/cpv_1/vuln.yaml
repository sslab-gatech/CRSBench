id: cpv_1

name: Apache ActiveMQ OpenWire Insecure Exception Deserialization RCE

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical insecure deserialization vulnerability in Apache ActiveMQ's OpenWire 
  protocol implementation allows remote code execution through unrestricted class 
  instantiation. The createThrowable() method in BaseDataStreamMarshaller deserializes 
  exception objects from network data without proper validation. It reads an 
  attacker-controlled class name from network input, performs only minimal validation 
  (checking if the class name starts with "j"), and then uses Class.forName() to load 
  and instantiate arbitrary classes via reflection. An attacker can send a crafted 
  OpenWire ExceptionResponse message containing a malicious class name, which will be 
  loaded and instantiated with attacker-controlled constructor arguments. This enables 
  arbitrary class instantiation, potentially leading to remote code execution through 
  gadget chains, denial of service, or information disclosure.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v2/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 0
  endLine: 233
  endColumn: 0