id: cpv_4

name: Remote Code Execution via Insecure OpenWire Deserialization

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-913

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol deserialization. The createThrowable method in
  BaseDataStreamMarshaller.java uses Class.forName() to load arbitrary classes
  specified in untrusted network input without validating that the loaded class
  extends Throwable. An attacker can exploit this by sending a crafted OpenWire
  packet containing an arbitrary class name and constructor parameter, enabling
  instantiation of dangerous classes that lead to remote code execution.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v5/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 1
  endLine: 240
  endColumn: 5
