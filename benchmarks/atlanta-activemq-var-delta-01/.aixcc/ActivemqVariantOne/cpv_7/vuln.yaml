id: cpv_7

name: Apache ActiveMQ OpenWire Protocol Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability in Apache ActiveMQ's OpenWire
  protocol marshaller allows an attacker with network access to run arbitrary
  shell commands. The createThrowable method in BaseDataStreamMarshaller fails
  to validate that a deserialized class extends Throwable before instantiation.
  This allows instantiation of arbitrary classes with attacker-controlled
  constructor parameters, enabling remote code execution via classes like
  ClassPathXmlApplicationContext. The vulnerability has a CVSS score of 10.0
  (CRITICAL) and is listed in CISA KEV as actively exploited in the wild.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v8/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 231
  startColumn: 0
  endLine: 233
  endColumn: 0