id: cpv_7

name: Apache ActiveMQ OpenWire Unsafe Exception Deserialization RCE

cwes:
- CWE-502
- CWE-470
- CWE-913

description: |
  Unsafe deserialization vulnerability in Apache ActiveMQ's OpenWire protocol implementation
  allows remote code execution through arbitrary class instantiation. The vulnerability exists
  in the BaseDataStreamMarshaller.createThrowable() method, which deserializes exception objects
  from untrusted network input without proper validation.
  
  The method reads a class name directly from network data and uses reflection to instantiate
  arbitrary classes via Class.forName() and Constructor.newInstance(). The only validation is
  a weak check that the class name starts with "j", which is trivially bypassed. The code
  instantiates the class before validating it extends Throwable, allowing attackers to
  instantiate any class on the classpath with a constructor accepting a String parameter.
  
  An attacker can craft a malicious OpenWire ExceptionResponse message containing a gadget
  class name (e.g., "jaz.Zer") and arbitrary constructor parameters, leading to remote code
  execution, denial of service, or information disclosure depending on available classpath classes.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v8/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 228
  startColumn: 0
  endLine: 239
  endColumn: 0