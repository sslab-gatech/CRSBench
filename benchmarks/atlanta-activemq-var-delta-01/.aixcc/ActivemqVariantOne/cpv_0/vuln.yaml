id: cpv_0

name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's OpenWire 
  protocol marshalling implementation. The vulnerability is in the 
  BaseDataStreamMarshaller.createThrowable() method, which deserializes exception objects 
  from the wire format. The method accepts a fully-qualified class name from untrusted 
  external input and uses Java reflection to instantiate an arbitrary class without 
  validating that the class is actually a Throwable. While there is a weak filter checking 
  if the class name starts with "j", this check is insufficient and can be bypassed.
  
  An attacker can craft a malicious OpenWire message containing an ExceptionResponse object 
  with an arbitrary class name. When the message is unmarshalled, Class.forName() loads the 
  specified class and Constructor.newInstance() instantiates it. Without proper validation, 
  any class on the classpath that has a String constructor can be instantiated, allowing 
  arbitrary code execution through gadget chains or malicious classes. This enables remote 
  code execution, system compromise, data breach, and lateral movement.
  
  The vulnerability is triggered when ExceptionResponseMarshaller.looseUnmarshal() calls 
  looseUnmarsalThrowable(), which reads the attacker-controlled class name and passes it 
  to createThrowable(). The fix introduces validation via OpenWireUtil.validateIsThrowable() 
  to ensure only classes assignable to Throwable can be instantiated.

locations:
- path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v1/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 234
  startColumn: 0
  endLine: 234
  endColumn: 0