id: cpv_0

name: Apache ActiveMQ OpenWire Protocol Unsafe Deserialization RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://osv.dev/vulnerability/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical Remote Code Execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller unsafely deserializes exception objects from
  network data without proper validation. It uses Class.forName() to load
  arbitrary classes from the classpath based on attacker-controlled input,
  then instantiates them using reflection. An attacker with network access
  can send a malicious OpenWire message containing a crafted ExceptionResponse
  that specifies a dangerous class name and constructor parameter, leading to
  arbitrary code execution. This vulnerability has CVSS score 10.0 and has
  been actively exploited in the wild.

