id: cpv_5

name: Apache ActiveMQ OpenWire Unsafe Deserialization RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol implementation. The createThrowable method in
  BaseDataStreamMarshaller accepts externally-controlled class names from
  deserialized OpenWire protocol data without validating that the specified
  class is actually a subclass of Throwable. The method performs minimal
  validation (only checking if the class name starts with "j"), then uses
  reflection to load and instantiate arbitrary classes on the classpath.
  This allows an attacker with network access to instantiate any class that
  has a String constructor, leading to arbitrary code execution. The
  vulnerability has a CVSS score of 10.0 (CRITICAL) and has been actively
  exploited in the wild by ransomware groups and cryptominers.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v6/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 232
  startColumn: 13
  endLine: 234
  endColumn: 70