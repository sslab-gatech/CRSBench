id: cpv_5

name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  The Apache ActiveMQ OpenWire protocol deserialization implementation contains a critical
  vulnerability in the createThrowable method of BaseDataStreamMarshaller.java. The method
  accepts an externally-controlled class name from untrusted network input and uses Java
  reflection (Class.forName and Constructor.newInstance) to instantiate arbitrary classes
  without proper validation. The only security check is a weak heuristic that verifies if
  the class name starts with "j". An attacker can craft malicious OpenWire protocol messages
  containing carefully chosen class names that, when instantiated, lead to remote code
  execution. The vulnerability is triggered during exception response unmarshaling when
  looseUnmarsalThrowable reads attacker-controlled class names and passes them to
  createThrowable. This allows instantiation of any class on the classpath with a String
  constructor, potentially executing arbitrary code through classes with dangerous
  initialization logic or constructor side effects.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v6/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 0
  endLine: 240
  endColumn: 0