id: cpv_2

name: Apache ActiveMQ OpenWire Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-913

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol implementation. The BaseDataStreamMarshaller.createThrowable()
  method accepts an arbitrary class name from untrusted network input and uses
  reflection to instantiate any class with a String constructor, without validating
  that the instantiated class is actually a Throwable. This allows an attacker to
  instantiate arbitrary classes on the classpath, leading to remote code execution.
  An unauthenticated attacker can send a crafted OpenWire packet to instantiate
  malicious classes and achieve code execution.

locations:
- type: root_cause
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v3/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 1
  endLine: 240
  endColumn: 5