id: cpv_2

name: Apache ActiveMQ OpenWire Unsafe Exception Deserialization RCE

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  The Apache ActiveMQ OpenWire protocol implementation contains a remote code execution 
  vulnerability in the BaseDataStreamMarshaller.createThrowable() method. The vulnerable 
  code uses Class.forName() and reflection to instantiate arbitrary classes based on 
  externally-controlled className parameters received from untrusted OpenWire protocol data.
  
  When processing OpenWire protocol messages (specifically exception responses), the 
  looseUnmarshalThrowable() method extracts a class name from the input stream and passes 
  it to createThrowable(). The method then loads the specified class, obtains a constructor 
  accepting a String parameter, and instantiates the class via reflection with attacker-controlled 
  data. While the code includes a weak check requiring the class name to start with "j", 
  this is insufficient protection and can be easily bypassed.
  
  An attacker can craft malicious OpenWire messages containing exception data with carefully 
  chosen class names that pass the weak validation check, leading to arbitrary class instantiation. 
  This can result in remote code execution through gadget chains or malicious constructors, 
  denial of service through resource-intensive class instantiation, or information disclosure 
  through error messages from instantiated classes.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v3/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 233
  endColumn: 0
