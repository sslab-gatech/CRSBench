id: cpv_13
name: Apache ActiveMQ OpenWire Protocol Unsafe Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://osv.dev/vulnerability/BIT-activemq-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-913

description: |
  A critical remote code execution vulnerability in Apache ActiveMQ's OpenWire protocol
  allows an unauthenticated remote attacker with network access to execute arbitrary code.
  The vulnerability exists in the BaseDataStreamMarshaller.createThrowable() method which
  accepts untrusted input for a class name and uses Class.forName() to load and instantiate
  arbitrary classes on the classpath without validation. An attacker can craft a malicious
  OpenWire message containing an ExceptionResponse with a specially chosen class name (such
  as ClassPathXmlApplicationContext) to achieve remote code execution. This vulnerability
  has been actively exploited in the wild by ransomware groups and cryptominers.

locations:
- type: root_cause
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v2/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 232
  startColumn: 1
  endLine: 234
  endColumn: 100
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v2/ExceptionResponseMarshaller.java
  function_name: looseUnmarshal
  startLine: 114
  startColumn: 1
  endLine: 114
  endColumn: 90