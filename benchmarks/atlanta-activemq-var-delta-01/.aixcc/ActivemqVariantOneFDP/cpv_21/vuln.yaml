id: cpv_21
name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-94
- CWE-470

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The BaseDataStreamMarshaller.createThrowable()
  method accepts an attacker-controlled class name from the network, loads the
  class via Class.forName(), and instantiates it using reflection without
  validating that the class is actually a subclass of Throwable. An attacker
  can send a malicious OpenWire protocol message containing an ExceptionResponse
  with a crafted class name (e.g., org.springframework.context.support.ClassPathXmlApplicationContext)
  to achieve arbitrary code execution. The vulnerability affects ActiveMQ versions
  prior to 5.15.16, 5.16.0-5.16.6, 5.17.0-5.17.5, and 5.18.0-5.18.2.

locations:
- type: root_cause
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v10/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 1
  endLine: 240
  endColumn: 6