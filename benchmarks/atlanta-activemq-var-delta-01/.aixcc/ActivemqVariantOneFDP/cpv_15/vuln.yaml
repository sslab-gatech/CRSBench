id: cpv_15
name: Remote Code Execution via OpenWire Protocol Deserialization

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-913
- CWE-470

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in BaseDataStreamMarshaller
  performs insufficient validation before using Class.forName() to load and instantiate
  arbitrary classes based on attacker-controlled input from deserialized data. The method
  only checks if the class name starts with "j", which can be easily bypassed. An attacker
  with network access can send a crafted OpenWire packet containing an ExceptionResponse
  object with an arbitrary class name, triggering instantiation of malicious classes such
  as ClassPathXmlApplicationContext, leading to arbitrary code execution.

locations:
- type: root_cause
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v4/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 0
  endLine: 240
  endColumn: 0