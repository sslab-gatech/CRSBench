id: cpv_23
name: ActiveMQ OpenWire Protocol Unsafe Deserialization RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller accepts an externally-controlled className parameter
  from deserialized OpenWire messages and uses reflection to instantiate it
  without validating that the class is actually a subclass of Throwable.
  An attacker can specify any class with a String constructor, such as
  ClassPathXmlApplicationContext, to achieve remote code execution by loading
  malicious configuration from a remote server. This affects ActiveMQ Classic
  versions prior to 5.15.16, 5.16.7, 5.17.6, and 5.18.3.

locations:
- type: crash_site
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v12/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 230
  startColumn: 1
  endLine: 241
  endColumn: 80