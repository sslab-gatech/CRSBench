id: cpv_1

name: Apache ActiveMQ OpenWire Protocol Unsafe Deserialization RCE

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A remote code execution vulnerability exists in the Apache ActiveMQ OpenWire protocol 
  deserialization code. The BaseDataStreamMarshaller.createThrowable() method uses 
  Class.forName() to dynamically load and instantiate classes based on externally 
  controlled class names received from the network. The code only validates that the 
  class name starts with "j" but fails to verify that the loaded class actually extends 
  Throwable before instantiating it via reflection. This allows an attacker to craft 
  malicious OpenWire messages containing ExceptionResponse objects with arbitrary class 
  names, leading to instantiation of any class on the classpath that has a String 
  constructor. The vulnerability can be exploited to achieve remote code execution by 
  instantiating classes whose constructors execute malicious code.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v2/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 232
  startColumn: 0
  endLine: 234
  endColumn: 0