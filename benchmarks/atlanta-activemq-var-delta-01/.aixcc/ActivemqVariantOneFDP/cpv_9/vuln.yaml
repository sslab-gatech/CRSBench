id: cpv_9

name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

cwes:
- CWE-502
- CWE-470
- CWE-094

description: |
  A critical unsafe deserialization vulnerability in Apache ActiveMQ's OpenWire protocol 
  implementation allows remote code execution. The createThrowable() method in 
  BaseDataStreamMarshaller.java uses attacker-controlled input to dynamically load and 
  instantiate arbitrary Java classes through reflection. When unmarshaling exception 
  responses, the code reads a class name and message from an untrusted input stream, 
  then uses Class.forName() and Constructor.newInstance() to instantiate the class 
  without proper validation. The only protection is a weak check that the class name 
  starts with "j", which is insufficient to prevent instantiation of malicious classes. 
  An attacker can send a crafted OpenWire message containing an ExceptionResponse with 
  a malicious class name to execute arbitrary code on the server. The vulnerability 
  affects both v10 and v11 of the OpenWire marshaller implementation.

locations:
- path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v10/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 231
  endColumn: 0
  endLine: 234
  startColumn: 0