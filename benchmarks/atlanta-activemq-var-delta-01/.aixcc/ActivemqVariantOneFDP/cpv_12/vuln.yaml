id: cpv_12
name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470

description: |
  A critical Remote Code Execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller accepts externally-controlled className and message
  parameters from network input during deserialization of ExceptionResponse
  messages. It uses Class.forName() to load an arbitrary class and
  constructor.newInstance() to instantiate it with attacker-controlled
  parameters before validating that the class is actually a Throwable subclass.
  This allows unauthenticated attackers to instantiate any class on the
  classpath with a String constructor, leading to remote code execution.
  CVSS v3 score 10.0 (Critical). Actively exploited in the wild.

locations:
- type: root_cause
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v1/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 233
  startColumn: 1
  endLine: 235
  endColumn: 120