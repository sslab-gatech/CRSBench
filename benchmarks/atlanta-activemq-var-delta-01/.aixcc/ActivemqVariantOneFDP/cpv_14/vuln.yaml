id: cpv_14
name: Apache ActiveMQ OpenWire Protocol Unsafe Deserialization RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  Java OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller accepts untrusted class names from network input
  and uses Class.forName() to instantiate them without validating that the
  class is actually a Throwable subclass. An attacker with network access
  can manipulate serialized class types to instantiate arbitrary classes on
  the classpath, leading to remote code execution. The vulnerability has been
  actively exploited in the wild by ransomware and malware campaigns.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v3/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 1
  endLine: 240
  endColumn: 6