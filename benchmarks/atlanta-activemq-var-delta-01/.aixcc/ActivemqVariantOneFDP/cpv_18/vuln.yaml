id: cpv_18
name: Apache ActiveMQ OpenWire Unsafe Deserialization RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35

cwes:
- CWE-502
- CWE-470

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller.java accepts an externally-controlled className
  parameter from network data and uses reflection to instantiate it without
  properly validating that the class is actually a Throwable subclass. This
  allows an attacker to instantiate arbitrary classes on the classpath by
  sending a specially-crafted OpenWire packet containing an EXCEPTION_RESPONSE
  with a malicious class name. If the class constructor has side effects, this
  leads to unauthenticated remote code execution with CVSS score 10.0.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v7/BaseDataStreamMarshaller.java
  function_name: createThrowable
