id: cpv_7

name: OpenWire Protocol Unsafe Deserialization in createThrowable

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's OpenWire protocol
  marshaller. The createThrowable method in BaseDataStreamMarshaller accepts an externally-controlled
  className string from network data and uses Java reflection (Class.forName) to instantiate that
  class without validating that it actually extends Throwable. While the code attempts to cast the
  result to Throwable, this validation happens after the constructor has already been invoked,
  allowing arbitrary code execution. An attacker with network access to the ActiveMQ OpenWire port
  can send a crafted ExceptionResponse message containing a malicious class name to instantiate any
  class on the classpath that has a String-parameter constructor, leading to remote code execution
  with the privileges of the ActiveMQ process.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v8/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 228
  startColumn: 1
  endLine: 239
  endColumn: 80