id: cpv_16
name: Apache ActiveMQ OpenWire Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller.java accepts an attacker-controlled className string
  and uses reflection to instantiate the class without validating that the class
  actually extends Throwable. An attacker can send a crafted OpenWire packet
  containing an arbitrary class name, which gets loaded and instantiated via
  Class.forName and reflection. If the class has side effects in its constructor
  (such as Spring's ClassPathXmlApplicationContext), this leads to unauthenticated
  remote code execution. This vulnerability has been actively exploited in the
  wild by HelloKitty ransomware and Kinsing malware.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v5/BaseDataStreamMarshaller.java
  function_name: createThrowable
