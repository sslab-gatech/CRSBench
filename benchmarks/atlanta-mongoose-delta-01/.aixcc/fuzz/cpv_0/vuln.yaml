id: cpv_0

name: ICMP Echo Reply Stack Buffer Over-read in Checksum Calculation

cwes:
- CWE-125
- CWE-121
- CWE-787

description: |
  A dynamic stack buffer overflow vulnerability exists in the ICMP Echo Reply 
  handling of the Mongoose embedded TCP/IP stack (MIP). The vulnerability occurs 
  in the rx_icmp() function when processing ICMP echo requests (ping packets).
  
  The root cause is a mismatch between the amount of data copied from the received 
  packet payload and the amount of data read when calculating the checksum. 
  Specifically, when crafting an ICMP echo reply, the code copies payload data 
  with memcpy() but then calculates the checksum using the original packet payload 
  length (pkt->pay.len) without considering that the actual copied data might be 
  truncated due to TX buffer size limits.
  
  When pkt->pay.len exceeds the available TX buffer space, memcpy() only copies 
  a limited amount, but ipcsum() attempts to read beyond what was actually copied. 
  The csumup() function then performs an out-of-bounds read beyond the allocated 
  stack buffer, causing a dynamic stack buffer overflow.
  
  An attacker can exploit this by crafting a malicious ICMP echo request packet 
  with a payload length that exceeds the available TX buffer space. This can lead 
  to information disclosure through stack data leakage, denial of service through 
  crashes, and potentially undefined behavior that could be chained with other 
  vulnerabilities.

locations:
- path_from_root: mip/mip.c
  function_name: rx_icmp
  startLine: 456
  startColumn: 18
  endLine: 456
  endColumn: 70