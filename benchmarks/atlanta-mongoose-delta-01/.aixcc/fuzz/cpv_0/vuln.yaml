id: cpv_0

name: ICMP Checksum Calculation Stack Buffer Overflow

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-121
- CWE-125
- CWE-787

description: |
  A dynamic stack buffer overflow vulnerability exists in the rx_icmp function
  in mip/mip.c. When handling ICMP echo requests, the code calculates a checksum
  over the ICMP packet using the original received payload length (pkt->pay.len)
  instead of the actual amount of data copied to the transmit buffer (left).
  This causes the csumup function to read beyond the allocated buffer boundaries,
  resulting in an out-of-bounds read. An attacker can trigger this by sending a
  crafted ICMP packet with a large payload length field, potentially leading to
  information disclosure or denial of service.

locations:
- type: crash_site
  path_from_root: mip/mip.c
  function_name: csumup
  startLine: 233
  startColumn: 1
  endLine: 236
  endColumn: 1
- type: root_cause
  path_from_root: mip/mip.c
  function_name: rx_icmp
  startLine: 446
  startColumn: 1
  endLine: 458
  endColumn: 1