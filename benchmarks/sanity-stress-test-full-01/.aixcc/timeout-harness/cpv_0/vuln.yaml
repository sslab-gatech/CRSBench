id: cpv_0

name: Off-by-one Heap Buffer Overflow in buffer_write

cwes:
- CWE-193
- CWE-122
- CWE-787

description: |
  A classic off-by-one heap buffer overflow vulnerability exists in the buffer_write 
  function in utils.c. The vulnerability is caused by an incorrect bounds check that 
  uses '>' instead of '>=' when validating the index parameter. This allows an attacker 
  to write one byte past the end of the allocated heap buffer when the index equals 
  the buffer size. Since arrays are zero-indexed, valid indices for a buffer of size n 
  are 0 to n-1, but the flawed check permits writing at index n, which is out of bounds.
  
  When triggered, this can lead to heap corruption, potential arbitrary code execution 
  in real-world scenarios, denial of service through program crashes, or corruption of 
  adjacent heap data structures. The vulnerability is triggered when input->c is set to 
  a value equal to the buffer size (300 in the test case), causing a write to buf->buf[300], 
  which is one byte beyond the allocated 300-byte region.

locations:
- path_from_root: utils.c
  function_name: buffer_write
  startLine: 24
  startColumn: 21
  endLine: 24
  endColumn: 21