id: cpv_0

name: Off-by-one heap buffer overflow in buffer_write

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-787
- CWE-122
- CWE-193

description: |
  A heap-based buffer overflow vulnerability exists in the buffer_write function
  in utils.c due to an off-by-one error in bounds checking. The function uses
  an incorrect bounds check (index > buf->size) instead of (index >= buf->size),
  allowing writes at index equal to buf->size, which is one byte beyond the
  allocated buffer. This can lead to heap corruption, crashes, or potentially
  exploitable conditions depending on heap layout.

