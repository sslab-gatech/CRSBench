id: cpv_0

name: Off-by-One Heap Buffer Overflow in buffer_write

cwes:
- CWE-193
- CWE-122
- CWE-787

description: |
  A heap-based buffer overflow vulnerability exists in the buffer_write function
  due to an incorrect bounds check. The function uses '>' instead of '>=' when
  validating the index parameter, allowing writes at index equal to the buffer
  size. For a buffer of size N, valid indices are 0 to N-1, but the flawed check
  permits index N to pass through, resulting in a one-byte write past the end of
  the allocated heap buffer. This off-by-one error can corrupt heap metadata or
  adjacent heap objects, potentially leading to arbitrary code execution or denial
  of service. The vulnerability is triggered when buffer_write is called with an
  index value equal to the buffer's size.

locations:
- path_from_root: utils.c
  function_name: buffer_write
  startLine: 24
  startColumn: 21
  endLine: 24
  endColumn: 21