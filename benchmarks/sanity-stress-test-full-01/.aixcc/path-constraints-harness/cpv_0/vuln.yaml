id: cpv_0

name: Off-by-one heap buffer overflow in buffer_write

cwes:
- CWE-122
- CWE-787
- CWE-193

description: |
  A heap-based buffer overflow vulnerability exists in the buffer_write function
  in utils.c due to an off-by-one error in the bounds check. The function uses
  'index > buf->size' instead of 'index >= buf->size', allowing writes at an
  index equal to the buffer size, which is one byte past the valid range. For a
  buffer of size N, valid indices are 0 to N-1, but this vulnerability allows
  writing to index N. When triggered with input->c = 300 for a 300-byte buffer,
  the code writes one byte past the allocated region, causing heap corruption.
  This can lead to memory corruption, crashes, or potential arbitrary code
  execution.

locations:
- path_from_root: utils.c
  function_name: buffer_write
  startLine: 21
  startColumn: 9
  endLine: 21
  endColumn: 28