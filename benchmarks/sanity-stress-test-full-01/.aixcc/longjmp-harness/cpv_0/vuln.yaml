id: cpv_0

name: Off-by-one heap buffer overflow in buffer_write

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-193
- CWE-787
- CWE-122

description: |
  A heap buffer overflow vulnerability exists in the buffer_write function
  in utils.c due to an off-by-one error in the bounds check. The function
  uses an incorrect comparison operator (> instead of >=) when validating
  the index parameter, allowing writes at index equal to the buffer size.
  This results in writing one byte past the end of the allocated heap buffer,
  which can corrupt heap metadata or adjacent allocations.

