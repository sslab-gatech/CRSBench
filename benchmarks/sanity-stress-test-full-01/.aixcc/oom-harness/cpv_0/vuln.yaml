id: cpv_0

name: Off-by-One Heap Buffer Overflow in buffer_write()

cwes:
- CWE-122
- CWE-787
- CWE-193

description: |
  A heap-based buffer overflow vulnerability caused by an off-by-one error in the
  buffer_write() function in utils.c. The bounds check uses '>' instead of '>=' when
  validating the index parameter, allowing writes at index equal to buf->size. Since
  arrays are 0-indexed, a buffer of size N has valid indices 0 to N-1, but this
  incorrect comparison allows index N to pass the check, resulting in a write one byte
  past the end of the allocated heap buffer. This can lead to heap metadata corruption,
  adjacent object corruption, and potentially arbitrary code execution or denial of
  service.

locations:
- path_from_root: utils.c
  function_name: buffer_write
  startLine: 21
  startColumn: 9
  endLine: 21
  endColumn: 28