id: cpv_0

name: Off-by-one heap buffer overflow in buffer_write bounds check

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-787
- CWE-193

description: |
  A heap buffer overflow vulnerability exists in the buffer_write function
  in utils.c due to an off-by-one error in the bounds check. The function
  uses the wrong comparison operator (> instead of >=) when validating the
  index parameter, allowing writes at index equal to buf->size. Since valid
  indices for a buffer of size N are [0, N-1], writing at index N causes a
  one-byte overflow past the allocated heap region. This can corrupt heap
  metadata or adjacent heap objects, potentially leading to arbitrary code
  execution or denial of service.

