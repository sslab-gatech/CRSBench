id: cpv_0

name: Off-by-One Heap Buffer Overflow in buffer_write

cwes:
- CWE-787
- CWE-122
- CWE-193

description: |
  A heap buffer overflow vulnerability caused by an off-by-one error in the buffer_write function.
  The bounds check at line 21 of utils.c uses the condition "index > buf->size" instead of 
  "index >= buf->size", which allows an index equal to the buffer size to pass validation.
  Since valid array indices range from 0 to size-1, writing at index equal to size results in
  a one-byte write beyond the allocated heap buffer. This can lead to heap corruption, potential
  code execution, denial of service, or information disclosure. The vulnerability is triggered
  when buffer_write is called with an index value equal to or greater than the buffer size,
  allowing a write operation at buf->buf[index] to access memory outside the allocated region.

locations:
- path_from_root: utils.c
  function_name: buffer_write
  startLine: 24
  startColumn: 21
  endLine: 24
  endColumn: 21