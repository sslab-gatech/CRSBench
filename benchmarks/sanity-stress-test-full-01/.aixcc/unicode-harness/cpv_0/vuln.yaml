id: cpv_0

name: Off-by-One Heap Buffer Overflow in buffer_write

cwes:
- CWE-122
- CWE-787
- CWE-193

description: |
  A heap-based buffer overflow vulnerability exists in the buffer_write function
  in utils.c due to an incorrect bounds check. The function uses "index > buf->size"
  instead of "index >= buf->size", allowing writes at an index equal to the buffer
  size. This off-by-one error permits writing one byte past the end of the allocated
  heap buffer. When triggered via func_unicode_破壊 with a crafted input containing
  specific values (変数a=0x1337, переменная_b=0x1338, μεταβλητή_c=0x12c), the
  vulnerability allows an attacker to write at index 300 in a 300-byte buffer,
  corrupting adjacent heap memory. This can lead to heap metadata corruption,
  potential arbitrary code execution, or denial of service.

locations:
- path_from_root: utils.c
  function_name: buffer_write
  startLine: 24
  startColumn: 21
  endLine: 24
  endColumn: 21