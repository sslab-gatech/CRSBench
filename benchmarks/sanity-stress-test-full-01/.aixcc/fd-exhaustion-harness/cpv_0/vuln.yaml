id: cpv_0

name: Heap Buffer Off-by-one Overflow in buffer_write

cwes:
- CWE-193
- CWE-122
- CWE-787

description: |
  A heap buffer overflow vulnerability exists in the buffer_write function in utils.c
  due to an off-by-one error in the bounds checking logic. The function uses an
  incorrect comparison operator (>) instead of (>=) when validating the index parameter
  against the buffer size. This allows writing one byte beyond the allocated heap buffer.
  
  For a buffer of size N, valid indices are 0 to N-1, but the current implementation
  accepts index N, causing a write at buf->buf[N] which is one byte past the end of
  the allocated region. This vulnerability is triggered in fd-exhaustion-harness.c when
  specific arithmetic constraints are met and buffer_write is called with an index
  equal to the buffer size (300).
  
  The vulnerability can lead to heap memory corruption, potential control-flow hijacking,
  denial of service, or corruption of adjacent heap data structures.

locations:
- path_from_root: cp-user-stress-test-src/utils.c
  function_name: buffer_write
  startLine: 24
  startColumn: 21
  endLine: 24
  endColumn: 21