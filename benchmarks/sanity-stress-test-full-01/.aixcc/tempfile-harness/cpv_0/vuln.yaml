id: cpv_0

name: Heap Buffer Overflow via Off-by-one Error in buffer_write

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-787
- CWE-122
- CWE-193

description: |
  A heap-based buffer overflow vulnerability exists in the buffer_write function
  in utils.c due to an off-by-one error in the bounds checking logic. The function
  uses an incorrect comparison operator (> instead of >=) when validating the index
  parameter, allowing writes at index equal to the buffer size. When a buffer of
  size N is allocated, valid indices are 0 to N-1, but the buggy condition allows
  writing at index N, which is one byte past the allocated region. This causes heap
  corruption and can lead to crashes or potential exploitation to overwrite critical
  data structures.

