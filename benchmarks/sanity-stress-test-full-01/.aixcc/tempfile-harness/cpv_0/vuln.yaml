id: cpv_0

name: Off-by-One Heap Buffer Overflow in buffer_write Function

cwes:
- CWE-193
- CWE-122
- CWE-787

description: |
  A heap-based buffer overflow vulnerability exists in the buffer_write function 
  due to an off-by-one error in the bounds check. The function uses an incorrect 
  comparison operator (>) instead of (>=) when validating the index parameter, 
  allowing an attacker to write one byte past the end of a heap-allocated buffer.
  
  For a buffer of size 300, valid indices range from 0 to 299. However, the 
  vulnerable check 'if (index > buf->size)' only rejects indices greater than 300, 
  allowing index 300 to pass through. This results in writing to buf->buf[300], 
  which is one byte beyond the allocated region at address offset 0x5120000005ec.
  
  The vulnerability can corrupt adjacent heap metadata or other heap objects, 
  potentially leading to arbitrary code execution, denial of service, or 
  information disclosure depending on heap layout.

locations:
- path_from_root: utils.c
  function_name: buffer_write
  startLine: 21
  startColumn: 9
  endLine: 24
  endColumn: 27