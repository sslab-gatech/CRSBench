id: cpv_0

name: Server-Side Request Forgery via Unvalidated Location Header

cwes:
- CWE-918
- CWE-601

description: |
  Server-Side Request Forgery (SSRF) vulnerability in Apache Olingo OData client library's 
  asynchronous request handling. The AsyncRequestWrapperImpl class accepts an untrusted 
  Location header from HTTP 202 responses and uses it to make subsequent HTTP requests 
  without validation. In retrieveMonitorDetails(), the application extracts the Location 
  header value and creates a URI directly using URI.create(headers[0].getValue()) at line 
  261, then passes it to checkMonitor() which makes an HTTP request to the attacker-controlled 
  URL. This allows attackers to force the application to make requests to arbitrary internal 
  or external hosts, potentially leading to data exfiltration, access to internal services, 
  cloud metadata credential theft, internal network scanning, and bypassing access controls.

locations:
- path_from_root: lib/client-core/src/main/java/org/apache/olingo/client/core/communication/request/v4/AsyncRequestWrapperImpl.java
  function_name: retrieveMonitorDetails
  startLine: 261
  startColumn: 0
  endLine: 261
  endColumn: 0