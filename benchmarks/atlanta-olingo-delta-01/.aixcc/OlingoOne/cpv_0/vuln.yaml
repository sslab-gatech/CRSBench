id: cpv_0

name: SSRF via unvalidated Location header in AsyncRequestWrapperImpl

origin: 1-day

release_date: 01/09/2020

references:
- https://nvd.nist.gov/vuln/detail/CVE-2020-1925
- https://blog.gypsyengineer.com/en/security/cve-2020-1925-ssrf-in-apache-olingo.html

cwes:
- CWE-918
- CWE-20

description: |
  A Server-Side Request Forgery (SSRF) vulnerability exists in Apache Olingo
  versions 4.0.0 through 4.7.0 in the AsyncRequestWrapperImpl class. The
  retrieveMonitorDetails() method reads a URL from the HTTP Location header
  without validating that the URL belongs to the original target server. This
  unvalidated URL is then used by checkMonitor() to send HTTP requests,
  allowing an attacker controlling a malicious OData server to force the client
  to send requests to arbitrary internal or external resources. This can lead
  to data exfiltration, internal network scanning, and access to cloud metadata
  services.

locations:
- type: root_cause
  path_from_root: lib/client-core/src/main/java/org/apache/olingo/client/core/communication/request/v4/AsyncRequestWrapperImpl.java
  function_name: retrieveMonitorDetails
  startLine: 262
  startColumn: 25
  endLine: 262
  endColumn: 52
- type: crash_site
  path_from_root: lib/client-core/src/main/java/org/apache/olingo/client/core/communication/request/v4/AsyncRequestWrapperImpl.java
  function_name: checkMonitor
