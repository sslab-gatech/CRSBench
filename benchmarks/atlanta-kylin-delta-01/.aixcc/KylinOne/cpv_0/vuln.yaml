id: cpv_0

name: OS Command Injection in Apache Kylin Cube Migration API

origin: 1-day

release_date: 05/22/2020

references:
- https://nvd.nist.gov/vuln/detail/CVE-2020-1956
- https://www.openwall.com/lists/oss-security/2020/05/20/1
- https://kylin.apache.org/docs/4.0.4/security/

cwes:
- CWE-78
- CWE-77

description: |
  An OS command injection vulnerability exists in Apache Kylin's cube migration
  feature. The migrateCube() method in CubeService constructs OS commands by
  directly concatenating user-supplied parameters (cube name and project name)
  without validation or sanitization. Attackers can inject shell metacharacters
  (particularly backticks) through the REST API endpoint /kylin/api/cubes/{cube}/{project}/migrate
  to execute arbitrary OS commands on the server, leading to complete system compromise.
  This is CVE-2020-1956 with CVSS 8.8 (HIGH) severity.

locations:
- type: crash_site
  path_from_root: core-common/src/main/java/org/apache/kylin/common/util/CliCommandExecutor.java
  function_name: runNativeCommand
  startLine: 124
  startColumn: 0
  endLine: 126
  endColumn: 0
- type: root_cause
  path_from_root: server-base/src/main/java/org/apache/kylin/rest/service/CubeService.java
  function_name: migrateCube
  startLine: 874
  startColumn: 0
  endLine: 876
  endColumn: 0