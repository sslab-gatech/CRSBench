id: cpv_0

name: URL-Encoded Path Traversal in TikaCLI Embedded File Extraction

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-22
- CWE-23
- CWE-73

description: |
  A path traversal vulnerability exists in the TikaCLI FileEmbeddedDocumentExtractor
  class in the getOutputFile method. The vulnerability occurs due to incorrect order
  of input sanitization operations: the code normalizes the filename first to remove
  path traversal sequences, then URL-decodes it afterward. This allows an attacker
  to bypass path normalization by providing URL-encoded traversal sequences (e.g.,
  ..%2F for ../) in embedded file names within archives. After decoding, these
  sequences become valid path traversal patterns, allowing arbitrary file write
  operations outside the intended extraction directory. This can lead to file
  overwrite, remote code execution, or denial of service.

locations:
