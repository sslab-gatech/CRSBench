id: cpv_4

name: OS Command Injection via Script Interpolation in StringInterpolationConverter

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-94
- CWE-95
- CWE-78

description: |
  An OS command injection vulnerability exists in the resolveVariable method
  of the StringInterpolationConverter class. The vulnerability allows attackers
  to execute arbitrary operating system commands by crafting malicious XML input
  containing ${script:...} interpolation patterns. The code directly evaluates
  attacker-controlled data as JavaScript code without validation or sanitization,
  which can then invoke java.lang.Runtime.exec() to execute OS commands. This
  leads to remote code execution with the privileges of the application process.

locations:
