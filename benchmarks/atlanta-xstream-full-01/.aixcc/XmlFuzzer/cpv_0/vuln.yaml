id: cpv_0

name: XStream XML Deserialization Stack Overflow via Circular References

cwes:
- CWE-674
- CWE-400
- CWE-502

description: |
  A stack overflow denial of service vulnerability occurs in XStream's XML deserialization
  when processing specially crafted XML documents containing circular references in HashSet
  collections. When malicious XML creates a cyclic data structure where a HashSet contains
  nested sets that reference back to parent sets (e.g., <set reference='../../../set/set[2]'/>),
  the Java runtime enters infinite recursion during hashCode() computation. The
  AbstractSet.hashCode() method iterates through elements and recursively calls hashCode()
  on nested sets, causing unbounded recursion until stack exhaustion. This uncontrolled
  recursion results in a StackOverflowError, crashing the application and causing a denial
  of service. The vulnerability is triggered through the XStream.unmarshal() method during
  XML-to-object deserialization, affecting applications that process untrusted XML input.

locations:
- path_from_root: xstream/src/java/com/thoughtworks/xstream/XStream.java
  function_name: unmarshal
  startLine: 1469
  startColumn: 0
  endLine: 1469
  endColumn: 0