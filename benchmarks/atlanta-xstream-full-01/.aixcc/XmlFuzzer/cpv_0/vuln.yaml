id: cpv_0

name: XStream Recursive HashSet Deserialization Denial of Service

origin: 1-day

release_date: 12/27/2022

references:
- https://nvd.nist.gov/vuln/detail/CVE-2022-41966
- https://github.com/advisories/GHSA-j563-grx4-pjpv
- https://x-stream.github.io/CVE-2022-41966.html

cwes:
- CWE-502
- CWE-674
- CWE-400

description: |
  XStream is vulnerable to a Denial of Service attack through stack overflow when
  deserializing maliciously crafted XML containing recursive collection structures.
  When XStream deserializes XML with circular references between HashSet elements,
  it creates Java objects with self-referential relationships. Later, when the Java
  runtime attempts to calculate the hash code of these sets, it recursively traverses
  the circular structure infinitely, exhausting the stack and causing a StackOverflowError.
  The unhandled StackOverflowError terminates the application thread, resulting in
  Denial of Service. This affects applications that deserialize untrusted XML input
  using XStream without proper error handling.

locations:
- type: crash_site
  path_from_root: xstream/src/java/com/thoughtworks/xstream/XStream.java
  function_name: unmarshal
  startLine: 1460
  startColumn: 1
  endLine: 1476
  endColumn: 6