id: cpv_1

name: Stack Overflow via Unbounded Recursion in BinaryStreamReader.readToken()

cwes:
- CWE-674
- CWE-770
- CWE-400

description: |
  A stack overflow vulnerability caused by unbounded recursion in the BinaryStreamReader.readToken() 
  method of the XStream library. When processing binary XML stream data, the method recursively calls 
  itself without any depth limit when encountering TYPE_MAP_ID_TO_VALUE tokens. An attacker can craft 
  a malicious binary stream containing thousands of consecutive mapping tokens, causing each token to 
  trigger a recursive call. This exhausts the Java call stack, resulting in a StackOverflowError and 
  denial of service. The vulnerability occurs at line 158 where the method returns readToken() 
  recursively after processing a mapping token, with no iteration count check or depth limit to 
  prevent stack exhaustion.

locations:
- path_from_root: xstream/src/java/com/thoughtworks/xstream/io/binary/BinaryStreamReader.java
  function_name: readToken
  startLine: 158
  startColumn: 0
  endLine: 158
  endColumn: 0