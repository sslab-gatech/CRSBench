id: cpv_2

name: XML External Entity (XXE) Injection in XStream DomDriver

origin: 1-day

release_date: 05/17/2016

references:
- https://nvd.nist.gov/vuln/detail/CVE-2016-3674
- https://github.com/advisories/GHSA-rgh3-987h-wpmw
- https://x-stream.github.io/CVE-2016-3674.html
- https://github.com/x-stream/xstream/issues/25

cwes:
- CWE-611
- CWE-918

description: |
  An XML External Entity (XXE) injection vulnerability exists in XStream's
  DomDriver class. The vulnerability occurs because the DocumentBuilderFactory
  is created with default settings that allow processing of external entities
  and DOCTYPE declarations. An attacker can craft a malicious XML document
  containing a DOCTYPE declaration with external entity references, which when
  processed by XStream using the DomDriver, causes the XML parser to make
  external HTTP requests. This enables Server-Side Request Forgery (SSRF),
  allowing attackers to read local files using file:// protocol, probe internal
  network services, exfiltrate sensitive data, or conduct denial-of-service
  attacks. The vulnerability affects all XStream versions before 1.4.9 when
  using DOM, DOM4J, JDOM, JDOM2, StAX, or XOM XML parsers.

