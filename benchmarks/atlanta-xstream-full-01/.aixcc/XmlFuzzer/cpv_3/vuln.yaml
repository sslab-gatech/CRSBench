id: cpv_3

name: Uncontrolled Resource Consumption via Timestamp Parsing

cwes:
- CWE-400
- CWE-834
- CWE-770

description: |
  An uncontrolled resource consumption vulnerability exists in the SqlTimestampConverter.fromString() 
  method of XStream. The vulnerability is caused by an off-by-one error in the validation logic that 
  allows timestamp strings with 10 or more fractional second digits to pass validation. When processing 
  such input, the code enters an infinite loop attempting to pad a buffer of length 10+ to exactly 9 
  characters by continuously appending zeros. This results in rapid heap memory exhaustion and causes 
  an OutOfMemoryError, leading to application crash and denial of service. An attacker can exploit 
  this by providing malicious XML input containing a sql-timestamp element with an excessively long 
  fractional seconds component (e.g., "1970-01-01 00:00:01.0000789012"). The vulnerability requires 
  no authentication and can be triggered with minimal effort through any XStream deserialization endpoint.

locations:
- path_from_root: xstream/src/java/com/thoughtworks/xstream/converters/extended/SqlTimestampConverter.java
  function_name: fromString
  startLine: 75
  startColumn: 0
  endLine: 84
  endColumn: 0