id: cpv_3

name: XStream SqlTimestampConverter Input Validation Error Leading to DoS

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-400
- CWE-835
- CWE-770

description: |
  An off-by-one error in the SqlTimestampConverter.fromString() method allows
  timestamp strings with 10 fractional digits instead of the correct maximum of
  9 digits (nanosecond precision). The validation at line 75 incorrectly checks
  if str.length() - idx > 11, allowing inputs with 10 fractional digits to pass.
  When such input is provided, the padding loop at lines 82-83 attempts to pad
  the 10-character fractional part to exactly 9 characters, creating an infinite
  loop that continuously appends '0' characters until memory is exhausted. This
  results in a Denial of Service through uncontrolled resource consumption.

locations:
- type: root_cause
  path_from_root: xstream/src/java/com/thoughtworks/xstream/converters/extended/SqlTimestampConverter.java
  function_name: fromString
  startLine: 75
  startColumn: 1
  endLine: 75
  endColumn: 100
- type: crash_site
  path_from_root: xstream/src/java/com/thoughtworks/xstream/converters/extended/SqlTimestampConverter.java
  function_name: fromString
  startLine: 82
  startColumn: 1
  endLine: 83
  endColumn: 100