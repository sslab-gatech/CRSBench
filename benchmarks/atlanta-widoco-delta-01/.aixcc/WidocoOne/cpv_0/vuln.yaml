id: cpv_0

name: Zip Slip Path Traversal in unZipIt

origin: 1-day

release_date: 12/27/2022

references:
- https://nvd.nist.gov/vuln/detail/CVE-2022-4772
- https://github.com/dgarijo/Widoco/pull/551
- https://github.com/dgarijo/Widoco/commit/f2279b76827f32190adfa9bd5229b7d5a147fa92
- https://security.snyk.io/vuln/SNYK-JAVA-COMGITHUBDGARIJO-3227637

cwes:
- CWE-22
- CWE-23

description: |
  A Zip Slip path traversal vulnerability exists in the unZipIt function
  in src/main/java/widoco/WidocoUtils.java. The function constructs file
  paths from ZIP entry names without proper validation, allowing an attacker
  to extract files outside the intended directory by using relative path
  traversal sequences (e.g., ../). This can lead to arbitrary file write,
  overwriting of system files, and potentially remote code execution by
  placing malicious files in sensitive locations.

