id: cpv_0

name: Stack Buffer Overflow in tmux input_osc_52 Function Due to Incorrect sizeof Usage

origin: 1-day

release_date: 06/11/2022

cwes:
- CWE-121
- CWE-131
- CWE-467

description: |
  A stack buffer overflow vulnerability exists in the input_osc_52 function
  in input.c. The vulnerability is caused by incorrect use of the sizeof
  operator on a pointer variable instead of a string literal. The flags
  buffer is allocated with only 8 bytes (sizeof pointer) instead of 13 bytes
  (sizeof string "cpqs01234567"). When processing OSC 52 escape sequences
  with selection parameters containing more than 8 unique allowed characters,
  the validation loop writes beyond the allocated buffer, causing stack
  corruption. This can lead to denial of service or potentially arbitrary
  code execution.

locations:
- type: root_cause
  path_from_root: input.c
  function_name: input_osc_52
  startLine: 2697
  endLine: 2697
- type: crash_site
  path_from_root: input.c
  function_name: input_osc_52
  startLine: 2714
  endLine: 2714
