id: cpv_1

name: Heap Buffer Over-read in OSC Color Parameter Parsing

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-125
- CWE-787

description: |
  A heap buffer over-read vulnerability exists in the input_osc_parse_colour
  function in input.c. When parsing OSC 11 escape sequences (background color),
  the function skips leading spaces without updating the length variable. This
  creates a discrepancy between the pointer position and tracked length, causing
  subsequent operations to read beyond allocated buffer boundaries. An attacker
  can trigger this by providing an OSC 11 sequence with many leading spaces,
  potentially leading to information disclosure or denial of service.

locations:
- type: crash_site
  path_from_root: input.c
  function_name: input_osc_parse_colour
  startLine: 2488
  startColumn: 12
  endLine: 2489
  endColumn: 6