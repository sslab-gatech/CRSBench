id: cpv_1

name: Heap buffer overflow in tmux OSC color parsing whitespace handling

cwes:
- CWE-122
- CWE-125
- CWE-787

description: |
  A heap-based buffer overflow (out-of-bounds read) vulnerability exists in the
  input_osc_parse_colour function of tmux's input parsing code. The function is
  responsible for parsing OSC (Operating System Command) color specifications
  from terminal escape sequences.
  
  The vulnerability occurs when parsing color strings that contain only whitespace
  characters. After calculating the string length, the code attempts to skip leading
  whitespace characters with 'while (*p == ' ')' without checking if the remaining
  buffer length has been exhausted or decrementing the length counter. This allows
  the pointer to advance beyond the allocated buffer boundary, causing an out-of-bounds
  read when dereferencing *p.
  
  The vulnerability can be triggered by sending specially crafted terminal escape
  sequences (e.g., '\033]11;               \033') to tmux. This can lead to information
  disclosure through heap memory leakage, denial of service via crash, and potential
  exploitation by malicious terminal applications or attackers who can inject escape
  sequences into terminal output.

locations:
- path_from_root: input.c
  function_name: input_osc_parse_colour
  startLine: 2488
  startColumn: 22
  endLine: 2489
  endColumn: 0