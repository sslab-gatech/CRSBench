id: cpv_3

name: Heap Use-After-Free in BFD Cache Management for IA-64 VMS ELF Files

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-416
- CWE-672

description: |
  A heap use-after-free vulnerability exists in the Binary File Descriptor (BFD)
  library when processing malformed IA-64 OpenVMS ELF files. The vulnerability
  occurs due to a logic flaw in the error handling path during BFD closure.
  
  The root cause has two components:
  1. The elf64_vms_close_and_cleanup function attempts to perform write operations
     on a BFD opened for reading only, causing the cleanup to fail.
  2. The bfd_close_all_done function incorrectly handles cleanup failures,
     freeing the BFD structure (_bfd_delete_bfd) while it remains referenced
     in the global cache linked list (bfd_last_cache).
  
  When a subsequent bfd_fopen call triggers cache initialization, the insert
  function dereferences the freed BFD pointer (bfd_last_cache->lru_prev),
  resulting in a heap use-after-free read. This can lead to memory corruption,
  information disclosure, or potential code execution.

locations:
- type: crash_site
  path_from_root: bfd/cache.c
  function_name: insert
  startLine: 137
  startColumn: 40
  endLine: 137
  endColumn: 40
- type: root_cause
  path_from_root: bfd/opncls.c
  function_name: bfd_close_all_done
  startLine: 895
  startColumn: 1
  endLine: 909
  endColumn: 1
- type: root_cause
