id: cpv_3

name: BFD Cache LRU Use-After-Free in bfd_close_all_done

cwes:
- CWE-416
- CWE-672

description: |
  A heap-use-after-free vulnerability in the BFD library's cache management system.
  The vulnerability occurs in bfd_close_all_done when handling malformed binary files.
  When _close_and_cleanup returns false for a read-only file, the bclose function is
  not called, leaving the BFD object in the LRU cache. However, _bfd_delete_bfd still
  frees the BFD structure, creating a dangling pointer in the global bfd_last_cache
  linked list. When bfd_cache_init is subsequently called, the insert function attempts
  to access bfd_last_cache->lru_prev, triggering a use-after-free on freed memory.
  This can lead to process crashes, memory corruption, or potential code execution when
  processing untrusted binary files with binutils tools (nm, objdump, readelf, etc.).

locations:
- path_from_root: bfd/cache.c
  function_name: insert
  startLine: 137
  startColumn: 40
  endLine: 137
  endColumn: 40
- path_from_root: bfd/opncls.c
  function_name: bfd_close_all_done
  startLine: 892
  startColumn: 0
  endLine: 905
  endColumn: 0