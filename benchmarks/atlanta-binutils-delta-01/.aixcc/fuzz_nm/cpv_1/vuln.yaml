id: cpv_1

name: Heap Use-After-Free in BFD PE Format Reinitialization

cwes:
- CWE-416
- CWE-672

description: |
  A heap use-after-free vulnerability occurs in the BFD library during PE format
  detection and reinitialization. When processing PE files, the bfd_in_memory
  structure (bim) is prematurely freed in io_reinit during format matching failures.
  Subsequently, the memory_bstat function attempts to read from the freed bim structure
  to determine file size, resulting in a use-after-free read at bfd/bfdio.c:889.
  
  The vulnerability is triggered when:
  1. pe_ILF_build_a_bfd allocates a bfd_in_memory structure for in-memory file handling
  2. Format matching fails, causing bfd_reinit to call io_reinit
  3. io_reinit prematurely frees abfd->iostream (pointing to bim) during I/O vector transition
  4. Subsequent calls to coff_get_reloc_upper_bound invoke memory_bstat, which dereferences
     the freed bim structure
  
  This affects all binutils tools processing PE files (nm, objdump, objcopy, etc.) and
  can lead to crashes, information disclosure, or potential code execution if an attacker
  can control the freed memory region.

locations:
- path_from_root: bfd/bfdio.c
  function_name: memory_bstat
  startLine: 889
  startColumn: 27
  endLine: 889
  endColumn: 27
- path_from_root: bfd/format.c
  function_name: io_reinit
  startLine: 184
  startColumn: 6
  endLine: 184
  endColumn: 6