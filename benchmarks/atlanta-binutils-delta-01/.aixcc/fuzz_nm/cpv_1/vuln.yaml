id: cpv_1

name: Heap-use-after-free in BFD format checking during PE ILF object processing

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-416
- CWE-672

description: |
  A heap-use-after-free vulnerability exists in the BFD library when processing
  PE (Portable Executable) format files. The io_reinit() function in bfd/format.c
  and _bfd_delete_bfd() in bfd/opncls.c prematurely free the abfd->iostream
  structure (bfd_in_memory) when the BFD_IN_MEMORY flag is set during format
  checking. This structure is later accessed by memory_bstat() when called
  through coff_get_reloc_upper_bound() -> bfd_get_file_size() -> bfd_stat(),
  resulting in a use-after-free read. This can lead to denial of service crashes
  and potentially arbitrary code execution if the freed memory is reallocated
  and controlled by an attacker.

locations:
- type: crash_site
  path_from_root: bfd/bfdio.c
  function_name: memory_bstat
  startLine: 884
  startColumn: 1
  endLine: 892
  endColumn: 1
- type: root_cause
  path_from_root: bfd/format.c
  function_name: io_reinit
  startLine: 172
  startColumn: 1
  endLine: 196
  endColumn: 1
- type: root_cause
  path_from_root: bfd/opncls.c
  function_name: _bfd_delete_bfd
  startLine: 171
  startColumn: 1
  endLine: 172
  endColumn: 1