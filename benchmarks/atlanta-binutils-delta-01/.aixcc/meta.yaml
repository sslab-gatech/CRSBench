patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
delta_mode:
  base_commit: 9b026264097aa5f328a2d23f985fde961b41ef2e
  ref_commit: f3c80b3bbaa8aaaebddb74c51099a01af4767e7c
full_mode:
  base_commit: f3c80b3bbaa8aaaebddb74c51099a01af4767e7c
harness_files:
- name: fuzz_addr2line
  path: $PROJECT/fuzz_addr2line.c
- name: fuzz_as
  path: $PROJECT/fuzz_as.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'
- name: fuzz_bfd
  path: $PROJECT/fuzz_bfd.c
- name: fuzz_bfd_ext
  path: $PROJECT/fuzz_bfd_ext.c
- name: fuzz_disassemble
  path: $PROJECT/fuzz_disassemble.c
  vulns:
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: SEGV on unknown address'
- name: fuzz_dlltool
  path: $PROJECT/fuzz_dlltool.c
- name: fuzz_dwarf
  path: $PROJECT/fuzz_dwarf.c
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-use-after-free'
- name: fuzz_nm
  path: $PROJECT/fuzz_nm.c
  vulns:
  - vuln_keyword: cpv_4
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-use-after-free'
  - vuln_keyword: cpv_3
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-use-after-free'
- name: fuzz_objcopy
  path: $PROJECT/fuzz_objcopy.c
- name: fuzz_objdump
  path: $PROJECT/fuzz_objdump.c
- name: fuzz_ranlib_simulation
  path: $PROJECT/fuzz_ranlib_simulation.c
- name: fuzz_readelf
  path: $PROJECT/fuzz_readelf.c
- name: fuzz_strings
  path: $PROJECT/fuzz_strings.c
- name: fuzz_windres
  path: $PROJECT/fuzz_windres.c
