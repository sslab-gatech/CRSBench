id: cpv_2

name: NULL pointer dereference in KVX disassembler due to incomplete initialization

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-476
- CWE-665

description: |
  A NULL pointer dereference vulnerability exists in the KVX disassembler
  component of GNU binutils. The vulnerability occurs when the kvx_dis_init
  function returns an error without initializing the global env structure,
  leaving env.opc_table as NULL. The calling function print_insn_kvx does
  not check the return value and proceeds to call decode_insn, which
  immediately dereferences the NULL pointer in a for-loop condition. This
  can be triggered by providing crafted input with unsupported architecture
  or machine type values, resulting in a segmentation fault and denial of
  service.

locations:
- type: crash_site
  path_from_root: opcodes/kvx-dis.c
  function_name: decode_insn
  startLine: 566
  startColumn: 12
  endLine: 566
  endColumn: 12
- type: root_cause
  path_from_root: opcodes/kvx-dis.c
  function_name: kvx_dis_init
  startLine: 210
  startColumn: 1
  endLine: 260
  endColumn: 1