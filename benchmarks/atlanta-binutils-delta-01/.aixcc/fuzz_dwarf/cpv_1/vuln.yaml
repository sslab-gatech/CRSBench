id: cpv_1

name: BFD PE ILF Format Matching Use-After-Free

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-416
- CWE-415

description: |
  A heap-use-after-free vulnerability exists in the GNU binutils BFD library
  when processing PE Import Library Format (ILF) files. During format matching,
  the io_reinit function prematurely frees the bfd_in_memory structure stored
  in abfd->iostream. Later, when the BFD is closed, memory_bclose attempts to
  access the already-freed structure, causing a use-after-free condition. This
  results from a double ownership problem where both io_reinit and memory_bclose
  attempt to free the same memory. The vulnerability can lead to denial of service
  and potentially arbitrary code execution.

locations:
- type: crash_site
  path_from_root: bfd/bfdio.c
  function_name: memory_bclose
  startLine: 870
  startColumn: 14
  endLine: 870
  endColumn: 14
- type: root_cause
  path_from_root: bfd/format.c
  function_name: io_reinit
