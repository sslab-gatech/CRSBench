id: cpv_1

name: Integer Negation Overflow in CFF CharStrings Decoder

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-190
- CWE-191

description: |
  An integer negation overflow vulnerability exists in the cff_decoder_parse_charstrings
  function in src/psaux/cffdecode.c. When processing CFF font glyph data, the code
  attempts to compute absolute values using direct negation (-dx or -dy). This fails
  with undefined behavior when the value is LONG_MIN (-9223372036854775808 on 64-bit
  systems), as negating LONG_MIN exceeds LONG_MAX. The vulnerability is triggered when
  processing specially crafted CFF fonts with extreme coordinate values, potentially
  causing crashes or incorrect font rendering.

locations:
- type: crash_site
  path_from_root: src/psaux/cffdecode.c
  function_name: cff_decoder_parse_charstrings
  startLine: 1564
  startColumn: 20
  endLine: 1564
  endColumn: 20
- type: root_cause
