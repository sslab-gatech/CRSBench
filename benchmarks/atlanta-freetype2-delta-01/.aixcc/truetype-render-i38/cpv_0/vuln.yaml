id: cpv_0

name: BDF Font Parser Memory Leak in ENDCHAR Handler

cwes:
- CWE-401
- CWE-772

description: |
  A memory leak vulnerability exists in the BDF (Bitmap Distribution Format) font
  parser in FreeType2's bdf_parse_glyphs_ function. When processing malformed BDF
  font files, memory allocated for the glyph name (p->glyph_name) via FT_DUP() in
  the STARTCHAR handler is not freed when an ENDCHAR field is encountered without
  an intervening ENCODING field. This occurs because the ENDCHAR handler resets
  parsing state but fails to release the allocated glyph name memory. In normal
  operation, the glyph name is transferred to a glyph structure, but malformed
  fonts that contain STARTCHAR immediately followed by ENDCHAR cause the memory
  to leak. Repeated parsing of such malicious BDF files can lead to memory
  exhaustion and denial of service, particularly in long-running applications
  like font servers that process untrusted fonts.

locations:
- path_from_root: src/bdf/bdflib.c
  function_name: bdf_parse_glyphs_
  startLine: 1447
  startColumn: 0
  endLine: 1454
  endColumn: 0