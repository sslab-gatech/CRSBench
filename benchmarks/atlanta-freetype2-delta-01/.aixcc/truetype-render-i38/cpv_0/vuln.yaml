id: cpv_0

name: BDF Font Parser Memory Leak in ENDCHAR Processing

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-401
- CWE-772

description: |
  A memory leak vulnerability exists in the BDF (Bitmap Distribution Format) font
  parser in FreeType. When the parser encounters a STARTCHAR command, it allocates
  memory to store the glyph name via FT_DUP macro, which internally calls ft_mem_dup()
  and malloc(). However, when an ENDCHAR command is subsequently processed, the code
  clears the glyph parsing state but fails to free the allocated glyph_name memory.
  In malformed BDF font files with consecutive STARTCHAR declarations or when processing
  multiple glyphs in sequence, each STARTCHAR allocates new memory without freeing the
  previous allocation, resulting in a direct memory leak. This can lead to memory
  exhaustion and denial of service through resource exhaustion.

