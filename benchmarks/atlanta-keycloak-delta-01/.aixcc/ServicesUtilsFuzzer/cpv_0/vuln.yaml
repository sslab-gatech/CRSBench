id: cpv_0

name: Regular Expression Denial of Service in SearchQueryUtils

origin: 1-day

release_date: 11/25/2024

references:
- https://nvd.nist.gov/vuln/detail/CVE-2024-10270
- https://github.com/advisories/GHSA-wq8x-cg39-8mrr

cwes:
- CWE-1333
- CWE-185
- CWE-400
- CWE-674

description: |
  A Regular Expression Denial of Service (ReDoS) vulnerability exists in the
  Keycloak SearchQueryUtils class. The queryPattern regex contains nested
  quantifiers (?:(?:[^\":\\s]?)+)+ which causes catastrophic backtracking
  when processing malicious input. An attacker can send a specially crafted
  query string containing many backslashes to trigger exponential time
  complexity in the regex engine, leading to stack overflow and complete
  denial of service. The vulnerability affects the getFields() method which
  processes untrusted input without validation.

locations:
- type: root_cause
  path_from_root: services/src/main/java/org/keycloak/utils/SearchQueryUtils.java
  function_name: getFields
