id: cpv_0

name: Heap buffer over-read in put_pixel_rows with quantized CMYK/RGB565

origin: 1-day

release_date: 11/29/2018

references:
- https://nvd.nist.gov/vuln/detail/CVE-2018-19664
- https://github.com/libjpeg-turbo/libjpeg-turbo/issues/305

cwes:
- CWE-125
- CWE-122
- CWE-787

description: |
  A heap-based buffer over-read vulnerability exists in libjpeg-turbo when
  color quantization is enabled in combination with CMYK or RGB565 color spaces.
  When quantization is on, the output buffer is allocated with only 1 component
  per pixel, but the put_pixel_rows function attempts to read 4 components for
  CMYK data, causing it to read beyond the allocated buffer boundary. This occurs
  because jinit_write_bmp incorrectly assigns put_pixel_rows as the output handler
  without checking if quantization is enabled. The vulnerability can lead to
  information disclosure and crashes when processing specially crafted JPEG files.

locations:
- type: crash_site
  path_from_root: wrbmp.c
  function_name: put_pixel_rows
  startLine: 145
  startColumn: 19
  endLine: 145
  endColumn: 19
- type: root_cause
  path_from_root: wrbmp.c
  function_name: jinit_write_bmp
  startLine: 509
  startColumn: 1
  endLine: 511
  endColumn: 50