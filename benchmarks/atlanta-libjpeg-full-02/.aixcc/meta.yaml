patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

full_mode:
  base_commit: 9c4aeecb7d93debdbd1cff9a82b104b365171906

harness_files:
- name: libjpeg_turbo_fuzzer
  path: $PROJECT/libjpeg_turbo_fuzzer.cc

- name: libjpeg_djpeg_fuzzer
  path: $PROJECT/libjpeg_djpeg_fuzzer.cc
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
