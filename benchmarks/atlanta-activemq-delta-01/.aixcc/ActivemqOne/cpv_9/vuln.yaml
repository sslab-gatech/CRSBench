id: cpv_9

name: Remote Code Execution via Insecure Deserialization in OpenWire Protocol

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-913

description: |
  A critical Remote Code Execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The BaseDataStreamMarshaller.createThrowable()
  method accepts an arbitrary class name from untrusted network data and uses
  reflection to instantiate it without validating that the class is actually
  a Throwable type. This insecure deserialization allows a remote attacker
  with network access to an OpenWire broker or client to instantiate any class
  on the Java classpath with a single attacker-controlled String parameter,
  leading to arbitrary code execution.

locations:
- type: crash_site
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v10/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 1
  endLine: 239
  endColumn: 80
