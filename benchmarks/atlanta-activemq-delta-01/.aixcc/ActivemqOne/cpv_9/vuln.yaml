id: cpv_9

name: OpenWire ExceptionResponse Arbitrary Class Instantiation

cwes:
- CWE-502
- CWE-470
- CWE-20

description: |
  Critical remote code execution vulnerability in Apache ActiveMQ's OpenWire protocol
  implementation. The vulnerability exists in the createThrowable method of the
  BaseDataStreamMarshaller class across multiple protocol versions (v1, v9-v12).
  
  When deserializing an ExceptionResponse message, the code reads an attacker-controlled
  class name from the untrusted input stream and directly passes it to Class.forName()
  without validation. The class is then instantiated using reflection before verifying
  it is a Throwable subclass. This allows an attacker to instantiate arbitrary classes
  with a String constructor, leading to potential remote code execution depending on
  available classes on the classpath.
  
  The vulnerability is triggered through the looseUnmarsalThrowable method which reads
  both the class name and message from attacker-controlled input, then invokes
  createThrowable without any validation. An attacker can craft a malicious OpenWire
  message containing an ExceptionResponse with an arbitrary class name to achieve
  code execution, data exfiltration, or denial of service.

