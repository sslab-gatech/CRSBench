id: cpv_10

name: OpenWire Protocol Arbitrary Class Instantiation RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt

cwes:
- CWE-502
- CWE-20
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller.java accepts an arbitrary class name from
  deserialized OpenWire protocol data and uses reflection to instantiate it
  without verifying that the class extends Throwable. This allows a remote
  attacker with network access to instantiate any class on the classpath with
  a single string parameter, enabling arbitrary code execution through
  dangerous classes like ClassPathXmlApplicationContext. The vulnerability
  requires no authentication and has a CVSS score of 10.0 CRITICAL.

locations:
- type: crash_site
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v11/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 228
  startColumn: 1
  endLine: 238
  endColumn: 6