id: cpv_6

name: Apache ActiveMQ OpenWire Arbitrary Class Instantiation via Deserialization

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  Critical remote code execution vulnerability in Apache ActiveMQ's OpenWire protocol 
  deserialization. The createThrowable() method in BaseDataStreamMarshaller uses 
  Class.forName() to dynamically instantiate exception classes based on untrusted 
  network input without validation. When processing ExceptionResponse messages during 
  deserialization, an attacker can specify an arbitrary class name that will be loaded 
  and instantiated via reflection. This allows instantiation of any class with a String 
  constructor available on the classpath, enabling gadget chain attacks and remote code 
  execution. The vulnerability affects all OpenWire protocol versions (v1-v12) and was 
  introduced when implementing adaptive throwable creation per the OpenWire specification.

