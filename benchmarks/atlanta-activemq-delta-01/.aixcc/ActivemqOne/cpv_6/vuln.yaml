id: cpv_6

name: Apache ActiveMQ OpenWire Protocol Remote Code Execution via Unsafe Deserialization

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35

cwes:
- CWE-502
- CWE-470
- CWE-20

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller accepts an externally-controlled className parameter
  from the network and uses it directly with Class.forName() and reflection to
  instantiate any class on the classpath without proper validation. An attacker
  can send a specially crafted OpenWire packet to instantiate arbitrary classes
  that have a constructor accepting a single String parameter, enabling remote
  code execution through gadget chains, arbitrary file system operations, and
  complete system compromise. This vulnerability (CVE-2023-46604) has a CVSS
  score of 9.8/10.0 and is actively exploited in the wild.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v7/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 228
  startColumn: 1
  endLine: 238
  endColumn: 80