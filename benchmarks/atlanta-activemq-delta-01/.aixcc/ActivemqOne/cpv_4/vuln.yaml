id: cpv_4

name: Apache ActiveMQ OpenWire Arbitrary Class Instantiation

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://osv.dev/vulnerability/CVE-2023-46604
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's 
  OpenWire protocol marshaller. The createThrowable method in 
  BaseDataStreamMarshaller accepts an arbitrary className parameter from 
  untrusted network input and uses Class.forName() to load any class on the 
  classpath, then instantiates it via reflection without verifying that the 
  class is actually a subclass of Throwable. This allows an attacker to 
  instantiate any arbitrary class that has a constructor accepting a single 
  String parameter, leading to remote code execution. The vulnerability can 
  be exploited without authentication by sending a malicious OpenWire protocol 
  message containing an ExceptionResponse object.

