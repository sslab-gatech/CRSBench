id: cpv_1

name: Apache ActiveMQ OpenWire Protocol Arbitrary Class Instantiation

cwes:
- CWE-470
- CWE-502
- CWE-94

description: |
  The vulnerability exists in the createThrowable() method within BaseDataStreamMarshaller.java
  across multiple OpenWire protocol versions. The method accepts an attacker-controlled className
  string from network data and uses it directly in a Class.forName() call without validation.
  
  When an OpenWire protocol message containing an ExceptionResponse is unmarshalled, the exception's
  class name is read from untrusted input. The code then uses Class.forName() to load the specified
  class and invokes its constructor with an attacker-controlled message string. This allows an
  attacker to instantiate arbitrary classes that have a constructor accepting a single String
  parameter, potentially achieving Remote Code Execution (RCE) depending on available classes on
  the classpath.
  
  The attack vector is through network-accessible OpenWire protocol endpoints, requiring no
  authentication or user interaction. Successful exploitation could lead to complete server
  compromise, data theft or manipulation, lateral movement in the network, or denial of service.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v2/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  endLine: 240
  startColumn: 0
  endColumn: 0