id: cpv_1

name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://osv.dev/vulnerability/BIT-activemq-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-094

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol implementation. The createThrowable method in
  BaseDataStreamMarshaller.java accepts an externally-controlled class name
  and instantiates it using reflection without validating that the class is
  actually a subclass of Throwable. An attacker with network access can send
  a malicious OpenWire ExceptionResponse message specifying an arbitrary class
  name and constructor argument, causing the system to instantiate that class
  with attacker-controlled parameters. This allows complete system compromise
  through remote code execution without requiring authentication.

locations:
- type: root_cause
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v2/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 1
  endLine: 239
  endColumn: 6