id: cpv_8

name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

cwes:
- CWE-502
- CWE-470
- CWE-094

description: |
  Remote Code Execution vulnerability in Apache ActiveMQ's OpenWire protocol implementation.
  The BaseDataStreamMarshaller.createThrowable() method uses unsafe reflection to instantiate
  arbitrary classes based on externally-controlled data from OpenWire messages. When unmarshalling
  ExceptionResponse messages, the method calls Class.forName() with an attacker-controlled class
  name and instantiates it via Constructor.newInstance() without any validation. This allows an
  attacker to instantiate arbitrary classes available on the classpath that have a String
  constructor, enabling gadget chain attacks similar to Java deserialization vulnerabilities.
  The vulnerability exists across multiple OpenWire protocol versions (v1, v9, v10, v11, v12)
  and can be exploited remotely without authentication, potentially leading to complete system
  compromise.

locations:
- path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v9/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 232
  endLine: 232
  startColumn: 0
  endColumn: 0