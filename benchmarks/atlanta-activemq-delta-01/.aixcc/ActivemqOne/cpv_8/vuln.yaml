id: cpv_8

name: Apache ActiveMQ OpenWire Protocol Arbitrary Class Instantiation RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt
- https://www.cisa.gov/known-exploited-vulnerabilities-catalog

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol implementation. The createThrowable method in
  BaseDataStreamMarshaller allows arbitrary class instantiation during
  deserialization of ExceptionResponse objects. An attacker can send a malicious
  OpenWire message containing attacker-controlled className and message strings,
  which are passed to Class.forName() and instantiated without validation. This
  enables loading and instantiating arbitrary classes on the classpath (such as
  ClassPathXmlApplicationContext), leading to unauthenticated remote code execution
  with ActiveMQ server privileges. This vulnerability is actively exploited in the
  wild and is listed in CISA's Known Exploited Vulnerabilities Catalog.

locations:
- type: crash_site
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v9/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 228
  startColumn: 0
  endLine: 238
  endColumn: 0