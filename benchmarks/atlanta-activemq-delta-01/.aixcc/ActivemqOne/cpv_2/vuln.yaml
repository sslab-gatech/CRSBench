id: cpv_2

name: Apache ActiveMQ OpenWire Deserialization RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  Java OpenWire protocol marshaller. The createThrowable() method in
  BaseDataStreamMarshaller accepts an arbitrary class name from network input
  and uses Java reflection to instantiate it without validating that the class
  is actually a Throwable. An attacker can send a crafted OpenWire packet
  containing a malicious class name (e.g., ClassPathXmlApplicationContext) to
  execute arbitrary code on the ActiveMQ server or client. The vulnerability
  requires only network access to the OpenWire port and no authentication.

locations:
