id: cpv_11

name: Apache ActiveMQ OpenWire Arbitrary Class Instantiation via Exception Unmarshaling

cwes:
- CWE-502
- CWE-470
- CWE-913

description: |
  Remote Code Execution vulnerability in Apache ActiveMQ's OpenWire protocol implementation.
  The createThrowable method in BaseDataStreamMarshaller accepts an externally-controlled
  className parameter from untrusted network data and uses it to instantiate arbitrary classes
  via reflection without validation. An attacker can craft a malicious OpenWire message
  containing an ExceptionResponse object with a specially chosen class name. When the ActiveMQ
  client unmarshals this message, it loads and instantiates the arbitrary class using
  Class.forName() and constructor.newInstance(), potentially executing malicious code.
  The vulnerability exists in both v11 and v12 implementations and can lead to remote code
  execution, denial of service, or information disclosure depending on available classes
  on the classpath.

locations:
- path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v12/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 230
  startColumn: 0
  endLine: 234
  endColumn: 0
- path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v11/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 230
