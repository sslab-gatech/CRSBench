id: cpv_11

name: Apache ActiveMQ OpenWire Protocol Remote Code Execution via Unsafe Deserialization

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's OpenWire
  protocol implementation. The createThrowable method in BaseDataStreamMarshaller
  accepts an attacker-controlled className parameter and uses reflection to instantiate
  any class on the classpath without verifying that the class is actually a Throwable
  type. When deserializing ExceptionResponse messages, an attacker can specify a
  malicious class that executes arbitrary code when instantiated. This vulnerability
  has a CVSS score of 10.0 CRITICAL and allows complete system compromise through
  arbitrary code execution with no authentication required.

locations:
- type: crash_site
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v12/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 230
  startColumn: 0
  endLine: 240
  endColumn: 0
- type: root_cause
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v12/BaseDataStreamMarshaller.java
  function_name: createThrowable
