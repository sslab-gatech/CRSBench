id: cpv_0

name: Apache ActiveMQ OpenWire Unsafe Exception Deserialization RCE

cwes:
- CWE-502
- CWE-470
- CWE-20

description: |
  Unsafe deserialization vulnerability in Apache ActiveMQ's OpenWire protocol implementation
  that allows remote code execution through arbitrary class instantiation. The vulnerability
  exists in the BaseDataStreamMarshaller.createThrowable() method across all OpenWire protocol
  versions (v1-v12). When processing ExceptionResponse messages, the method accepts an
  externally-controlled class name from network data and uses reflection to instantiate it
  without validating that the class extends Throwable. An attacker can craft a malicious
  OpenWire message containing an arbitrary class name, which will be loaded via Class.forName()
  and instantiated through constructor invocation. Even though the cast to Throwable eventually
  fails, the constructor has already executed, allowing code execution if the instantiated
  class has malicious side effects. This enables complete system compromise, unauthorized
  data access, and potential lateral movement in networked environments.

locations:
- path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v1/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 230
  startColumn: 1
  endLine: 234
  endColumn: 1