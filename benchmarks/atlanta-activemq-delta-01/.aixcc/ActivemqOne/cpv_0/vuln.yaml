id: cpv_0

name: Apache ActiveMQ OpenWire Protocol Deserialization RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-665

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The BaseDataStreamMarshaller.createThrowable()
  method accepts externally controlled class names and constructor parameters
  from deserialized OpenWire protocol messages without validation. The method
  uses Java reflection to load and instantiate arbitrary classes on the
  classpath via Class.forName() and Constructor.newInstance(), without
  verifying that the loaded class is actually a subclass of Throwable. This
  allows an attacker with network access to send crafted OpenWire messages
  that instantiate arbitrary classes with attacker-controlled constructor
  parameters, leading to remote code execution. The vulnerability has been
  actively exploited in the wild by ransomware and botnet campaigns. CVSS
  score 10.0.

locations:
- type: root_cause
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v1/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 232
  startColumn: 1
  endLine: 234
  endColumn: 1