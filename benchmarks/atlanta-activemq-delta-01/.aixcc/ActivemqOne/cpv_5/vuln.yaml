id: cpv_5

name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in BaseDataStreamMarshaller
  accepts an arbitrary class name from untrusted network input and uses Class.forName()
  to load it, followed by reflective instantiation via Constructor.newInstance().
  There is no validation to ensure the loaded class is actually a subclass of Throwable,
  allowing an attacker to instantiate any class on the classpath that has a constructor
  accepting a single String parameter. An attacker with network access to an ActiveMQ
  broker's OpenWire port can send a malicious ExceptionResponse message to execute
  arbitrary code without authentication.

locations:
