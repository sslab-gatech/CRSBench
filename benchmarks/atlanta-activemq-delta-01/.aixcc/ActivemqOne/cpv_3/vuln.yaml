id: cpv_3

name: Apache ActiveMQ OpenWire Unsafe Throwable Deserialization RCE

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  Unsafe deserialization vulnerability in Apache ActiveMQ's OpenWire protocol 
  implementation. The BaseDataStreamMarshaller.createThrowable() method accepts 
  an externally-controlled className parameter from the wire protocol and uses 
  it to instantiate arbitrary classes via reflection without validation. An 
  attacker can craft a malicious OpenWire ExceptionResponse message specifying 
  any class name on the classpath, which will be instantiated through 
  Class.forName() and Constructor.newInstance(). This enables remote code 
  execution by instantiating malicious classes or exploiting gadget chains, 
  similar to Java deserialization attacks. The vulnerability was introduced in 
  commit a1766fc to support adaptive throwable creation and affects multiple 
  OpenWire protocol versions (v4, v11, etc.). The fix adds validation to ensure 
  only classes assignable to Throwable can be instantiated.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v4/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 233
  startColumn: 0
  endLine: 233
  endColumn: 0