id: cpv_3

name: Apache ActiveMQ OpenWire Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://osv.dev/vulnerability/CVE-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller allows arbitrary class instantiation without proper
  validation. An attacker with network access can send a malicious
  ExceptionResponse message containing an arbitrary class name and parameter,
  causing the application to load and instantiate any class with a String
  constructor. This enables remote code execution by exploiting classes like
  ClassPathXmlApplicationContext to load malicious XML configurations.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v4/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 1
  endLine: 239
  endColumn: 5