id: cpv_7

name: Apache ActiveMQ OpenWire Arbitrary Class Instantiation RCE

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://osv.dev/vulnerability/CVE-2023-46604
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt

cwes:
- CWE-502
- CWE-470
- CWE-913

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's OpenWire
  protocol marshaller. The createThrowable method in BaseDataStreamMarshaller accepts
  an arbitrary class name from untrusted network data and instantiates it using
  reflection without validating that the class is actually a subclass of Throwable.
  This allows a remote attacker with network access to instantiate any class on the
  classpath with a String constructor, leading to arbitrary code execution. The
  vulnerability has been actively exploited in the wild to deploy ransomware and
  cryptominers. CVSS Score: 9.8/10.0 (CRITICAL).

locations:
