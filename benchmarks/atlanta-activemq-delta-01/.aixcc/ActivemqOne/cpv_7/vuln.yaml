id: cpv_7

name: Apache ActiveMQ OpenWire Unsafe Class Instantiation RCE

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  Remote Code Execution vulnerability in Apache ActiveMQ's OpenWire protocol 
  implementation. The createThrowable method in BaseDataStreamMarshaller accepts 
  a className parameter from untrusted wire protocol data during deserialization 
  of exception responses and uses it to dynamically load and instantiate a class 
  via reflection without validating that the class is actually a Throwable. 
  
  An attacker can send a malicious OpenWire ExceptionResponse message with an 
  arbitrary className string. During unmarshalling, the vulnerable createThrowable 
  method uses Class.forName() to load the attacker-controlled class and invokes 
  its constructor via newInstance() with attacker-controlled parameters. If a 
  malicious class with a suitable String constructor exists on the classpath 
  (e.g., gadget classes), arbitrary code execution occurs.
  
  The vulnerability affects all OpenWire protocol versions (v1-v12) in both 
  activemq-client and activemq-openwire-legacy modules. It was introduced in 
  commit 9e13431 when implementing adaptive throwable creation (AMQ-9438).

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v8/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 232
  endLine: 232
  startColumn: 0
  endColumn: 0