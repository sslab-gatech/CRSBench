id: cpv_4

name: Apache ActiveMQ OpenWire Arbitrary Class Instantiation Leading to Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical Remote Code Execution vulnerability exists in Apache ActiveMQ's
  Java OpenWire protocol marshaller. The createThrowable() method in
  BaseDataStreamMarshaller accepts an arbitrary class name from untrusted
  network data without validating that the class is actually a Throwable
  subclass. This allows an attacker to instantiate any class on the classpath
  that has a constructor accepting a single String parameter. An attacker can
  send a crafted OpenWire packet containing a malicious class name (commonly
  org.springframework.context.support.ClassPathXmlApplicationContext with a
  URL to a remote XML configuration file) to achieve complete system compromise
  via Remote Code Execution. No authentication is required.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v5/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 1
  endLine: 239
  endColumn: 5
- type: root_cause
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v5/BaseDataStreamMarshaller.java
