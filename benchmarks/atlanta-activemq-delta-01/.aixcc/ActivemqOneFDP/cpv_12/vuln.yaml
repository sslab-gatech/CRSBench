id: cpv_0

name: ActiveMQ OpenWire Protocol Remote Code Execution via Unsafe Reflection

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-78

description: |
  A critical Remote Code Execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The BaseDataStreamMarshaller.createThrowable()
  method accepts attacker-controlled class names from OpenWire protocol messages
  without validation. The method uses Class.forName() to load arbitrary classes
  from the classpath and instantiates them with attacker-controlled message
  strings, assuming the class extends Throwable. An unauthenticated remote
  attacker with network access can send a specially crafted OpenWire
  ExceptionResponse message containing a malicious class name (such as
  ClassPathXmlApplicationContext) to achieve arbitrary code execution.

