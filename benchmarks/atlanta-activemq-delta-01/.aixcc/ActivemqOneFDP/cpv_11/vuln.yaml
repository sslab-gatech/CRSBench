id: cpv_11

name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  This is a critical unsafe deserialization vulnerability in Apache ActiveMQ's OpenWire 
  protocol marshallers that allows remote code execution. The vulnerability exists in the 
  createThrowable() method of BaseDataStreamMarshaller classes across all OpenWire protocol 
  versions (v1-v12).
  
  The root cause is that the code uses reflection to instantiate arbitrary classes based on 
  untrusted data from the wire protocol without validating that the loaded class actually 
  extends Throwable. An attacker can craft a malicious OpenWire message containing an 
  ExceptionResponse with an arbitrary class name. During deserialization, the code uses 
  Class.forName() to load the attacker-specified class and instantiates it via reflection 
  without any validation.
  
  This allows an unauthenticated attacker to instantiate arbitrary classes on the classpath 
  that have a single-String constructor, leading to potential remote code execution depending 
  on available gadget chains. The vulnerability was triggered by instantiating the jaz.Zer 
  class (a Jazzer security probe) which is not a Throwable, demonstrating that arbitrary 
  non-exception classes can be instantiated through this deserialization pathway.

