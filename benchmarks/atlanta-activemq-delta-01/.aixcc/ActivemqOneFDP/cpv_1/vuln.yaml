id: cpv_1

name: Apache ActiveMQ OpenWire Protocol Unsafe Exception Deserialization RCE

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  Remote Code Execution vulnerability in Apache ActiveMQ's OpenWire protocol implementation.
  The vulnerability exists in the deserialization logic for exception objects within OpenWire
  protocol messages. When processing an ExceptionResponse message, the createThrowable() method
  in BaseDataStreamMarshaller reads an exception class name from untrusted input and uses
  reflection to instantiate it without validating that the class is actually a Throwable subclass.
  This allows an attacker to instantiate arbitrary classes available on the classpath that have
  a String constructor, enabling gadget chain attacks and remote code execution. The vulnerability
  affects multiple versions of the OpenWire protocol implementation (v1-v12) across both
  activemq-client and activemq-openwire-legacy modules.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v2/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 0
  endLine: 233
  endColumn: 0