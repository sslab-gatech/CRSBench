id: cpv_1

name: Arbitrary Class Instantiation in OpenWire Protocol Deserialization

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/security-advisories.data/CVE-2023-46604-announcement.txt

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's OpenWire 
  protocol marshaller. The createThrowable method in BaseDataStreamMarshaller.java 
  accepts an externally-controlled class name and instantiates it without validating 
  that the class is actually a Throwable type before instantiation. The validation 
  (type cast) occurs only after the class has been instantiated via reflection, which 
  is too late to prevent malicious code execution. An attacker with network access to 
  an ActiveMQ broker or client can exploit this by sending a crafted ExceptionResponse 
  message that causes arbitrary class instantiation, leading to complete remote code 
  execution on the target system.

