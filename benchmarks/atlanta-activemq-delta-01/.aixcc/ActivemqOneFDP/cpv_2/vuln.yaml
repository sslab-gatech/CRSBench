id: cpv_2

name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  Critical remote code execution vulnerability in Apache ActiveMQ's OpenWire protocol 
  deserialization implementation (versions 2-8). The createThrowable method in 
  BaseDataStreamMarshaller uses Class.forName() with user-controlled class names from 
  network data without validation. When deserializing ExceptionResponse messages, an 
  attacker can specify an arbitrary class name that will be loaded and instantiated 
  using reflection. This allows instantiation of any class on the classpath with a 
  String constructor, enabling remote code execution through gadget chains, unauthorized 
  object creation, and security manager bypass. The vulnerability was introduced in 
  commit a1766fca as part of AMQ-9438 to support adaptive throwable creation.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v3/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 0
  endLine: 235
  endColumn: 0