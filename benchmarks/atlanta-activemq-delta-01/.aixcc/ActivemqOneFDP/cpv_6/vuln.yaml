id: cpv_6

name: Apache ActiveMQ OpenWire Arbitrary Class Instantiation via Exception Deserialization

cwes:
- CWE-470
- CWE-502
- CWE-094

description: |
  An arbitrary class instantiation vulnerability exists in the Apache ActiveMQ OpenWire 
  protocol deserialization logic. The createThrowable() method in BaseDataStreamMarshaller 
  accepts a user-controlled class name from network input without proper validation. It uses 
  Java reflection to load and instantiate an arbitrary class using Class.forName() and 
  constructor.newInstance(). When processing an OpenWire ExceptionResponse message, an attacker 
  can specify any class name instead of a legitimate exception class. This allows instantiation 
  of arbitrary classes available on the classpath, potentially triggering gadget chains that 
  lead to remote code execution. The vulnerability affects the deserialization flow where 
  ExceptionResponseMarshaller.looseUnmarshal() calls looseUnmarsalThrowable() which extracts 
  the className from untrusted network data and passes it to createThrowable(). The code 
  attempts to instantiate any class with a String constructor, not just Throwable classes, 
  enabling attackers to exploit Java deserialization gadgets for code execution, unauthorized 
  file access, or JVM compromise.

locations:
- path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v7/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 228
  startColumn: 0
  endLine: 232
  endColumn: 0