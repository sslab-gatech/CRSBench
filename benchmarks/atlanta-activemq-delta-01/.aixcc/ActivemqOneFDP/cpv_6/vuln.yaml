id: cpv_6

name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-20

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol implementation. The BaseDataStreamMarshaller.createThrowable()
  method accepts an arbitrary class name from the network and uses Java reflection
  to instantiate it without validating that the class is actually assignable to
  Throwable. This allows an attacker to instantiate any class on the classpath
  that has a string constructor, enabling remote code execution. Attackers typically
  exploit this by sending malicious OpenWire protocol messages that specify dangerous
  classes like org.springframework.context.support.ClassPathXmlApplicationContext,
  which loads and executes arbitrary Spring XML configuration files from a remote
  URL. No authentication is required, and the vulnerability has been widely exploited
  in the wild.

locations:
- type: root_cause
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v7/BaseDataStreamMarshaller.java
  function_name: createThrowable
