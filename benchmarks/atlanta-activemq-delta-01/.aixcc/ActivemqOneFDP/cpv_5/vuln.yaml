id: cpv_5

name: "Apache ActiveMQ OpenWire Protocol Unsafe Deserialization (CVE-2023-46604)"

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604
- https://www.cve.org/CVERecord?id=CVE-2023-46604

cwes:
- CWE-502
- CWE-470

description: |
  A critical unsafe deserialization vulnerability exists in the Apache ActiveMQ
  OpenWire protocol implementation. The createThrowable() method in
  BaseDataStreamMarshaller accepts an arbitrary class name from untrusted
  network input and instantiates it without validation using reflection.
  An attacker can provide any class name available on the classpath with a
  String constructor, leading to remote code execution. The vulnerability
  allows unauthenticated attackers with network access to the OpenWire port
  to execute arbitrary commands by sending a crafted ExceptionResponse message.

locations:
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v6/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 233
  startColumn: 1
  endLine: 233
  endColumn: 80
- type: root_cause
