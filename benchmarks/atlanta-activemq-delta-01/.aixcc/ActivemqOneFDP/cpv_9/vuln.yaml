id: cpv_9

name: Apache ActiveMQ OpenWire Arbitrary Class Instantiation via Exception Deserialization

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's OpenWire protocol 
  implementation across multiple versions (v1, v9-v12). The vulnerability is in the createThrowable 
  method of BaseDataStreamMarshaller, which accepts a className parameter from untrusted network 
  input during deserialization of ExceptionResponse objects. The code uses Java reflection to 
  load and instantiate an arbitrary class without validating that it is actually a Throwable 
  subclass. An attacker can send a maliciously crafted OpenWire message containing an arbitrary 
  className, causing the application to instantiate any class on the classpath that has a String 
  constructor. This can lead to remote code execution, information disclosure, or denial of service 
  depending on the chosen class and its constructor side effects. The attack flow is: 
  OpenWireFormat.unmarshal() -> doUnmarshal() -> ExceptionResponseMarshaller.looseUnmarshal() -> 
  looseUnmarsalThrowable() -> createThrowable(className, message), where Class.forName() and 
  constructor.newInstance() are called without validation.

