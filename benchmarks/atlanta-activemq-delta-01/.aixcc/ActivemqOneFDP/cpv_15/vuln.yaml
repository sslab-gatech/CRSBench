id: cpv_15
name: Apache ActiveMQ OpenWire Remote Code Execution via Unsafe Deserialization

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://github.com/advisories/GHSA-crg9-44h2-xw35
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's
  OpenWire protocol marshaller. The createThrowable method in
  BaseDataStreamMarshaller accepts externally-controlled class names and uses
  reflection to instantiate any class available on the classpath without
  validating that it extends Throwable. An attacker with network access can
  send a malicious OpenWire packet to instantiate arbitrary classes with
  attacker-controlled constructor arguments, achieving remote code execution.
  This vulnerability has been actively exploited to deploy ransomware and
  cryptominers.

locations:
- type: root_cause
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v4/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 1
  endLine: 239
  endColumn: 999
- type: crash_site
  path_from_root: activemq-openwire-legacy/src/main/java/org/apache/activemq/openwire/v4/BaseDataStreamMarshaller.java
  function_name: looseUnmarsalThrowable
  startLine: 512
  startColumn: 1
  endLine: 545
  endColumn: 999