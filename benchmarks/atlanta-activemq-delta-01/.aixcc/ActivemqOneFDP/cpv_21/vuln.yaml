id: cpv_21
name: Apache ActiveMQ OpenWire Protocol Unsafe Deserialization Remote Code Execution

origin: 1-day

release_date: 10/27/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-46604
- https://activemq.apache.org/news/cve-2023-46604

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  A critical remote code execution vulnerability exists in Apache ActiveMQ's 
  OpenWire protocol implementation. The BaseDataStreamMarshaller.createThrowable() 
  method accepts attacker-controlled class names during deserialization of 
  ExceptionResponse messages and uses Class.forName() to dynamically load and 
  instantiate arbitrary classes without validation. An attacker can send a crafted 
  OpenWire protocol message containing a malicious class name and constructor 
  argument, leading to arbitrary code execution. This vulnerability requires no 
  authentication and can be exploited remotely over the network.

locations:
- type: root_cause
  path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v10/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 229
  startColumn: 1
  endLine: 233
  endColumn: 80