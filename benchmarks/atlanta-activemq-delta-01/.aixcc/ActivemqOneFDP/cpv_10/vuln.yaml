id: cpv_10

name: Apache ActiveMQ OpenWire Unsafe Deserialization Remote Code Execution

cwes:
- CWE-502
- CWE-470
- CWE-94

description: |
  Critical remote code execution vulnerability in Apache ActiveMQ's OpenWire protocol 
  deserialization mechanism. The BaseDataStreamMarshaller.createThrowable() method 
  accepts an arbitrary class name from externally controlled data in the OpenWire 
  protocol stream and uses Java reflection to instantiate it without validation.
  
  The vulnerable code calls Class.forName() with an attacker-controlled class name 
  extracted from ExceptionResponse messages, then obtains a constructor and calls 
  newInstance() to create an object of that class. No validation is performed to 
  verify the loaded class extends Throwable or is safe to instantiate.
  
  An attacker can craft a malicious OpenWire message containing an ExceptionResponse 
  with a specially crafted class name. When unmarshalled, this triggers instantiation 
  of arbitrary classes on the classpath that have a String-parameter constructor, 
  potentially leading to complete system compromise, data breach, and lateral movement.

locations:
- path_from_root: activemq-client/src/main/java/org/apache/activemq/openwire/v11/BaseDataStreamMarshaller.java
  function_name: createThrowable
  startLine: 228
  startColumn: 0
  endLine: 232
  endColumn: 0