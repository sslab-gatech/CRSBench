patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
full_mode:
  base_commit: 7cbdfb672e21305ac1a004ce281a7311ddfca026
harness_files:
- name: HtmlFuzzer
  path: $PROJECT/HtmlFuzzer.java
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: java.lang.IndexOutOfBoundsException'
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueLow: Stack overflow'
  - vuln_keyword: cpv_4
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueLow: Stack overflow'
- name: XmlFuzzer
  path: $PROJECT/XmlFuzzer.java
