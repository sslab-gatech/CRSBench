id: cpv_2

name: jsoup Template Parsing Stack Overflow via Uncontrolled Recursion

origin: 1-day

release_date: 08/18/2021

references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-37714
- https://github.com/jhy/jsoup/security/advisories/GHSA-m72m-mhq2-9p6c

cwes:
- CWE-674
- CWE-400
- CWE-835

description: |
  A stack overflow vulnerability exists in jsoup's HTML template parsing logic.
  When processing EOF (end-of-file) tokens in the InTemplate state, the parser
  attempts to clean up the template mode stack and recursively processes the token
  again. The original code only checked if the state changed away from InTemplate,
  without verifying the template stack depth. With specially crafted HTML input
  containing deeply nested <template> tags, the parser enters an infinite recursion
  loop, causing a stack overflow exception and denial of service. The vulnerability
  was fixed by adding a recursion depth limit check (templateModeSize() < 12).

