id: cpv_2

name: Uncontrolled Recursion in HTML Template Parser Leading to Stack Overflow

cwes:
- CWE-674
- CWE-400

description: |
  An uncontrolled recursion vulnerability exists in jsoup's HTML parser when handling
  deeply nested template elements with EOF tokens. The vulnerability occurs due to a
  circular recursion between the InTemplate and InBody parser states. When an EOF token
  is encountered in the InTemplate state, it pops a template from the stack, calls
  resetInsertionMode(), and recursively processes the token if the state changes. The
  InBody state, upon receiving an EOF with remaining templates, recursively calls back
  to InTemplate. This creates an infinite recursion loop (InTemplate → InBody → InTemplate)
  that continues until the Java call stack is exhausted, resulting in a StackOverflowError.
  The vulnerability can be triggered by malformed HTML with deeply nested template structures,
  leading to a denial of service condition.

locations:
