id: cpv_4

name: Regular Expression Denial of Service in jsoup URL Resolution

origin: 1-day

release_date: 08/18/2021

references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-37714
- https://github.com/jhy/jsoup/security/advisories/GHSA-m72m-mhq2-9p6c

cwes:
- CWE-1333
- CWE-835
- CWE-400

description: |
  A Regular Expression Denial of Service (ReDoS) vulnerability exists in the
  extraDotSegmentsPattern regex used by the StringUtil.resolve() method in
  jsoup. The vulnerable pattern ^/((\\.{1,2}/)+) contains nested quantifiers
  with a capturing group that causes catastrophic backtracking when processing
  malicious URL paths with long sequences of /../ segments. An attacker can
  craft HTML input with a base tag containing such paths to cause stack overflow
  and denial of service through resource exhaustion.

locations:
- type: root_cause
  path_from_root: src/main/java/org/jsoup/internal/StringUtil.java
  function_name: resolve
  startLine: 284
  startColumn: 47
  endLine: 284
  endColumn: 80