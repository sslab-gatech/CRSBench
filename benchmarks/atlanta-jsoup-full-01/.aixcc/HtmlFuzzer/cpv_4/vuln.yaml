id: cpv_4

name: ReDoS in URL Path Normalization via Nested Quantifiers

cwes:
- CWE-1333
- CWE-400
- CWE-674

description: |
  A Regular Expression Denial of Service (ReDoS) vulnerability exists in the jsoup HTML parser
  library's StringUtil.resolve() method. The vulnerability is caused by a poorly designed regular
  expression pattern "^/((\\.{1,2}/)+)" used to normalize URL paths. This pattern contains nested
  quantifiers that lead to catastrophic backtracking when processing malicious input.
  
  When an attacker provides HTML containing a base tag with a URL having hundreds of path traversal
  segments (e.g., "/../../../..."), the regex engine enters exponential backtracking, consuming
  excessive CPU and stack space. This ultimately causes a StackOverflowError, leading to application
  crash and denial of service.
  
  The vulnerability is triggered during HTML parsing when jsoup resolves absolute URLs via the
  Node.absUrl() method, which calls StringUtil.resolve(). The attack requires only crafted HTML
  input with no authentication, making it easily exploitable in applications that parse untrusted
  HTML from external sources.

locations:
- path_from_root: src/main/java/org/jsoup/internal/StringUtil.java
  function_name: resolve
  startLine: 284
  startColumn: 0
  endLine: 284
  endColumn: 0