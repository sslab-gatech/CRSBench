id: cpv_1

name: IndexOutOfBoundsException in HTML fragment parsing

origin: 1-day

release_date: 08/15/2021

references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-37714
- https://github.com/advisories/GHSA-m72m-mhq2-9p6c
- https://github.com/jhy/jsoup/issues/1602

cwes:
- CWE-129
- CWE-248
- CWE-835

description: |
  An IndexOutOfBoundsException vulnerability exists in jsoup's HTML fragment parsing
  when handling deeply nested HTML elements. The bug occurs in the resetInsertionMode()
  method in HtmlTreeBuilder.java where the code incorrectly checks `if (pos == 0)`
  instead of `if (pos == upper)`. This causes the `last` flag to never be set when
  the stack search is limited by maxQueueDepth, leading to incorrect assumptions about
  stack depth in downstream code. When processing certain HTML fragments, the parser
  attempts to access stack elements that don't exist, resulting in an
  IndexOutOfBoundsException. This can lead to denial of service through parser crashes.

