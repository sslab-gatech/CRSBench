id: cpv_1

name: jsoup HTML Parser IndexOutOfBoundsException in Body Tag Processing

cwes:
- CWE-125
- CWE-823
- CWE-129

description: |
  An array index out of bounds vulnerability exists in the jsoup HTML parser library
  within the HtmlTreeBuilderState$7.inBodyStartTag() method. The vulnerability occurs
  when processing a <body> start tag during HTML parsing. The code performs a
  conditional check on the element stack size but has a logic gap that doesn't cover
  the case where stack.size() == 0. When the condition evaluates to false with an
  empty or insufficiently-sized stack, execution proceeds to access stack.get(1) on
  an ArrayList with fewer than 2 elements, causing an IndexOutOfBoundsException.
  
  The root cause is exacerbated by incorrect handling of the stack depth limit in
  the resetInsertionMode() method, which uses pos == 0 instead of pos == upper to
  determine the last position. When parsing deeply nested HTML (>256 elements), this
  causes the parser to enter invalid states where the stack becomes empty or has
  insufficient elements.
  
  This vulnerability can be exploited by attackers to cause denial of service by
  providing specially crafted HTML with deeply nested elements and malformed tag
  structures, causing application crashes in services that parse untrusted HTML content.

locations:
- path_from_root: src/main/java/org/jsoup/parser/HtmlTreeBuilderState.java
  function_name: inBodyStartTag
  startLine: 387
  startColumn: 0
  endLine: 387
  endColumn: 0