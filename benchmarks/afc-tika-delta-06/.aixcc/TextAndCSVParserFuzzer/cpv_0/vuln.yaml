id: cpv_0

name: Brute Fractions

author: Tim Allison

validator: Ze Sheng

difficulty_level:

origin: 1-day

release_date: 06/10/2013

reference: https://issues.apache.org/jira/browse/TIKA-1132

cwes:
- CWE-834
- CWE-407

description: >
  Implementation of an inefficient float to fraction calculator with no bounds
  checks can lead to excessively long computation. The format method in
  CellFormatter uses a brute-force nested loop to find the best fraction
  approximation, which has O(n^2) complexity and no iteration limits, causing
  excessive CPU consumption on crafted CSV input.

