id: cpv_0

name: Heap buffer underflow via negative array index in heap_bof

cwes:
- CWE-787
- CWE-122
- CWE-839

description: |
  A heap buffer overflow vulnerability exists in the heap_bof function due to
  insufficient bounds checking on array indices. The function only validates the
  upper bound (index < 100) but fails to check for negative values. When a
  negative index is provided through user-controlled input, it passes the
  validation check and causes an out-of-bounds write before the start of the
  allocated heap buffer. This can corrupt heap metadata and potentially lead to
  arbitrary code execution or denial of service. The vulnerability is triggered
  when the FuzzInput structure contains 'A' in the first byte and a negative
  integer (e.g., -1) as the index value.

locations:
- path_from_root: mock_vp.c
  function_name: heap_bof
  startLine: 13
  startColumn: 23
  endLine: 13
  endColumn: 23