id: cpv_0

name: OS Command Injection in executeCommand Method

cwes:
- CWE-78
- CWE-77

description: |
  A critical OS Command Injection vulnerability exists in the executeCommand method
  of the App class. The method accepts untrusted user input and passes it directly
  to ProcessBuilder.command() without any validation or sanitization. Despite a
  comment claiming "Only 'ls', 'pwd', and 'echo' commands are allowed," the code
  performs no actual validation to enforce this restriction. This allows an attacker
  to execute arbitrary system commands, leading to remote code execution, full system
  compromise, data exfiltration, and potential lateral movement. The vulnerability
  is triggered when attacker-controlled input from the fuzzer is passed to the
  executeCommand method, which then executes the malicious command through
  ProcessBuilder.start().

locations:
- path_from_root: src/main/java/com/aixcc/mock_java/App.java
  function_name: executeCommand
  startLine: 17
  startColumn: 0
  endLine: 17
  endColumn: 0