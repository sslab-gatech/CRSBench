patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: f9e454b129838a69dedbac29ecfd9cdb6422a533
  ref_commit: c239bcf7eaa854d7672b0e850aacc6bc975050a9

full_mode:
  base_commit: c239bcf7eaa854d7672b0e850aacc6bc975050a9

harness_files:
