patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: b3465418471ffa4cf0bbe1e8f28c4d007f060f99
  ref_commit: 85b22fc186031ee100773e06b545a94b3869d4c6

full_mode:
  base_commit: 85b22fc186031ee100773e06b545a94b3869d4c6

harness_files:
- name: ssh2_client_fuzzer
  path: $REPO/tests/ossfuzz/ssh2_client_fuzzer.cc
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: attempting double-free'
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
