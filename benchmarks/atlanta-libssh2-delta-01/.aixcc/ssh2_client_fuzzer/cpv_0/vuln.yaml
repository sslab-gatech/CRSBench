id: cpv_0

name: Double-free in Diffie-Hellman hostkey handling during SSH key exchange

author:

validator: Yu-Fu Fu

origin: 1-day

release_date: 09/10/2024

references:
- https://github.com/libssh2/libssh2/pull/1452

cwes:
- CWE-415 # Double Free
- CWE-672 # Operation on a Resource after Expiration or Release

description: |
  A double-free vulnerability exists in the diffie_hellman_sha_algo function
  in src/kex.c. The function frees session->server_hostkey but fails to set
  the pointer to NULL and reset the length field. When the key exchange function
  is called multiple times during SSH session negotiation, the same memory
  address gets freed again, causing a double-free condition. This can lead to
  heap metadata corruption and potentially arbitrary code execution by remote
  unauthenticated attackers during SSH handshake.

locations:
- type: crash_site
  path_from_root: src/kex.c
  function_name: diffie_hellman_sha_algo
  startLine: 473
  startColumn: 13
  endLine: 473
  endColumn: 59
- type: root_cause # the same as crash_site
  path_from_root: src/kex.c
  function_name: diffie_hellman_sha_algo
  startLine: 472
  endLine: 473
