id: cpv_1

name: Heap buffer overflow in packet_authagent_open due to insufficient bounds checking

author:

validator: Yu-Fu Fu

origin: 1-day # https://github.com/libssh2/libssh2/pull/1179

release_date: 08/28/2023

cwes:
- CWE-122 # Heap-based Buffer Overflow
- CWE-125 # Out-of-bounds Read
- CWE-805 # Buffer Access with Incorrect Length Value

description: |
  A heap-buffer-overflow vulnerability exists in the packet_authagent_open()
  function in src/packet.c when processing SSH2 authentication agent channel
  open requests. The function explicitly ignores the datalen parameter and
  performs no bounds checking before accessing the buffer. It calculates an
  offset of 27 bytes and attempts to read 12 additional bytes (three 32-bit
  integers), requiring a minimum buffer size of 39 bytes. When a malformed
  SSH2 packet with insufficient data is received, the function attempts to
  read beyond the allocated buffer boundaries via _libssh2_ntohu32(), causing
  a heap-buffer-overflow. This can lead to information disclosure, denial of
  service, or potential code execution when an attacker controls the SSH2 server.

locations:
- type: crash_site
  path_from_root: src/misc.c
  function_name: _libssh2_ntohu32
  startLine: 228
  startColumn: 23
  endLine: 228
  endColumn: 23
- type: root_cause
  path_from_root: src/packet.c
  function_name: packet_authagent_open
  startLine: 472
  startColumn: 1
  endLine: 480
  endColumn: 81
