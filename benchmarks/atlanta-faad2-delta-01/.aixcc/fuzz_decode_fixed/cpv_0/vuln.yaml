id: cpv_0

name: Incorrect TNS Coefficient Table Selection Leading to Integer Overflow

origin: synthetic

release_date: 02/01/2026

references:
- https://github.com/knik0/faad2/pull/185

cwes:
- CWE-682
- CWE-190
- CWE-1325

description: |
  A vulnerability exists in the tns_decode_coef function in libfaad/tns.c due to
  incorrect boolean logic when calculating the TNS coefficient table index. The
  function uses equality checks (==) instead of inequality checks (!=) when
  computing table_index from coef_compress and coef_res_bits parameters. This
  causes the wrong TNS coefficient table to be selected from the all_tns_coefs
  array. The incorrect coefficients propagate through the TNS decoding process
  and eventually reach the SBR synthesis stage. In fixed-point arithmetic mode
  (where real_t is int32_t), these corrupted values cause a signed integer
  overflow in the DST4_32 function during spectral band replication, resulting
  in undefined behavior. This can lead to incorrect audio output, crashes, or
  potential security issues in AAC audio decoding with TNS enabled.

locations:
- type: root_cause
  path_from_root: libfaad/tns.c
  function_name: tns_decode_coef
  startLine: 199
  startColumn: 5
  endLine: 199
  endColumn: 70
- type: crash_site
  path_from_root: libfaad/sbr_dct.c
  function_name: DST4_32
