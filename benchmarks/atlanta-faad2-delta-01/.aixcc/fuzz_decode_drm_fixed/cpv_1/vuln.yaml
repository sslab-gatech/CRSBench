id: cpv_1

name: Integer Overflow in Fixed-Point Power-of-Two Calculation

cwes:
- CWE-190
- CWE-681
- CWE-704

description: |
  This vulnerability occurs in the pow2_fix function in libfaad/common.c when processing
  fixed-point arithmetic in the FAAD2 AAC decoder with DRM support. The function computes
  2^val using fixed-point arithmetic and extracts the integer part by right-shifting by
  REAL_BITS (14 bits). When the whole number part is greater than or equal to 17, the
  subsequent left shift operation (retval = 1 << whole) causes undefined behavior on
  32-bit integers. For 32-bit signed integers, shifting left by 17 or more positions can
  result in overflow beyond the sign bit or undefined behavior per the C standard.
  
  The vulnerability is triggered through the AAC/DRM audio decoding path when malformed
  AAC audio data with DRM encoding is processed. The SBR (Spectral Band Replication)
  decoder's hf_adjustment function computes gain values (G_lim, G_boost) that are passed
  to pow2_fix without proper bounds checking. An attacker can craft audio data that
  produces gain values resulting in whole >= 17, causing an illegal instruction and
  immediate program termination (denial of service). In builds without the fuzzing trap
  instruction, the underlying integer overflow could potentially be exploited to cause
  memory corruption.

locations:
- path_from_root: libfaad/common.c
  function_name: pow2_fix
