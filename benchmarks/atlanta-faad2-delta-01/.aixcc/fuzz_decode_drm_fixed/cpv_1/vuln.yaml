id: cpv_1

name: Illegal Instruction in pow2_fix Due to Excessive Left Shift

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-1335
- CWE-190
- CWE-758

description: |
  A vulnerability exists in the pow2_fix function in libfaad/common.c when
  processing AAC audio data with specific parameters. The issue involves
  undefined behavior in a left shift operation where the function calculates
  whole = (val >> REAL_BITS) to extract the integer portion of a fixed-point
  value. When whole >= 17 (or larger values approaching 31), the subsequent
  operation retval = 1 << whole causes undefined behavior because left-shifting
  a 32-bit integer by 31 or more bits is undefined in C. The original fuzzing
  build mode check used __builtin_trap() to immediately crash the program,
  which triggered an illegal instruction (SIGILL). This can lead to denial of
  service in audio decoding applications when processing malformed AAC audio
  files during SBR (Spectral Band Replication) processing.

