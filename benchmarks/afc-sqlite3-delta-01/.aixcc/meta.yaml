patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
delta_mode:
  base_commit: 6a3e7f57f00f0a2b6b89b0db7990e3df47175372
  ref_commit: b8d88696c41b189951c4de0edc6dffaa31182551
full_mode:
  base_commit: b8d88696c41b189951c4de0edc6dffaa31182551
harness_files:
- name: ossfuzz
  path: $REPO/test/ossfuzz.c
- name: customfuzz3
  path: $REPO/test/customfuzz3.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
