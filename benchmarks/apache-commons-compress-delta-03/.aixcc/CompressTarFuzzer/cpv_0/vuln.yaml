- CWE-770
- CWE-20

description: This reintroduces a variant of CVE-2023-42503. Java's BigDecimal is vulnerable to a DoS on very high precision
  numbers. This  modifies the regex that was put in place to defend against CVE-2023-42503 so that the BigDecimal DoS attack
  is available.

