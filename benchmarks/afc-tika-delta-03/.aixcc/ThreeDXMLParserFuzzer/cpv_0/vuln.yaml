description: >
  ThreeDXMLParser fails to secure the XMLParser and is vulnerable to XXE and
  other XML security vulnerabilities. The parseRoot method uses a default
  SAXParserFactory.newInstance() without disabling external entity resolution,
  allowing XXE attacks via crafted 3DXML files.

