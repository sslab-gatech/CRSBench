id: cpv_0

name: Snappy Java Stream DoS via Unvalidated Chunk Size Allocation

cwes:
- CWE-789
- CWE-770
- CWE-400

description: |
  A Denial of Service vulnerability exists in the Snappy compression library's SnappyInputStream class.
  The hasNextChunk() method reads a chunk size value from untrusted input without proper validation,
  allowing attackers to specify arbitrary memory allocation sizes. Specifically, the code fails to:
  (1) validate that the chunk size is non-negative, and (2) enforce the maximum chunk size limit.
  An attacker can craft a malicious Snappy stream with a chunk size of Integer.MAX_VALUE (0x7fffffff),
  causing the application to attempt allocating ~2GB of memory, which exceeds JVM array limits and
  triggers an OutOfMemoryError. This leads to application crash and resource exhaustion. The vulnerability
  was introduced by removing critical input validation checks that prevent excessive memory allocation.

locations:
- path_from_root: src/main/java/org/xerial/snappy/SnappyInputStream.java
  function_name: hasNextChunk
  startLine: 445
  startColumn: 0
  endLine: 445
  endColumn: 0