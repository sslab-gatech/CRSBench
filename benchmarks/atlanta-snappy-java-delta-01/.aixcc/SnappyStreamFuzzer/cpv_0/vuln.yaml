id: cpv_0

name: Unchecked Chunk Size Leading to Denial of Service

origin: 1-day

release_date: 06/15/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-34455
- https://github.com/advisories/GHSA-qcwq-55hx-v3vh
- https://osv.dev/vulnerability/GHSA-qcwq-55hx-v3vh

cwes:
- CWE-1284
- CWE-789
- CWE-400

description: |
  A Denial of Service vulnerability exists in the SnappyInputStream class where
  the hasNextChunk() method reads a 4-byte integer from the input stream to
  determine the size of the next chunk, but fails to validate this value before
  using it to allocate a byte array. An attacker can provide a negative value
  or an extremely large positive value (e.g., 0x7FFFFFFF = 2,147,483,647 bytes),
  causing either a NegativeArraySizeException or an OutOfMemoryError that crashes
  the JVM. This leads to application crash, resource exhaustion, and denial of
  service for legitimate users.

