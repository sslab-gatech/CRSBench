id: cpv_1

name: Integer Overflow in BitShuffle.sizeCheck() Leading to Buffer Allocation Mismatch

origin: 1-day

release_date: 06/15/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-34453
- https://github.com/advisories/GHSA-pqr6-cmr2-h8hf
- https://osv.dev/vulnerability/GHSA-pqr6-cmr2-h8hf
- https://github.com/xerial/snappy-java/security/advisories/GHSA-pqr6-cmr2-h8hf

cwes:
- CWE-190
- CWE-681

description: |
  An integer overflow vulnerability exists in the sizeCheck() function in
  src/main/java/org/xerial/snappy/BitShuffle.java. The function attempts to
  validate that array length multiplied by element type size doesn't exceed
  the maximum supported size (16-bit boundary, 0xFFFF = 65535 bytes), but
  uses an incorrect validation approach that fails to detect multiplication
  overflow. The vulnerable code masks both the length and the result of
  length * typeSize with 0xFFFF and compares them, which doesn't reliably
  detect overflow conditions. For example, with length = 21846 and typeSize = 4,
  the true size (87384) exceeds 0xFFFF, but the masked value (21848) appears
  valid, causing a buffer allocation mismatch. This leads to data corruption,
  IllegalStateException, and program crashes.

locations:
- type: root_cause
  path_from_root: src/main/java/org/xerial/snappy/BitShuffle.java
  function_name: sizeCheck
