id: cpv_2

name: Heap Buffer Overflow in BitShuffle _is_eight_byte_repetition

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-125
- CWE-787
- CWE-119

description: |
  A heap buffer overflow vulnerability exists in the _is_eight_byte_repetition
  function in third-party/bitshuffle/src/bitshuffle_core.c. The function iterates
  through a memory buffer in 8-byte chunks to detect repeating patterns, but fails
  to verify that the buffer length is evenly divisible by 8 before entering the loop.
  This causes the loop to read beyond the allocated buffer boundary when processing
  buffers whose size is not a multiple of 8. When len % 8 != 0, the final iteration
  reads (len % 8) bytes beyond the buffer, leading to memory safety violation,
  potential information disclosure, and program crash.

