patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: 137b7839432c34228f24decbbcdf9a1edc619033
  ref_commit: d1624f83463454674d71801c5d519886b4bbed6e

full_mode:
  base_commit: d1624f83463454674d71801c5d519886b4bbed6e

harness_files:
- name: BitShuffleFuzzer
  path: $PROJECT/BitShuffleFuzzer.java
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'IllegalStateException: Original and uncompressed data are different'
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: heap-buffer-overflow'

- name: SnappyStreamFuzzer
  path: $PROJECT/SnappyStreamFuzzer.java
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: Requested array size exceeds VM limit
