id: cpv_0

name: curl buffer reader missing rewind causes heap-buffer-overflow

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-787
- CWE-129

description: |
  A heap-based buffer overflow vulnerability exists in curl's content reader
  buffer implementation (cr_buf). The vulnerability occurs when the buffer
  reader needs to be rewound but lacks a proper rewind function. The cr_buf
  structure uses Curl_creader_def_rewind (a default no-op rewind function)
  instead of a proper implementation that resets ctx->index to 0. When the
  buffer is read multiple times without properly resetting the index,
  ctx->index can exceed ctx->blen, causing pointer arithmetic to go beyond
  allocated buffer bounds. This triggers a heap buffer overflow when memcpy
  attempts to read 45 bytes from invalid memory, potentially leading to
  memory corruption, denial of service, information disclosure, or arbitrary
  code execution.

locations:
- type: crash_site
  path_from_root: lib/sendf.c
  function_name: cr_buf_read
  startLine: 1298
  startColumn: 5
  endLine: 1298
  endColumn: 5
- type: root_cause
  path_from_root: lib/sendf.c
  function_name: cr_buf
