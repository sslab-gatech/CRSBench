patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: f6f34f6d5b6d67205c34de617a0b99fe11e3d323
  ref_commit: 1fac0ad3848bc4e9cb6afd6de004e6c448da20e9

full_mode:
  base_commit: 1fac0ad3848bc4e9cb6afd6de004e6c448da20e9

harness_files:
- name: DataTreeFuzzer
  path: $PROJECT/DataTreeFuzzer.java

- name: MessageTrackerPeekReceivedFuzzer
  path: $PROJECT/MessageTrackerPeekReceivedFuzzer.java
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: libFuzzer: timeout'

- name: MultiProcessTxnFuzzer
  path: $PROJECT/MultiProcessTxnFuzzer.java

- name: ProcessTxnFuzzer
  path: $PROJECT/ProcessTxnFuzzer.java

- name: SerializeFuzzer
  path: $PROJECT/SerializeFuzzer.java
