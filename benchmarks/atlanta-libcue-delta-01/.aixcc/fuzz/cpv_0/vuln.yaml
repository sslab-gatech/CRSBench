id: cpv_0

name: Out-of-bounds write in track_set_index due to missing negative index validation

cwes:
- CWE-787
- CWE-129
- CWE-120

description: |
  An out-of-bounds write vulnerability exists in the libcue library's CUE sheet parser.
  The vulnerability occurs in the track_set_index() function in cd.c at line 347.
  
  The function accepts an integer index parameter but only validates that it doesn't exceed
  MAXINDEX (99), failing to check if the index is negative. This allows an attacker to provide
  a malicious large or negative index value that bypasses the bounds check.
  
  When parsing a CUE file with an extremely large INDEX value (e.g., INDEX 4294567296),
  the array access track->index[i] writes to memory far outside the bounds of the allocated
  100-element array. This causes a segmentation fault due to writing to an invalid memory address.
  
  Impact includes memory corruption, potential arbitrary code execution if the attacker can
  control the write location, and denial of service through application crashes when processing
  untrusted CUE files.

locations:
- path_from_root: cd.c
  function_name: track_set_index
  startLine: 347
  startColumn: 18
  endLine: 347
  endColumn: 18