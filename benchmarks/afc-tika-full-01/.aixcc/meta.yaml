patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
full_mode:
  base_commit: 5c0a9798f3f457c6f068fce57af08fc4830ae563
harness_files:
- name: HtmlParserFuzzer
  path: $PROJECT/project-parent/fuzz-targets/src/main/java/com/example/HtmlParserFuzzer.java
- name: RTFParserFuzzer
  path: $PROJECT/project-parent/fuzz-targets/src/main/java/com/example/RTFParserFuzzer.java
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueHigh: Remote Code Execution'
