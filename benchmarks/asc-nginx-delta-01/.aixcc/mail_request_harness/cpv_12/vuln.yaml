id: cpv_12

name: NULL Pointer Dereference in POP3 Password Handler

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-476
- CWE-825

description: |
  A NULL pointer dereference vulnerability exists in the ngx_mail_pop3_pass
  function in src/mail/ngx_mail_pop3_handler.c. The function attempts to
  traverse a linked list of authentication logs using incorrect pointer
  arithmetic. Instead of traversing the linked list properly, the code
  increments a pointer-to-pointer variable, causing it to point to arbitrary
  memory locations. When the code attempts to dereference the invalid pointer
  at line 377, it reads from address 0x11 (in the zero page), causing a
  segmentation fault. This vulnerability can be triggered by sending a
  sequence of POP3 commands (USER followed by PASS), leading to a denial
  of service condition where the nginx worker process crashes.

locations:
- type: crash_site
  path_from_root: src/mail/ngx_mail_pop3_handler.c
  function_name: ngx_mail_pop3_pass
  startLine: 377
  startColumn: 42
  endLine: 377
  endColumn: 42
- type: root_cause
  path_from_root: src/mail/ngx_mail_pop3_handler.c
  function_name: ngx_mail_pop3_pass
  startLine: 373
  startColumn: 1
  endLine: 377
  endColumn: 24