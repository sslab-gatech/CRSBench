id: cpv_11

name: Heap buffer overflow in nginx POP3 USER handler

origin: synthetic

release_date: "01/01/2024"

references: []

cwes:
- CWE-122
- CWE-787

description: |
  A heap-based buffer overflow vulnerability exists in the ngx_mail_pop3_user
  function in src/mail/ngx_mail_pop3_handler.c. The function allocates a fixed-size
  buffer of 100 bytes to store the login username, but then copies user-controlled
  data of arbitrary length into this buffer. An attacker can trigger this vulnerability
  by sending a POP3 USER command with a username longer than 100 bytes, causing heap
  memory corruption that could lead to remote code execution or denial of service.

