id: cpv_13

name: nginx SMTP NOOP Handler Use-After-Free

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-416
- CWE-825

description: |
  A use-after-free vulnerability exists in nginx's SMTP mail handler when
  processing NOOP commands with more than 10 arguments. The ngx_mail_smtp_noop
  function calls ngx_mail_close_connection which destroys the connection's
  memory pool including the session object, but then returns NGX_ERROR to its
  caller. The caller ngx_mail_smtp_auth_state continues execution and attempts
  to access the freed session object's buffer members, resulting in a
  use-after-free condition. This can lead to information disclosure, denial
  of service, or potential remote code execution.

locations:
- type: crash_site
  path_from_root: src/mail/ngx_mail_smtp_handler.c
  function_name: ngx_mail_smtp_auth_state
  startLine: 556
  startColumn: 8
  endLine: 556
  endColumn: 38
- type: root_cause
  path_from_root: src/mail/ngx_mail_smtp_handler.c
  function_name: ngx_mail_smtp_noop
  startLine: 836
  startColumn: 9
  endLine: 836
  endColumn: 36