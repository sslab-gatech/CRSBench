id: cpv_13

name: nginx SMTP NOOP Handler Use-After-Free

origin: synthetic

validator: Younggi Park

release_date: 02/01/2026

references: ["https://github.com/aixcc-public/challenge-004-nginx-cp/tree/main/.internal_only/cpv17"]

cwes:
- CWE-416
- CWE-825

description: |
  A new SMTP response message for the NOOP command is added. The NOOP command handling is integrated into the ngx_mail_smtp_auth_state function. The ngx_mail_smtp_noop function is defined, which checks if the number of arguments exceeds 10. If so, it sets an invalid argument error and closes the connection. Otherwise, it responds with the smtp_noop message. The function appears to handle this correctly by first closing the connection and then destroying the pool. However, since NGX_ERROR gets returned, it is caught by another check that then calls ngx_mail_session_internal_server_error. This function attempts to access the freed connection structure, which leads to a crash via a UAF.


locations:
- type: crash_site
  path_from_root: src/mail/ngx_mail_smtp_handler.c
  function_name: ngx_mail_smtp_auth_state
  startLine: 556
  startColumn: 8
  endLine: 556
  endColumn: 38
- type: root_cause
  path_from_root: src/mail/ngx_mail_smtp_handler.c
  function_name: ngx_mail_smtp_noop
  startLine: 836
  startColumn: 9
  endLine: 836
