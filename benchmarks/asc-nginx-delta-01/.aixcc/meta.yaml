patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
delta_mode:
  base_commit: c498a935699a24720cc8857a48d0ce999e1aa6bb
  ref_commit: 077e305de7e7f7a960d0ad440e7ed66f3da5a5ce
full_mode:
  base_commit: 077e305de7e7f7a960d0ad440e7ed66f3da5a5ce
harness_files:
- name: pov_harness
  path: $PROJECT/fuzz/pov_harness.cc
  vulns:
