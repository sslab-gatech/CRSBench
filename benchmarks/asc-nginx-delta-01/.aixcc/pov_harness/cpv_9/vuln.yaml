id: cpv_9

name: nginx HTTP Rewrite Module Global Buffer Overflow via Missing Return Statement

cwes:
- CWE-125
- CWE-787
- CWE-788

description: |
  A global buffer overflow vulnerability in nginx's HTTP rewrite module that occurs when
  processing HTTP requests with URIs exceeding 2000 bytes during rewriting. The root cause
  is a missing return statement in the error handling path of ngx_http_script_regex_end_code()
  in src/http/ngx_http_script.c at line 1274. When the rewritten URI exceeds the maximum
  length, the error handler sets e->ip to point to ngx_http_script_exit (a sentinel value)
  but fails to return immediately. Execution continues, causing the script engine's instruction
  pointer to advance beyond intended bounds. On the next loop iteration in ngx_http_rewrite_handler(),
  the code dereferences e->ip, resulting in reading 8 bytes beyond the ngx_http_script_exit_code
  global variable. This vulnerability can lead to information disclosure by reading adjacent
  memory, potential denial of service, or possible control flow manipulation.

locations:
- path_from_root: src/http/modules/ngx_http_rewrite_module.c
  function_name: ngx_http_rewrite_handler
  startLine: 178
  startColumn: 12
  endLine: 178
  endColumn: 12