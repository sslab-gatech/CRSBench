id: cpv_9

name: Missing Return After Error in ngx_http_script_regex_end_code

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-125
- CWE-788
- CWE-670

description: |
  A missing return statement vulnerability in nginx's HTTP rewrite module leads to a
  global buffer overflow (out-of-bounds read). When processing regex-based URL rewrites,
  the ngx_http_script_regex_end_code() function checks if the rewritten URI exceeds
  2000 bytes. If it does, the code sets an error condition but fails to return
  immediately. Execution continues and increments the instruction pointer (e->ip) beyond
  valid script memory. When control returns to ngx_http_rewrite_handler(), the while
  loop attempts to dereference the invalid e->ip value, causing an 8-byte out-of-bounds
  read. This can lead to memory disclosure, denial of service, or potential information
  leaks from adjacent global variables.

locations:
- type: root_cause
  path_from_root: src/http/ngx_http_script.c
  function_name: ngx_http_script_regex_end_code
  startLine: 1270
  startColumn: 9
  endLine: 1275
  endColumn: 9
- type: crash_site
  path_from_root: src/http/modules/ngx_http_rewrite_module.c
  function_name: ngx_http_rewrite_handler
  startLine: 178
  startColumn: 12
  endLine: 178
  endColumn: 12