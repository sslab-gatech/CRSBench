id: cpv_5

name: NULL pointer dereference in connection history traversal

origin: synthetic

validator: Younggi Park

release_date: 02/01/2026

references: ["https://github.com/aixcc-public/challenge-004-nginx-cp/tree/main/.internal_only/cpv5"]

cwes:
- CWE-476
- CWE-823

description: |
  This vulnerability triggers a null-pointer-dereference within NGINX due to improper linked list traversal in ngx_get_con_his function. By sending the URL /lastConnection, the server will respond with a string of the last IP to have connected, however, if an attacker queries this URL for the second time, it will cause a wrongly written for-loop to read a linked-list out of bounds, dereferencing a null pointer. This bug requires that the system is able to generate two requests in a single blob as well as understand how to maintain state across two requests. Additionally, it needs to understand the logic of traversing a linked list using a for loop.

locations:
- type: crash_site
  path_from_root: src/http/ngx_http_variables.c
  function_name: ngx_http_get_last_ip_variable
  startLine: 2851
  startColumn: 5
  endLine: 2852
  endColumn: 36
- type: root_cause
  path_from_root: src/core/ngx_cycle.c
  function_name: ngx_get_con_his
  startLine: 66
  startColumn: 5
  endLine: 68
  endColumn: 26