id: cpv_5

name: NULL Pointer Dereference in HTTP Connection History Variable Handler

cwes:
- CWE-476
- CWE-252
- CWE-193

description: |
  A NULL pointer dereference vulnerability occurs in the nginx HTTP variables handler
  when processing connection history information. The ngx_http_get_last_ip_variable
  function calls ngx_get_con_his() to retrieve a connection history entry but fails
  to validate that the returned pointer is non-NULL before dereferencing it to access
  the addr_text fields. This happens when the request_counter value exceeds the length
  of the connection history linked list, causing ngx_get_con_his() to return NULL due
  to an off-by-one error in its loop logic (using <= instead of proper NULL checking).
  The vulnerability can be triggered via specially crafted HTTP requests that access
  variables calling this function, resulting in a segmentation fault and denial of
  service. The crash occurs at line 2851 when attempting to access last_ip->addr_text.data
  on a NULL pointer.

locations:
- path_from_root: src/http/ngx_http_variables.c
  function_name: ngx_http_get_last_ip_variable
  startLine: 2851
  startColumn: 0
  endLine: 2852
  endColumn: 0