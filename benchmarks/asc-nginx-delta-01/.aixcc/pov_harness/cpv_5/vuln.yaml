id: cpv_5

name: NULL pointer dereference in connection history traversal

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-476
- CWE-823

description: |
  A NULL pointer dereference vulnerability exists in the ngx_http_get_last_ip_variable
  function in src/http/ngx_http_variables.c. The vulnerability is caused by improper
  linked list traversal in ngx_get_con_his function, which can walk past the end of
  the connection history list and return NULL. The returned NULL pointer is then
  dereferenced without validation, causing a segmentation fault. An attacker can
  trigger this by crafting an HTTP request with a request_counter value that exceeds
  the length of the connection_history linked list, leading to a denial of service.

locations:
- type: crash_site
  path_from_root: src/http/ngx_http_variables.c
  function_name: ngx_http_get_last_ip_variable
  startLine: 2851
  startColumn: 5
  endLine: 2852
  endColumn: 36
- type: root_cause
  path_from_root: src/core/ngx_cycle.c
  function_name: ngx_get_con_his
  startLine: 66
  startColumn: 5
  endLine: 68
  endColumn: 26