id: cpv_10

name: NGINX userid filter module cookie length constraint bypass leading to out-of-bounds read

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-125
- CWE-787
- CWE-823

description: |
  A vulnerability exists in the NGINX userid filter module where the cookie
  length validation is insufficient. The ngx_http_userid_get_uid function
  checks if the cookie length is at least 22 bytes but does not constrain
  it to exactly 22 bytes. When a cookie longer than 22 bytes is provided,
  the ngx_http_userid_set_uid function attempts to copy exactly 22 bytes
  from ctx->cookie.data, resulting in a wild pointer dereference and
  out-of-bounds read. This leads to a segmentation fault and denial of
  service.

locations:
- type: crash_site
  path_from_root: src/http/modules/ngx_http_userid_filter_module.c
  function_name: ngx_http_userid_set_uid
  startLine: 446
  startColumn: 13
  endLine: 446
  endColumn: 13
- type: root_cause
  path_from_root: src/http/modules/ngx_http_userid_filter_module.c
  function_name: ngx_http_userid_get_uid
  startLine: 357
  startColumn: 1
  endLine: 357
  endColumn: 1