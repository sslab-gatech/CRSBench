id: cpv_10

name: Out-of-bounds read in nginx userid filter module cookie processing

cwes:
- CWE-125
- CWE-805
- CWE-787

description: |
  An out-of-bounds read vulnerability exists in the nginx HTTP userid filter module
  when processing user-supplied cookies. The vulnerability occurs in the
  ngx_http_userid_set_uid function at line 446 in
  src/http/modules/ngx_http_userid_filter_module.c.
  
  The root cause is a missing length validation that allows cookies longer than
  the expected 22-character base64 format to pass initial checks. While the code
  at line 350 validates that cookies are at least 22 bytes long, it does not
  enforce a maximum length. When a cookie with ctx->uid_got[3] != 0 is processed,
  the code attempts to copy exactly 22 bytes from ctx->cookie.data using ngx_cpymem,
  but the cookie data pointer may be invalid or point to memory that cannot be
  safely accessed, resulting in a wild address read.
  
  An attacker can exploit this by sending an HTTP request with a crafted Cookie
  header containing a userid value longer than expected (e.g., 64 base64 characters).
  This triggers a segmentation fault, crashing the nginx worker process and causing
  a denial of service. There is also potential for information disclosure through
  reading sensitive memory beyond the cookie buffer bounds.

locations:
- path_from_root: src/http/modules/ngx_http_userid_filter_module.c
  function_name: ngx_http_userid_set_uid
  startLine: 446
  startColumn: 13
  endLine: 446
  endColumn: 13