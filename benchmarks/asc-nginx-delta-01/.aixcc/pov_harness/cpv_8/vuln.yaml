id: cpv_8

name: Heap buffer overflow in ngx_sendfile_r due to fixed buffer size

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap-based buffer overflow vulnerability exists in the ngx_sendfile_r function
  in nginx's Linux sendfile implementation. The function allocates a fixed-size buffer
  of 100 bytes (NGX_SENDFILE_R_MAXSIZE) but writes a variable amount of data
  controlled by the 'size' parameter. When the size parameter exceeds 100 bytes,
  the write loop overflows the allocated heap buffer. This can be triggered via
  HTTP Range requests that cause nginx to process responses larger than 100 bytes.
  The vulnerability can lead to memory corruption, potential arbitrary code execution,
  denial of service, and corruption of adjacent heap data structures.

locations:
- path_from_root: src/os/unix/ngx_linux_sendfile_chain.c
  function_name: ngx_sendfile_r
  startLine: 73
  startColumn: 0
  endLine: 80
  endColumn: 0