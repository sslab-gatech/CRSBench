id: cpv_8

name: Heap buffer overflow in ngx_sendfile_r due to fixed-size allocation

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap buffer overflow vulnerability exists in the ngx_sendfile_r function
  in src/os/unix/ngx_linux_sendfile_chain.c. The function allocates a fixed
  100-byte buffer but writes data based on a variable 'size' parameter that
  can exceed this allocation. When processing HTTP Range requests with sizes
  greater than 100 bytes, the loop at line 80 writes beyond the allocated
  buffer, causing heap corruption. This can lead to memory corruption and
  potential arbitrary code execution.

locations:
- type: root_cause
  path_from_root: src/os/unix/ngx_linux_sendfile_chain.c
  function_name: ngx_sendfile_r
  startLine: 73
  startColumn: 11
  endLine: 73
  endColumn: 11
- type: crash_site
  path_from_root: src/os/unix/ngx_linux_sendfile_chain.c
  function_name: ngx_sendfile_r
  startLine: 80
  startColumn: 16
  endLine: 80
  endColumn: 16