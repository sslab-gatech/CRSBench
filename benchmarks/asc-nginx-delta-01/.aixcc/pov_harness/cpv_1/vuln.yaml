id: cpv_1

name: Heap Buffer Underflow in Email Address Validation

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-122
- CWE-125
- CWE-787

description: |
  A heap buffer underflow vulnerability exists in the synthetically added
  ngx_http_validate_from function, which validates email addresses in HTTP
  "From" headers. When processing consecutive dots in the username portion
  of an email address, the parser performs an unbounded backward pointer
  traversal without bounds checking. The code decrements the pointer by 2
  and enters a loop searching for a previous dot character, but if the input
  contains dots at the beginning or early in the string, the pointer underflows
  past the allocated buffer's start address. This causes an out-of-bounds read
  when checking the character at the underflowed address, potentially leading
  to information disclosure, denial of service, or further exploitation.

locations:
- type: crash_site
  path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_validate_from
  startLine: 4093
  startColumn: 25
  endLine: 4093
  endColumn: 25
- type: root_cause
  path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_validate_from
  startLine: 4091
