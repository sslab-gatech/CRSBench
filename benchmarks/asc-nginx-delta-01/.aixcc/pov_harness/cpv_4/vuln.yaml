id: cpv_4

name: Heap Buffer Overflow in nginx Browser Cookie Handler due to Insufficient Buffer Allocation

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap-based buffer overflow vulnerability exists in the ngx_http_set_browser_cookie
  function in src/http/ngx_http_core_module.c. The function allocates a fixed-size
  buffer that only accounts for timestamp and content length format strings, but fails
  to include space for the cookie value length when Safari browser is detected. When
  ngx_sprintf writes the cookie data into this undersized buffer, it causes a heap
  buffer overflow. This can lead to memory corruption, denial of service, and potential
  arbitrary code execution through heap metadata corruption.

locations:
- type: root_cause
  path_from_root: src/http/ngx_http_core_module.c
  function_name: ngx_http_set_browser_cookie
  startLine: 5281
  startColumn: 34
  endLine: 5281
  endColumn: 34
- type: crash_site
  path_from_root: src/core/ngx_string.c
  function_name: ngx_sprintf_str
  startLine: 581
  startColumn: 24
  endLine: 581
  endColumn: 24