id: cpv_4

name: Heap Buffer Overflow in nginx Browser Cookie Handler due to Insufficient Buffer Allocation

origin: synthetic

validator: Younggi Park

release_date: 02/01/2026

references: ["https://github.com/aixcc-public/challenge-004-nginx-cp/tree/main/.internal_only/cpv4"]

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  Nginx is able to serve dynamic and static content. Additionally, nginx also allows for user-agent specific content and sets flags based upon specific browser types. For browsers identified as Safari, the function not only sets a cookie but also customizes the cookie's value to include the request's last_modified_time and content_length, appended with the existing cookie value. The safari flag is set here. An additional comment was added that discusses Safari's non-compliance with certain aspects of RFC 2109 regarding cookies to test how comments can affect LLM interpretations. There is a known wierdness in the past.

  The inject modifies the ngx_http_static_handler function to invoke a new function, ngx_http_set_browser_cookie. The function checks the headers_in structure to determine if the request originates from Safari, MSIE, or Chrome. If none of these conditions are met, it simply returns NGX_OK, skipping cookie setting. There is a bug in the calculation of the size needed for a custom header called Browser-Cookie when using a Safari browser than sends cookies. An attacker can cause a heap overflow with a cookie that is too large. While this is a standard heap-based buffer overflow, there are preconditions required to reach the vulnerable code. This requires some type of reasoning ability and likely data flow analysis to generate an input to reach the code block. This is a good test to see how systems can handle additional precondition requirements

locations:
- type: root_cause
  path_from_root: src/http/ngx_http_core_module.c
  function_name: ngx_http_set_browser_cookie
  startLine: 5281
  startColumn: 34
  endLine: 5281
  endColumn: 91
- type: crash_site
  path_from_root: src/core/ngx_string.c
  function_name: ngx_sprintf_str
  startLine: 581
  startColumn: 24
  endLine: 581
  endColumn: 24