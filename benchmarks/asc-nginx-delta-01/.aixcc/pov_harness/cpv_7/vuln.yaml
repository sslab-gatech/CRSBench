id: cpv_7

name: nginx host_specs heap-use-after-free when remote_admin disabled

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-416
- CWE-825

description: |
  A heap-use-after-free vulnerability exists in nginx's custom host specifications
  feature. When the remote_admin configuration is disabled, the host_specs structure
  is freed during cycle initialization but the pointer is not set to NULL, creating
  a dangling pointer. Later, when an HTTP request accesses the $host_specs variable
  (e.g., via /host_specs endpoint), the ngx_http_get_host_specs() function
  unconditionally dereferences the freed memory without validation. This results in
  a heap-use-after-free condition that can cause denial of service through crashes,
  and potentially information disclosure by reading freed heap memory.

locations:
- type: crash_site
  path_from_root: src/http/ngx_http_variables.c
  function_name: ngx_http_get_host_specs
  startLine: 2870
  startColumn: 64
  endLine: 2872
  endColumn: 64
- type: root_cause
  path_from_root: src/core/ngx_cycle.c
  function_name: ngx_init_cycle
  startLine: 458
  startColumn: 9
  endLine: 460
  endColumn: 9