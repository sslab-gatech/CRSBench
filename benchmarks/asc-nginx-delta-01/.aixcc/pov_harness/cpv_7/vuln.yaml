id: cpv_7

name: nginx host_specs heap-use-after-free when remote_admin disabled

origin: synthetic

validator: Younggi Park

release_date: 02/01/2026

references: ["https://github.com/aixcc-public/challenge-004-nginx-cp/tree/main/.internal_only/cpv11"]


cwes:
- CWE-416
- CWE-825

description: |
  NGINX introduces a new feature for administrators and users. They can request hardware specifications of the host, such as CPU, RAM, and OS. The vulnerability occurs in ngx_cycle.c because it fails to check if the runtime configuration of NGINX has enabled this feature before memory allocation. It allocates memory regardless and then checks if the setting is turned on and frees the memory. However, the variables that point to the now freed memory are not cleared, which allows the ngx_http_get_host_specs() function
  unconditionally dereferences the freed memory without validation. This results in
  a heap-use-after-free condition that can cause denial of service through crashes,
  and potentially information disclosure by reading freed heap memory.



locations:
- type: crash_site
  path_from_root: src/http/ngx_http_variables.c
  function_name: ngx_http_get_host_specs
  startLine: 2870
  startColumn: 64
  endLine: 2872
  endColumn: 64
- type: root_cause
  path_from_root: src/core/ngx_cycle.c
  function_name: ngx_init_cycle
  startLine: 357
  startColumn: 9
  endLine: 461
  endColumn: 9
