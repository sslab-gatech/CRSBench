id: cpv_6

name: Double-Free in nginx HTTP Prefer Header Processing

cwes:
- CWE-415
- CWE-672

description: |
  A double-free vulnerability exists in the ngx_http_process_prefer() function
  when processing HTTP Prefer headers. When multiple Prefer headers are sent in
  a single HTTP request, the function frees the memory allocated for the first
  header but fails to set the pointer to NULL. On subsequent duplicate headers,
  the function attempts to free the same memory region again, causing a
  double-free condition. This vulnerability can be triggered remotely by sending
  an HTTP request with three or more Prefer headers, leading to a crash and
  potential memory corruption. The impact includes denial of service and
  potential remote code execution through heap metadata manipulation.

locations:
- path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_process_prefer
  startLine: 4018
  startColumn: 9
  endLine: 4018
  endColumn: 9