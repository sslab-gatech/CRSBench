id: cpv_6

name: Double-free in nginx Prefer header processing due to dangling pointer

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-415
- CWE-672

description: |
  A double-free vulnerability exists in the ngx_http_process_prefer function
  in src/http/ngx_http_request.c. When processing multiple "Prefer" HTTP headers,
  the function frees memory for duplicate headers but fails to set the pointer to
  NULL, leaving a dangling pointer. When a third "Prefer" header is processed,
  the code attempts to free the already-freed memory, resulting in a double-free
  condition. This can lead to denial of service (crash), memory corruption, and
  potentially arbitrary code execution.

locations:
- type: crash_site
  path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_process_prefer
  startLine: 4018
  startColumn: 0
  endLine: 4018
  endColumn: 0
- type: root_cause
