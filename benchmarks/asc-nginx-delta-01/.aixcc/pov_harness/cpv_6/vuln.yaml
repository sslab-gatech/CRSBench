id: cpv_6

name: Double-free in nginx Prefer header processing due to dangling pointer

origin: synthetic

validator: Younggi Park

release_date: 02/01/2026

references: ["https://github.com/aixcc-public/challenge-004-nginx-cp/tree/main/.internal_only/cpv10"]


cwes:
- CWE-415
- CWE-672

description: |
  This vulnerability is related to the support for the Prefer header in NGINX. When Prefer header arrives, the program modifies the header filter module to account for the Prefer header's length and include it in the response if present in the request. The program also updates the request processing code to handle the Prefer header by declaring and implementing a new function, ngx_http_process_prefer, which processes this header, checks for duplicates, logs appropriately, and allocates memory for storing the header. Additionally, the ngx_http_headers_in_t structure is updated to include a field for the Prefer header, ensuring proper storage and handling within the request lifecycle. However, if there are more than one of these Prefer headers in a request, nginx should fail with a proper error but current implmentation accepts the duplicated Prefer header. If an attacker sends multiple Prefer header then they can trigger a double free of the prefer buffer in the http request structure.


locations:
- type: crash_site
  path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_process_prefer
  startLine: 4018
  startColumn: 0
  endLine: 4018
  endColumn: 0
- type: root_cause
  path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_process_prefer
  startLine: 4018
  startColumn: 0
  endLine: 4019
  endColumn: 0