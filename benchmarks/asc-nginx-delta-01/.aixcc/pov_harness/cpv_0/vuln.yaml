id: cpv_0

name: Heap Use-After-Free in Black List Removal

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-416
- CWE-672

description: |
  A heap use-after-free vulnerability exists in the ngx_black_list_remove function
  in src/core/ngx_cycle.c. When removing the head node of the blacklist, the function
  frees the memory but fails to update the blacklist pointer and doesn't properly
  unlink the node. Subsequently, the function attempts to access the freed memory
  through reader->next in the loop condition, causing a heap-use-after-free.
  An attacker can trigger this by sending HTTP requests with X-Remove-White-List
  headers containing specific IP addresses, potentially leading to arbitrary code
  execution or denial of service.

locations:
