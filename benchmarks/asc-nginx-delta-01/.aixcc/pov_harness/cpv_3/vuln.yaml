id: cpv_3

name: nginx HTTP TRACE Handler Heap Buffer Overflow via Excessive Headers

cwes:
- CWE-122
- CWE-787
- CWE-119

description: |
  A heap-based buffer overflow vulnerability exists in nginx's HTTP TRACE request handler
  (ngx_http_trace_handler function in src/http/ngx_http_request.c). The function allocates
  a fixed 200-byte heap buffer but fails to validate that the total size of HTTP headers
  fits within this buffer before copying them via ngx_copy/memcpy operations. When processing
  an HTTP TRACE request containing multiple headers with large values that collectively exceed
  200 bytes, the function writes beyond the allocated buffer boundary, causing heap memory
  corruption. An attacker can trigger this vulnerability by sending a crafted TRACE request
  with excessive header data, potentially leading to arbitrary code execution, denial of
  service through crashes, or information disclosure through heap metadata corruption.

locations:
- path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_trace_handler
  startLine: 4217
  startColumn: 19
  endLine: 4217
  endColumn: 19