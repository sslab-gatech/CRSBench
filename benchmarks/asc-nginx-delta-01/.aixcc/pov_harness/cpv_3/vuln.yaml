id: cpv_3

name: Heap Buffer Overflow in nginx HTTP TRACE Handler

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap buffer overflow vulnerability exists in the ngx_http_trace_handler
  function in src/http/ngx_http_request.c. The function allocates a fixed
  200-byte buffer to store HTTP TRACE response data but does not validate
  that the cumulative size of all request headers will fit within this buffer
  before copying them. When processing HTTP TRACE requests with headers
  exceeding 200 bytes total, the ngx_copy operations overflow the heap buffer,
  leading to heap corruption and potential arbitrary code execution.

locations:
- type: crash_site
  path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_trace_handler
  startLine: 4217
  startColumn: 19
  endLine: 4217
  endColumn: 19
- type: root_cause
  path_from_root: src/http/ngx_http_request.c
  function_name: ngx_http_trace_handler
  startLine: 4211
  startColumn: 1
  endLine: 4218
  endColumn: 25