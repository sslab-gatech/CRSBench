id: cpv_2

name: Heap buffer overflow in nginx HTTP Basic Authentication base64 decoding

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap buffer overflow vulnerability exists in the ngx_http_auth_basic_user
  function in src/http/ngx_http_core_module.c. The function allocates a fixed-size
  buffer of 16 bytes (NGX_HTTP_AUTH_MAX) to store decoded base64 credentials,
  but the actual size needed depends on the encoded input length. When a base64-
  encoded authentication header exceeds 24 characters (decoding to more than 18
  bytes), the ngx_decode_base64_internal function writes beyond the allocated
  buffer boundary. This can lead to memory corruption, denial of service, or
  potentially arbitrary code execution.

locations:
- type: root_cause
  path_from_root: src/http/ngx_http_core_module.c
  function_name: ngx_http_auth_basic_user
  startLine: 1988
  startColumn: 5
  endLine: 1989
  endColumn: 52
- type: crash_site
  path_from_root: src/core/ngx_string.c
  function_name: ngx_decode_base64_internal
  startLine: 1330
  startColumn: 14
  endLine: 1330
  endColumn: 14