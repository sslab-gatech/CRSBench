id: cpv_2

name: Heap buffer overflow in nginx HTTP Basic Authentication base64 decoding

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap-based buffer overflow vulnerability exists in nginx's HTTP Basic Authentication
  handler when processing Authorization headers. The ngx_http_auth_basic_user() function
  in src/http/ngx_http_core_module.c allocates a fixed-size buffer of only 16 bytes
  (NGX_HTTP_AUTH_MAX) to store decoded base64 credentials. When a client sends an
  Authorization header with base64-encoded credentials that decode to more than 16 bytes,
  the ngx_decode_base64_internal() function writes beyond the allocated buffer boundary,
  causing heap memory corruption. This can be remotely triggered by crafting an HTTP
  request with a sufficiently long base64-encoded Authorization header, potentially
  leading to arbitrary code execution, denial of service, or authentication bypass.

locations:
- path_from_root: src/core/ngx_string.c
  function_name: ngx_decode_base64_internal
  startLine: 1330
  startColumn: 14
  endLine: 1330
  endColumn: 14
- path_from_root: src/http/ngx_http_core_module.c
  function_name: ngx_http_auth_basic_user
  startLine: 1988
  startColumn: 0
  endLine: 1994
  endColumn: 0