id: cpv_2

name: Heap buffer overflow in nginx HTTP Basic Authentication base64 decoding

origin: synthetic

validator: Younggi Park

release_date: 02/01/2026

references: ["https://github.com/aixcc-public/challenge-004-nginx-cp/tree/main/.internal_only/cpv2"]


cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  The Basic Auth header is a component of the HTTP protocol used for simple access control. When a user requests access to a protected resource, if unallowed, the server responds with a 401 Unauthorized status and a WWW-Authenticate header. The client could then send a request with an Authorization header containing the word Basic followed by a space and a base64-encoded string username:password. This allows the server to decode the credentials and verify the user's identity.
  The vulnerability is located in how nginx handles this basic authentication header. The attacker can send a base64 encoded string, but the nginx server has a statically-sized buffer into which it decodes the given base64 string. For example, when a base64-
  encoded authentication header exceeds 24 characters (decoding to more than 18
  bytes), the ngx_decode_base64_internal function writes beyond the allocated
  buffer boundary. This results in a heap base buffer overflow because the size of buffer can exceed NGX_HTTP_AUTH_MAX.


locations:
- type: root_cause
  path_from_root: src/http/ngx_http_core_module.c
  function_name: ngx_http_auth_basic_user
  startLine: 1988
  startColumn: 5
  endLine: 1988
  endColumn: 34
- type: crash_site
  path_from_root: src/core/ngx_string.c
  function_name: ngx_decode_base64_internal
  startLine: 1330
  startColumn: 14
  endLine: 1330
  endColumn: 14
