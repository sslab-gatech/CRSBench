id: cpv_0

name: XSLT Injection Leading to Remote Code Execution

origin: 1-day

release_date: 12/04/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-49093
- https://github.com/HtmlUnit/htmlunit/security/advisories/GHSA-37vq-hr2f-g7h7
- https://osv.dev/vulnerability/GHSA-37vq-hr2f-g7h7

cwes:
- CWE-94
- CWE-74
- CWE-91

description: |
  A Remote Code Execution (RCE) vulnerability exists in HtmlUnit's XSLTProcessor
  implementation due to missing FEATURE_SECURE_PROCESSING configuration in the
  XSLT TransformerFactory. The vulnerability allows attackers to execute arbitrary
  OS commands through malicious XSLT stylesheets when processing XML transformations.
  
  The root cause is in the configureTransformerFactory() method which sets various
  security attributes but critically omits enabling secure processing mode. Without
  this protection, XSLT stylesheets can access Java Runtime methods through XSLT
  extension functions and execute arbitrary system commands via Runtime.exec().
  
  An attacker can craft a malicious XSLT stylesheet with Java extension functions
  that invoke Runtime.getRuntime().exec() to execute system commands. When HtmlUnit
  processes the page, the XSLTProcessor applies the malicious stylesheet, triggering
  command execution. This results in complete system compromise with CVSS score 9.8.

