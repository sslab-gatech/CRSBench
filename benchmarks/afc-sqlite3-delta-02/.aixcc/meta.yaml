patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
delta_mode:
  base_commit: d6a2180510e6fb05277f8325f132605399528505
  ref_commit: 4c3b982f5a75d086679a08c4c2c2ad9eb626eb2c
full_mode:
  base_commit: 4c3b982f5a75d086679a08c4c2c2ad9eb626eb2c
harness_files:
- name: ossfuzz
  path: $REPO/test/ossfuzz.c
- name: customfuzz3
  path: $REPO/test/customfuzz3.c
  vulns:
