patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
delta_mode:
  base_commit: 157e7faac92b4c79e7202de036b45d8ef0f7b35e
  ref_commit: f3ebada54f1fb873056e315c2cf4ba8e4b7ca04b
full_mode:
  base_commit: f3ebada54f1fb873056e315c2cf4ba8e4b7ca04b
harness_files:
- name: curl_fuzzer
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_bufq
  path: $PROJECT/curl_fuzzer/fuzz_bufq.cc
- name: curl_fuzzer_dict
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_file
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_ftp
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_gopher
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_http
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: SEGV on unknown address'
- name: curl_fuzzer_https
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_imap
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_mqtt
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_pop3
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_rtsp
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_smb
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_smtp
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_tftp
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
- name: curl_fuzzer_ws
  path: $PROJECT/curl_fuzzer/curl_fuzzer.cc
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: SEGV on unknown address 0x000000000000'
- name: fuzz_url
  path: $PROJECT/curl_fuzzer/fuzz_url.cc
