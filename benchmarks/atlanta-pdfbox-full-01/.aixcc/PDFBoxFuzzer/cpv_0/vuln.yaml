id: cpv_0

name: PDFBox Cross-Reference Stream Parser Out-of-Memory DoS

origin: 1-day

release_date: 03/19/2021

references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-27906
- https://issues.apache.org/jira/browse/PDFBOX-5112
- http://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-27906

cwes:
- CWE-789
- CWE-770

description: |
  An Out-of-Memory Denial of Service vulnerability exists in Apache PDFBox's
  PDF cross-reference stream parser. The vulnerable code in the
  PDFXrefStreamParser.initParserValues() method reads the /Index array from
  a malicious PDF's cross-reference stream without validating the size values.
  An attacker can craft a PDF file with an extremely large size value in the
  /Index array, causing the ArrayList to attempt to allocate memory for millions
  of Long objects, resulting in an OutOfMemoryError and application crash.
  This leads to denial of service through memory exhaustion.

locations:
- type: root_cause
  path_from_root: pdfbox/src/main/java/org/apache/pdfbox/pdfparser/PDFXrefStreamParser.java
  function_name: initParserValues
  startLine: 100
  startColumn: 0
  endLine: 122
  endColumn: 0