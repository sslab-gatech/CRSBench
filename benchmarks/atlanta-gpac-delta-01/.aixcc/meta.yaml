patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
delta_mode:
  base_commit: 9efb5977c5b7a45e52acd83533076c18bc8f294a
  ref_commit: f85c2ee9cfea581ee4e12123eb3bb2c574f0e8b0
full_mode:
  base_commit: f85c2ee9cfea581ee4e12123eb3bb2c574f0e8b0
harness_files:
- name: fuzz_probe_analyze
  path: $PROJECT/fuzz_probe_analyze.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: global-buffer-overflow'
- name: fuzz_parse
  path: $PROJECT/fuzz_parse.c
- name: fuzz_m2ts_probe
  path: $PROJECT/fuzz_m2ts_probe.c
