id: cpv_0

name: Global buffer overflow in gf_mp3_bit_rate due to unchecked bitrate index

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-125
- CWE-787
- CWE-129

description: |
  A global buffer overflow vulnerability exists in the gf_mp3_bit_rate function
  in src/media_tools/av_parsers.c. The function extracts a 4-bit bitRateIndex
  value (0-15) from an MP3 header but fails to validate it before using it as
  an array index into bitrate_table, which only has 15 columns (indices 0-14).
  When a malformed MP3 file contains a bitrate index of 15, the code attempts
  to access bitrate_table[lidx][15], resulting in a 4-byte out-of-bounds read
  past the end of the global buffer. This can lead to information disclosure
  or denial of service.

locations:
