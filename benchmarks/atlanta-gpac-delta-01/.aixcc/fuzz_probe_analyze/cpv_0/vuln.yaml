id: cpv_0

name: Out-of-bounds read in MP3 bitrate parser via invalid bitrate index

cwes:
- CWE-129
- CWE-125
- CWE-787

description: |
  A global buffer overflow vulnerability exists in the gf_mp3_bit_rate() function
  in src/media_tools/av_parsers.c. The function extracts a bitRateIndex value from
  an MP3 header by masking 4 bits (range 0-15) but fails to validate this index
  before using it to access the bitrate_table array, which only has 15 elements
  (valid indices 0-14). When bitRateIndex equals 15, the array access
  bitrate_table[lidx][15] results in an out-of-bounds read.
  
  An attacker can craft a malicious MP3 or MPEG-2 PS file with a bitrate index
  field set to 15 (0xF) to trigger this vulnerability during audio stream parsing.
  This can lead to information disclosure through memory leakage, denial of service
  via crashes, and potentially aid in bypassing memory protection mechanisms.

locations:
- path_from_root: src/media_tools/av_parsers.c
  function_name: gf_mp3_bit_rate
  startLine: 4527
  startColumn: 9
  endLine: 4527
  endColumn: 9