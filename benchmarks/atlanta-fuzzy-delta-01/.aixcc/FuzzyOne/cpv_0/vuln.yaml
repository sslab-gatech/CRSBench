id: cpv_0

name: XPath Injection in Config.getTagXPath via Unsanitized Tag Parameter

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-643
- CWE-91
- CWE-74

description: |
  An XPath injection vulnerability exists in the Config.getTagXPath() method
  which constructs XPath expressions through simple string concatenation without
  proper input validation or sanitization. When the tag parameter contains special
  XPath characters (like single quotes), it breaks the XPath syntax and allows
  injection of malicious XPath expressions. This can allow attackers to extract
  sensitive data from XML documents, bypass authentication/authorization checks,
  or potentially cause denial of service through malformed queries.

