id: cpv_0

name: ReDoS via Nested Quantifiers in URL Domain Validation

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-1333
- CWE-400

description: |
  A Regular Expression Denial of Service (ReDoS) vulnerability exists in the
  SPEACIAL_URL_STRING_REGEX pattern. The regex "([a-z0-9]+)+" contains nested
  quantifiers that cause catastrophic backtracking when matching fails. The
  inner quantifier matches one or more alphanumeric characters, while the outer
  quantifier matches one or more groups, resulting in exponential time complexity
  O(2^n). When DOMAIN_PATTERN.matcher(hostIP).matches() is called during URL
  validation, a crafted input can trigger excessive CPU consumption, causing
  timeouts and denial of service.

