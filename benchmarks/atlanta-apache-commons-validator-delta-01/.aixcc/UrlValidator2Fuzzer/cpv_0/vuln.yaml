id: cpv_0

name: Regular Expression Denial of Service via Catastrophic Backtracking in URL Domain Validation

cwes:
- CWE-1333
- CWE-400
- CWE-697

description: |
  A Regular Expression Denial of Service (ReDoS) vulnerability exists in the UrlValidator
  class due to catastrophic backtracking in the SPEACIAL_URL_STRING_REGEX pattern. The
  vulnerable regex "([a-z0-9]+)+" uses nested quantifiers, where both the inner and outer
  quantifiers apply to the same character class. When processing URLs with long sequences
  of alphanumeric characters followed by a non-matching character, the regex engine attempts
  exponentially many matching combinations (2^N for N characters), causing the application
  to hang. This occurs in the isValidAuthority method when validating domain names against
  the DOMAIN_PATTERN. An attacker can craft a malicious URL containing approximately 25,000
  'a' characters in the domain portion (e.g., "http://trk-us-aaa...aaaX-prod.example.com")
  to trigger timeouts exceeding 25 seconds, resulting in complete service disruption and
  CPU resource exhaustion. The vulnerability allows a single malicious URL to cause a
  denial of service with minimal attacker effort.

locations:
- path_from_root: src/main/java/org/apache/commons/validator/UrlValidator.java
  function_name: isValidAuthority
  startLine: 167
  endColumn: 0
  endLine: 167
  startColumn: 0