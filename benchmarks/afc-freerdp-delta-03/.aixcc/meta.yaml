patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: c2b6631d6389bcc977eccdfadeb99fe8d62c4e26
  ref_commit: 9968a08abacd9fb87907a2d58ee380b754a3a007

full_mode:
