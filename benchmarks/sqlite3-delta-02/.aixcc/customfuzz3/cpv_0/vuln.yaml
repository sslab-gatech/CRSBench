id: cpv_0

name: LSM zero-day null pointer dereference

cwes:
- CWE-476

description: The bug is a typo that causes a subtle interplay between various parts of the lsm1 module system in SQLite, eventually
  causing a null pointer dereference when a subsystem attempts to access a value that should have been set up correctly by
  the typo.

