id: cpv_10

name: Authorization Bypass Allowing Arbitrary Library Loading

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-285
- CWE-863
- CWE-114

description: |
  An authorization bypass vulnerability exists in the doPerform function in
  SecretMessage.java. The vulnerability stems from a flawed authorization check
  that uses OR (||) instead of AND (&&) logic when validating the 'freeload'
  parameter. This allows any authenticated user to bypass the absolute path
  restriction by providing the 'freeload' parameter in the request, regardless
  of their admin status. As a result, attackers can load arbitrary native
  libraries into the Jenkins process using Runtime.getRuntime().load(), leading
  to remote code execution with Jenkins process privileges.

