id: cpv_5

name: SQL Injection in UserNameAction.doGetName method

cwes:
- CWE-89

description: |
  A SQL injection vulnerability exists in the doGetName method of the UserNameAction class
  in the Jenkins toy-plugin. The vulnerability occurs at line 74 of UserNameAction.java where
  user-supplied input parameters (ID and PW) are directly concatenated into a SQL query string
  without sanitization or parameterization. The code constructs the query as:
  "SELECT name FROM users WHERE id = '" + id + "' AND password = '" + pw + "'"
  
  This allows attackers to inject arbitrary SQL code by including special characters (particularly
  single quotes) in the ID or PW parameters obtained from the HTTP request. An attacker could
  bypass authentication, extract sensitive data from the database, modify or delete records, or
  execute arbitrary SQL commands. The vulnerability was detected by Jazzer's SQL injection
  sanitizer and can be triggered with simple payloads containing single quotes.

locations:
- path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/UserNameAction.java
  function_name: doGetName
  startLine: 74
  startColumn: 0
  endLine: 74
  endColumn: 0