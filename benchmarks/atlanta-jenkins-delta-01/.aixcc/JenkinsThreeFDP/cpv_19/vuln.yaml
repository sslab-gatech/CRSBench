id: cpv_19
name: Jenkins ProxyConfiguration SSRF due to Missing Authorization

origin: 1-day

release_date: 02/14/2018

references:
- https://www.jenkins.io/security/advisory/2018-02-14/
- https://nvd.nist.gov/vuln/detail/CVE-2018-1000067

cwes:
- CWE-918
- CWE-862

description: |
  An improper authorization vulnerability in Jenkins versions 2.106 and earlier
  (and LTS 2.89.3 and earlier) enables Server-Side Request Forgery attacks. The
  doValidateProxy method in ProxyConfiguration.java validates proxy configuration
  by making HTTP requests to user-specified URLs but fails to check if the user
  has sufficient permissions to perform this operation. An attacker with only
  Overall/Read access can provide malicious URLs, causing Jenkins to make HTTP
  requests to attacker-specified destinations. This allows network reconnaissance
  of internal services, potential data exfiltration, and access to cloud metadata
  endpoints.

locations:
- type: crash_site
  path_from_root: jenkins/core/src/main/java/hudson/ProxyConfiguration.java
  function_name: doValidateProxy
  startLine: 593
  endLine: 593
- type: root_cause
  path_from_root: jenkins/core/src/main/java/hudson/ProxyConfiguration.java
  function_name: doValidateProxy
  startLine: 529
  endLine: 533