id: cpv_8

name: LDAP Injection in AuthAction.authenticateAsAdmin via Unsanitized Search Filter

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-90
- CWE-943

description: |
  An LDAP injection vulnerability exists in the authenticateAsAdmin method
  of AuthAction.java. The application constructs an LDAP search filter by
  directly concatenating user-supplied username and key parameters without
  proper sanitization or escaping. An attacker can inject LDAP metacharacters
  to bypass authentication, enumerate users, extract sensitive information
  from the LDAP directory, or escalate privileges by authenticating as
  arbitrary users. The vulnerability violates RFC 4515 requirements for
  LDAP filter escaping.

locations:
- type: root_cause
  path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/AuthAction.java
  function_name: authenticateAsAdmin
  startLine: 228
  startColumn: 1
  endLine: 229
  endColumn: 40