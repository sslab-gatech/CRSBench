id: cpv_9

name: XPath Injection in Jenkins XMLUtils.getValue()

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-643
- CWE-91

description: |
  An XPath Injection vulnerability exists in the getValue method of
  jenkins.util.xml.XMLUtils. The method accepts user-controlled XPath
  expressions and directly compiles and evaluates them against an XML
  document without any validation or sanitization. An attacker can inject
  malicious XPath expressions containing function calls like document()
  to perform XML External Entity (XXE) attacks, extract sensitive data,
  or cause denial of service through resource exhaustion.

