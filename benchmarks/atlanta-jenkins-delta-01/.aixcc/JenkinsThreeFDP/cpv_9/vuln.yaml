id: cpv_9

name: XPath Injection in Jenkins API XML Endpoint

cwes:
- CWE-643
- CWE-91
- CWE-74

description: |
  XPath Injection vulnerability in the Jenkins toy-plugin's API endpoint. The vulnerability
  exists in the Api.doXml() method which exposes XML data through a REST API endpoint at
  .../api/xml. The method accepts user-controlled input through two HTTP query parameters
  (xpath and exclude) and passes them directly to XMLUtils.getValue() without validation
  or sanitization. The XMLUtils.getValue() method then compiles and executes these
  user-provided XPath expressions using XPathFactory. An attacker can inject malicious
  XPath expressions such as document() functions to extract sensitive information from
  XML documents, bypass access controls, or cause denial of service through resource-intensive
  queries. The Jazzer XPath Injection sanitizer detected the malicious payload at runtime
  with the injected query "document(2)", confirming the vulnerability.

