id: cpv_7

name: OS Command Injection in Jenkins Toy Plugin URL Validation

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-78
- CWE-77

description: |
  An OS Command Injection vulnerability exists in the UserRemoteConfig class
  of the Jenkins toy-plugin. The doCheckUrl method accepts user-supplied URL
  values via @QueryParameter without proper sanitization and passes them
  directly to command execution through getHeadRev() and
  launchCommandWithCredentials(). When the unsanitized URL reaches
  ProcessBuilder.start(), shell metacharacters or command injection payloads
  are executed with Jenkins process privileges. An attacker with
  Job/Configure permissions can execute arbitrary OS commands on the Jenkins
  controller, leading to complete system compromise, data exfiltration, or
  malware installation.

locations:
- type: root_cause
  path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/UserRemoteConfig.java
  function_name: doCheckUrl
  startLine: 195
  startColumn: 0
  endLine: 196
  endColumn: 0
- type: root_cause
  path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/UserRemoteConfig.java
  function_name: getHeadRev
  startLine: 97
  startColumn: 0
  endLine: 101
  endColumn: 0
- type: crash_site
  path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/UserRemoteConfig.java
  function_name: launchCommandWithCredentials
  startLine: 91
