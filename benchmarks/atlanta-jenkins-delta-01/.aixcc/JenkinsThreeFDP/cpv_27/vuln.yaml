id: cpv_27
name: Regular Expression Injection via Authorization Bypass in AccessFilter

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-1333
- CWE-185
- CWE-863

description: |
  A combined authorization bypass and regular expression injection vulnerability exists in the AccessFilter.doGet() method.
  The authorization logic at line 79 incorrectly uses OR (||) instead of AND (&&), allowing non-admin users to bypass IP
  validation by providing a "skip" parameter. This enables attackers to inject malicious regex metacharacters through the
  "ip" parameter, which is directly concatenated into a regex pattern at line 87 without sanitization. The attack can cause
  PatternSyntaxException crashes or ReDoS (Regular Expression Denial of Service) through catastrophic backtracking, consuming
  excessive CPU time.

