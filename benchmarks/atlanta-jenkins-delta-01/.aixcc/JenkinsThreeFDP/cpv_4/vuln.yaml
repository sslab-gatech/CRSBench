id: cpv_4

name: Insecure Deserialization in Jenkins Code Coverage API Plugin

origin: 1-day

release_date: 08/31/2021

references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-21677
- https://www.jenkins.io/security/advisory/2021-08-31/
- https://github.com/advisories/GHSA-58pr-hprx-7hg6
- https://osv.dev/vulnerability/CVE-2021-21677

cwes:
- CWE-502
- CWE-470

description: |
  A deserialization vulnerability exists in the Jenkins Code Coverage API Plugin
  version 1.4.0 and earlier. The plugin fails to apply Jenkins JEP-200 deserialization
  protections when deserializing Java objects from disk storage. The CoverageProcessor
  class uses CompatibleObjectInputStream to deserialize coverage results, but the
  CompatibleObjectInputStream class does not override resolveClass() to enforce its
  defined allowlist of permitted classes. This allows an attacker who can control the
  content of serialized report files to instantiate arbitrary classes available on the
  classpath, leading to Remote Code Execution with the privileges of the Jenkins server.

locations:
- type: crash_site
  path_from_root: plugins/code-coverage-api-plugin/src/main/java/io/jenkins/plugins/coverage/CoverageProcessor.java
  function_name: recoverCoverageResult
  startLine: 733
  endLine: 733
- type: root_cause
  path_from_root: plugins/code-coverage-api-plugin/src/main/java/io/jenkins/plugins/coverage/CompatibleObjectInputStream.java
  function_name: CompatibleObjectInputStream
  startLine: 27
  endLine: 30