id: cpv_15

name: OS Command Injection via Unsafe Reflection in Jenkins EmailConfig

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-77
- CWE-78
- CWE-470

description: |
  A multi-stage OS command injection vulnerability exists in the Jenkins
  email-ext-plugin EmailConfig class. The vulnerability combines unsafe
  reflection with OS command execution. The constructor() method uses
  attacker-controlled input (emailAddress field) to dynamically invoke
  methods via reflection using getDeclaredMethod(). When publishReady is
  true, setAccessible(true) bypasses access controls to invoke private
  methods. An attacker can set emailAddress to "debugOnlyAndPrivate" to
  invoke a private method that executes OS commands from the optCache
  field using Runtime.getRuntime().exec(). This allows remote code
  execution through attacker-controlled command injection.

locations:
- type: crash_site
  path_from_root: plugins/email-ext-plugin/src/main/java/hudson/plugins/emailext/EmailConfig.java
  function_name: debugOnlyAndPrivate
  startLine: 37
  startColumn: 1
  endLine: 37
  endColumn: 60
- type: root_cause
  path_from_root: plugins/email-ext-plugin/src/main/java/hudson/plugins/emailext/EmailConfig.java
  function_name: constructor
  startLine: 93
