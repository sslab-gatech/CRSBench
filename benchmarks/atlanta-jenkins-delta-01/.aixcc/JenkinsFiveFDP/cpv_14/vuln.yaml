id: cpv_14

name: OS Command Injection via Unsafe Reflection in EmailConfig

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-77
- CWE-78
- CWE-470

description: |
  An OS command injection vulnerability exists in the email-ext-plugin
  EmailConfig class. The vulnerability occurs through an unsafe reflection
  pattern in the constructor() method that allows attacker-controlled input
  to invoke private methods. By setting the emailAddress field to
  "debugOnlyAndPrivate", an attacker can trigger execution of arbitrary OS
  commands through Runtime.exec() without any validation. The attack chain
  involves first enabling debug mode via reflection, then invoking the
  debugOnlyAndPrivate() method which executes commands from the optCache
  field. This can lead to remote code execution with the privileges of the
  Jenkins process.

locations:
- type: root_cause
  path_from_root: plugins/email-ext-plugin/src/main/java/hudson/plugins/emailext/EmailConfig.java
  function_name: constructor
  startLine: 96
  endLine: 96
- type: crash_site
  path_from_root: plugins/email-ext-plugin/src/main/java/hudson/plugins/emailext/EmailConfig.java
  function_name: debugOnlyAndPrivate
  startLine: 37
  endLine: 37