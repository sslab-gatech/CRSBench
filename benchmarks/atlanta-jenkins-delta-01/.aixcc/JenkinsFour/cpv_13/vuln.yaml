id: cpv_13

name: Permission Bypass Leading to Unsafe Deserialization in LocalFileKnowledgeBase

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-502
- CWE-284
- CWE-863

description: |
  A permission bypass vulnerability exists in the doLoad method of LocalFileKnowledgeBase
  at line 327, where a logic error in the authorization check uses AND (&&) instead of OR (||).
  This allows users with only one of the required permissions (REMOVE_PERMISSION or
  UPDATE_PERMISSION) to bypass the authorization check and trigger unsafe deserialization.
  The doLoad method calls load() which deserializes untrusted data using ObjectInputStream
  at line 131 without proper validation. An attacker with insufficient permissions can
  exploit this to achieve Remote Code Execution by crafting malicious serialized Java objects.

locations:
- type: crash_site
  path_from_root: plugins/build-failure-analyzer-plugin/src/main/java/com/sonyericsson/jenkins/plugins/bfa/db/LocalFileKnowledgeBase.java
  function_name: lambda$load$1
  startLine: 131
  endLine: 131
- type: root_cause
