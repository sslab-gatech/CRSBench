id: cpv_13

name: Authorization Bypass Leading to RCE via Insecure Deserialization in Jenkins BFA Plugin

cwes:
- CWE-502
- CWE-285
- CWE-863

description: |
  Critical remote code execution vulnerability combining two security flaws in the Jenkins Build Failure Analyzer Plugin.
  
  The primary vulnerability is an authorization bypass in LocalFileKnowledgeBase.doLoad() at line 325, where the permission 
  check uses AND (&&) instead of OR (||). This logic error allows access if a user has EITHER REMOVE_PERMISSION or 
  UPDATE_PERMISSION, when it should require BOTH permissions.
  
  The secondary vulnerability is insecure deserialization in LocalFileKnowledgeBase.load() at line 131, where the method 
  performs unsafe Java deserialization using ObjectInputStream.readObject() without validation or filtering. This reads 
  serialized FailureCause objects from files in the knowledge base directory.
  
  An attacker with limited permissions can exploit the authorization bypass to trigger the doLoad() method via POST request, 
  which calls load() to deserialize files. By placing a malicious serialized object in the knowledge base directory, the 
  attacker can trigger arbitrary code execution through Java deserialization gadget chains. This leads to complete system 
  compromise, data breach, and potential lateral movement to connected systems.

locations:
- path_from_root: plugins/build-failure-analyzer-plugin/src/main/java/com/sonyericsson/jenkins/plugins/bfa/db/LocalFileKnowledgeBase.java
  function_name: doLoad
  startLine: 325
  endLine: 325
  startColumn: 0
  endColumn: 0
- path_from_root: plugins/build-failure-analyzer-plugin/src/main/java/com/sonyericsson/jenkins/plugins/bfa/db/LocalFileKnowledgeBase.java
  function_name: load
  startLine: 131
