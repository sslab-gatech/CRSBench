id: cpv_12

name: SSRF with Permission Bypass via Logic Error in Jenkins Build Failure Analyzer Plugin

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-918
- CWE-863
- CWE-1286

description: |
  A Server-Side Request Forgery (SSRF) vulnerability combined with a permission
  bypass exists in the doRemoveConfirm method of CauseManagement.java. The root
  cause is a logic error in the permission check at line 232, where an OR operator
  (||) is used instead of AND (&&), allowing attackers to bypass authorization by
  providing any non-null id parameter. Once inside the method, if a FailureCause
  comment starts with "notice:", the code extracts a URL and makes an HTTP request
  without validation, enabling attackers to scan internal networks, access internal
  services, or exfiltrate data.

locations:
- type: root_cause
  path_from_root: plugins/build-failure-analyzer-plugin/src/main/java/com/sonyericsson/jenkins/plugins/bfa/CauseManagement.java
  function_name: doRemoveConfirm
  startLine: 232
  startColumn: 9
  endLine: 232
  endColumn: 42
- type: crash_site
  path_from_root: plugins/build-failure-analyzer-plugin/src/main/java/com/sonyericsson/jenkins/plugins/bfa/CauseManagement.java
  function_name: doRemoveConfirm
