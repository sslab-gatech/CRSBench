id: cpv_15

name: Reflection-Based OS Command Injection via Unsafe Private Method Access

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-78
- CWE-470
- CWE-94

description: |
  A critical OS command injection vulnerability exists in the Jenkins Email Extension Plugin
  that exploits unsafe reflection and insufficient access controls. The constructor() method
  uses getDeclaredMethod() with attacker-controlled input from the emailAddress field to
  dynamically invoke methods via reflection. When publishReady is true, the code bypasses
  Java's access control mechanisms by calling setAccessible(true), allowing invocation of
  private methods. An attacker can exploit this by first enabling debug mode through
  reflection, then invoking the private debugOnlyAndPrivate() method which executes OS
  commands from the optCache field without sanitization. This leads to remote code execution
  with Jenkins process privileges.

locations:
- type: crash_site
  path_from_root: plugins/email-ext-plugin/src/main/java/hudson/plugins/emailext/EmailConfig.java
  function_name: debugOnlyAndPrivate
