id: cpv_14

name: OS Command Injection via Unsafe Reflection in EmailConfig

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-77
- CWE-78
- CWE-470

description: |
  A command injection vulnerability exists in the EmailConfig class through
  unsafe reflection. The constructor() method at line 96 uses attacker-controlled
  input (emailAddress) to reflectively invoke methods without validation. An
  attacker can invoke debugOnlyAndPrivate(), which directly passes user-controlled
  data (optCache) to Runtime.getRuntime().exec() at line 37 without sanitization.
  This allows arbitrary OS command execution with Jenkins process privileges,
  potentially leading to complete system compromise.

locations:
- type: crash_site
  path_from_root: plugins/email-ext-plugin/src/main/java/hudson/plugins/emailext/EmailConfig.java
  function_name: debugOnlyAndPrivate
  startLine: 37
  endLine: 37
- type: root_cause
  path_from_root: plugins/email-ext-plugin/src/main/java/hudson/plugins/emailext/EmailConfig.java
  function_name: constructor
  startLine: 96
  endLine: 96