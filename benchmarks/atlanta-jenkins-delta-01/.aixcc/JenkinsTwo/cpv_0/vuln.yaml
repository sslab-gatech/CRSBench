id: cpv_0

name: Authentication Bypass via Hardcoded Backdoor Leading to OS Command Injection

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-78
- CWE-77
- CWE-912

description: |
  An authentication bypass combined with OS command injection vulnerability exists
  through a hardcoded backdoor mechanism in the Jenkins UtilPlug plugin. The
  doexecCommandUtils method contains a backdoor that checks for a specific HTTP
  header (x-evil-backdoor) with a known password hash. If the header value matches
  the SHA-256 hash of "breakin the law", it bypasses normal Jenkins permission
  checks and directly calls createUtils() with user-supplied command input. The
  createUtils method then executes user-controlled input via ProcessBuilder without
  any sanitization or validation, allowing arbitrary OS command execution with
  Jenkins process privileges.

