id: cpv_5

name: SQL Injection in UserNameAction.doGetName via unsanitized request parameters

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-89
- CWE-943

description: |
  A SQL injection vulnerability exists in the doGetName method of the UserNameAction
  class. The vulnerability occurs because user-supplied input from HTTP request
  parameters (ID and PW) is directly concatenated into a SQL query string without
  proper sanitization or parameterization. An attacker can manipulate these parameters
  to inject arbitrary SQL code, potentially leading to unauthorized data access,
  authentication bypass, data modification, or complete database compromise.

