id: cpv_7

name: OS Command Injection in Jenkins UserRemoteConfig URL Validation

cwes:
- CWE-78
- CWE-77

description: |
  A critical OS command injection vulnerability exists in the Jenkins toy-plugin's UserRemoteConfig class.
  The doCheckUrl method accepts a URL parameter from user input through the @QueryParameter annotation without
  proper validation or sanitization. This URL is passed directly to the getHeadRev method, which constructs
  an ArgumentListBuilder and adds the unsanitized URL as a command argument. The command is then executed via
  Jenkins' launcher infrastructure, ultimately calling ProcessBuilder.start() to execute the command at the OS level.
  
  An attacker can supply a malicious URL containing shell metacharacters or command separators (such as ;, |, &,
  &&, ||, backticks, or $() command substitution) through the doCheckUrl endpoint. The attacker's injected commands
  will be executed with the privileges of the Jenkins process, leading to remote code execution, system compromise,
  data exfiltration, and potential lateral movement to other systems.

locations:
- path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/UserRemoteConfig.java
  function_name: doCheckUrl
