id: cpv_7

name: OS Command Injection in UserRemoteConfig.doCheckUrl()

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-78
- CWE-77

description: |
  An OS Command Injection vulnerability exists in the Jenkins toy plugin's
  UserRemoteConfig class. The doCheckUrl() method accepts user input via a
  URL parameter and passes it unsanitized through getHeadRev() to
  launchCommandWithCredentials(), which executes it as an OS command via
  ProcessBuilder. An attacker can inject arbitrary OS commands by crafting
  a malicious URL, leading to remote code execution with Jenkins process
  privileges.

locations:
- type: crash_site
  path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/UserRemoteConfig.java
  function_name: launchCommandWithCredentials
  startLine: 91
  endLine: 91
- type: root_cause
  path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/UserRemoteConfig.java
  function_name: doCheckUrl
  startLine: 195
  endLine: 199