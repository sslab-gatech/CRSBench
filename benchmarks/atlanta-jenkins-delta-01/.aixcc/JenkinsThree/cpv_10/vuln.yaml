id: cpv_10

name: Arbitrary Native Library Loading via Authorization Bypass

cwes:
- CWE-829
- CWE-863
- CWE-114

description: |
  An arbitrary native library loading vulnerability exists in the SecretMessage.doPerform() method
  due to an incorrect authorization check. The vulnerability is caused by using an OR operator (||)
  instead of an AND operator (&&) in the authorization logic on line 88. This allows non-admin users
  to bypass security controls by simply including a "freeload" parameter in their request, enabling
  them to set freeload=true and load arbitrary native libraries from attacker-controlled paths.
  
  When freeload is set to true, the absolute path validation check is bypassed, and the path variable
  is set directly from user input. On line 98, Runtime.getRuntime().load(path) loads the attacker-
  controlled native library, enabling remote code execution. This critical vulnerability allows
  attackers to load malicious native libraries (.so, .dll, .dylib files), achieve privilege
  escalation, and completely compromise the system through arbitrary native code execution.

locations:
- path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/SecretMessage.java
  function_name: doPerform
  startLine: 88
  startColumn: 0
  endLine: 98
  endColumn: 0