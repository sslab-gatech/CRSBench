id: cpv_10

name: Authorization Bypass Enabling Arbitrary Native Library Loading

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-863
- CWE-434
- CWE-94

description: |
  An authorization bypass vulnerability exists in the SecretMessage plugin's
  doPerform method. The code uses a logical OR operator instead of AND when
  checking authorization, allowing any user to set the 'freeload' parameter
  by simply including it in their request. This bypasses the absolute path
  restriction and enables loading arbitrary native libraries into the Jenkins
  process, leading to remote code execution. An attacker can exploit this by
  sending a request with freeload=True to load a malicious library without
  requiring administrative privileges.

