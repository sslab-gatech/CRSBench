id: cpv_11

name: Regular Expression Injection in Jenkins toy-plugin AccessFilter

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-1333
- CWE-185
- CWE-863

description: |
  A Regular Expression Injection vulnerability exists in the AccessFilter.doGet
  method in the Jenkins toy-plugin. The function constructs a regex pattern by
  directly concatenating unsanitized user input from the 'ip' parameter without
  escaping special regex metacharacters. An attacker can inject malicious regex
  patterns that cause PatternSyntaxException or catastrophic backtracking,
  leading to denial of service (ReDoS). The vulnerability is amplified by an
  authorization bypass that allows non-admin users to skip IP validation.

locations:
- type: crash_site
  path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/AccessFilter.java
  function_name: doGet
  startLine: 87
  endLine: 87
- type: root_cause
