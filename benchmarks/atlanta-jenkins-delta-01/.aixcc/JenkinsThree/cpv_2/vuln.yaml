id: cpv_2

name: Path Traversal in Jenkins Plugin Upload

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-22
- CWE-23
- CWE-73

description: |
  A path traversal vulnerability exists in the doPerformUpload method in
  hudson/PluginManager.java. The method accepts file upload requests and
  constructs the destination file path by directly concatenating a base
  directory with unsanitized user input from the uploadPath parameter.
  An attacker can provide malicious input containing path traversal
  sequences (e.g., ../../) to write files outside the intended /tmp/plugins
  directory, potentially achieving arbitrary file write, code execution,
  or data corruption on the Jenkins controller filesystem.

