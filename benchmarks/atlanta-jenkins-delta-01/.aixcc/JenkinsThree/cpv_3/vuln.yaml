id: cpv_3

name: Missing Permission Check in Proxy Configuration Validation Leading to SSRF

origin: 1-day

release_date: 02/15/2018

references:
- https://nvd.nist.gov/vuln/detail/CVE-2018-1000067
- https://www.jenkins.io/security/advisory/2018-02-14/

cwes:
- CWE-918
- CWE-862

description: |
  A Server-Side Request Forgery (SSRF) vulnerability exists in the
  doValidateProxy method of Hudson.ProxyConfiguration.DescriptorImpl2 class.
  The method fails to verify that the calling user has administrator privileges
  before processing proxy validation requests. This allows any authenticated user
  with basic read access (Overall/Read permission) to trigger arbitrary HTTP
  requests from the Jenkins server by providing a malicious URL in the testUrl
  parameter. Attackers can use this to scan internal networks, probe services
  behind firewalls, and gather information about internal infrastructure through
  HTTP status code responses.

locations:
- type: root_cause
  path_from_root: jenkins/core/src/main/java/hudson/ProxyConfiguration.java
  function_name: doValidateProxy
  startLine: 529
  endLine: 533
- type: crash_site
