id: cpv_8

name: LDAP Injection in AuthAction.authenticateAsAdmin

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-90
- CWE-20

description: |
  An LDAP Injection vulnerability exists in the authenticateAsAdmin method
  of the AuthAction class. User-controlled input (username and key parameters)
  is directly concatenated into an LDAP search filter without proper sanitization
  or parameterization. This allows an attacker to inject malicious LDAP filter
  syntax to bypass authentication checks, extract sensitive information from the
  LDAP directory, or gain unauthorized admin-level access.

locations:
- type: root_cause
  path_from_root: plugins/toy-plugin/src/main/java/io/jenkins/plugins/toyplugin/AuthAction.java
  function_name: authenticateAsAdmin
  startLine: 228
  startColumn: 0
  endLine: 230
  endColumn: 0