id: cpv_4

name: Insecure Deserialization in Code Coverage API Plugin

origin: 1-day

release_date: 08/31/2021

references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-21677
- https://www.jenkins.io/security/advisory/2021-08-31/

cwes:
- CWE-502
- CWE-470

description: |
  An insecure deserialization vulnerability exists in the Jenkins Code Coverage API Plugin
  version 1.4.0 and earlier. The CompatibleObjectInputStream class defines an allowlist of
  safe classes but fails to enforce it during deserialization. The missing resolveClass()
  override allows arbitrary classes on the classpath to be deserialized when the
  CoverageProcessor.recoverCoverageResult() method reads coverage data from disk. This
  enables attackers who can control the serialized coverage file contents to achieve remote
  code execution through gadget chain exploitation.

locations:
- type: crash_site
  path_from_root: plugins/code-coverage-api-plugin/src/main/java/io/jenkins/plugins/coverage/CoverageProcessor.java
  function_name: recoverCoverageResult
  startLine: 733
  startColumn: 1
  endLine: 733
  endColumn: 50
- type: root_cause
  path_from_root: plugins/code-coverage-api-plugin/src/main/java/io/jenkins/plugins/coverage/CompatibleObjectInputStream.java
  function_name: CompatibleObjectInputStream
