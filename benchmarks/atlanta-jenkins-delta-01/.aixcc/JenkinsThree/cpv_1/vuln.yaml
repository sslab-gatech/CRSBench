id: cpv_1

name: Groovy Script Engine Sandbox Bypass via Direct Evaluation

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-94
- CWE-95

description: |
  A script engine injection vulnerability exists in the secureEval method
  of the Script class. The method uses ScriptEngine.eval() to execute
  user-supplied Groovy scripts without properly applying sandbox protection
  during the script compilation phase. Despite the presence of a custom
  GroovySecurityManager and CustomGroovyClassLoader, the sandbox checks can
  be bypassed during evaluation. This allows attackers to execute arbitrary
  code on the Jenkins controller JVM, leading to potential sandbox escape
  and remote code execution.

locations:
