id: cpv_9

name: XPath Injection in Jenkins XMLUtils.getValue()

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-643
- CWE-91

description: |
  An XPath Injection vulnerability exists in the XMLUtils.getValue() method
  in jenkins/core/src/main/java/jenkins/util/xml/XMLUtils.java. The method
  accepts an unsanitized XPath expression as a parameter and directly compiles
  and evaluates it without validation or sanitization. This allows an attacker
  to inject arbitrary XPath expressions into XML queries, potentially leading
  to information disclosure, authentication bypass, or data exfiltration through
  malicious XPath functions like document().

