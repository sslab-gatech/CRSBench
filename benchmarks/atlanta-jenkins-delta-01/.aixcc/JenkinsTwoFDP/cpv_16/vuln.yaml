id: cpv_0

name: "Hidden Backdoor with Authentication Bypass Leading to OS Command Injection"

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-78
- CWE-912
- CWE-798

description: |
  A critical security vulnerability consisting of a hidden backdoor that allows
  attackers to bypass Jenkins administrator authentication and execute arbitrary
  OS commands. The backdoor checks for an HTTP header 'x-evil-backdoor' and
  compares its SHA-256 hash against a hardcoded passphrase "breakin the law".
  If the hash matches, it grants full command execution access without requiring
  Jenkins ADMINISTER permission. Once bypassed, the application accepts arbitrary
  user input through the cmdSeq2 parameter and passes it directly to ProcessBuilder
  without validation, enabling Remote Code Execution (RCE) with Jenkins process
  privileges. This allows attackers to execute system commands, read sensitive
  files, modify Jenkins configuration, and compromise the entire CI/CD pipeline.

