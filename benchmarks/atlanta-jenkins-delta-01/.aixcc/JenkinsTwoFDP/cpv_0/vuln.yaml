id: cpv_0

name: Hidden Backdoor with OS Command Injection via Authentication Bypass

cwes:
- CWE-78
- CWE-912
- CWE-798

description: |
  This critical vulnerability consists of a hidden backdoor that bypasses authentication
  combined with OS command injection. The vulnerable code in the doexecCommandUtils method
  contains a hardcoded backdoor triggered by the HTTP header 'x-evil-backdoor' with a value
  matching the SHA-256 hash of "breakin the law". This backdoor completely bypasses the
  normal Jenkins administrator authentication check. Once bypassed, the application accepts
  arbitrary user input through the cmdSeq2 parameter and passes it directly to ProcessBuilder
  without any validation or sanitization, leading to OS command injection. An attacker can
  execute arbitrary commands with Jenkins process privileges, potentially leading to remote
  code execution, credential theft, system compromise, and lateral movement within the network.
  The vulnerability exists in the UtilMain.java file where createUtils is called from the
  backdoor path at line 154, ultimately executing commands at line 179 via processBuilder.start().

locations:
- path_from_root: plugins/pipeline-util-plugin/src/main/java/io/jenkins/plugins/UtilPlug/UtilMain.java
  function_name: doexecCommandUtils
  startLine: 151
  endLine: 161
- path_from_root: plugins/pipeline-util-plugin/src/main/java/io/jenkins/plugins/UtilPlug/UtilMain.java
  function_name: createUtils
  startLine: 179
  endLine: 179