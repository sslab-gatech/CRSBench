patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
full_mode:
  base_commit: 2bcba622f9ac782d649437c381d2bd520800e106
harness_files:
- name: cms_postscript_fuzzer
  path: $PROJECT/cms_postscript_fuzzer.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: SEGV on unknown address'
- name: cms_virtual_profile_fuzzer
  path: $PROJECT/cms_virtual_profile_fuzzer.c
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'AddressSanitizer: stack-buffer-overflow'
