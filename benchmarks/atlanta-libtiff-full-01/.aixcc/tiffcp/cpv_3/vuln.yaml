id: cpv_3

name: LibTIFF TIFFTAG_INKNAMES Heap Buffer Overflow

author:

validator: Yu-Fu Fu

origin: 1-day

release_date: 12/15/2022

references:
- https://nvd.nist.gov/vuln/detail/CVE-2022-3599
- https://gitlab.com/libtiff/libtiff/-/issues/398
- https://libtiff.gitlab.io/libtiff/releases/v4.5.0.html

cwes:
- CWE-122 # Heap-based Buffer Overflow
- CWE-125 # Out-of-bounds Read
- CWE-787 # Out-of-bounds Write

description: |
  A heap buffer overflow vulnerability exists in the processing of TIFFTAG_INKNAMES
  metadata in LibTIFF. The checkInkNamesString() function in libtiff/tif_dir.c
  improperly validates ink name strings by relying on an expected count rather than
  counting actual ink names present. When a malformed TIFF file provides fewer ink
  names than expected or lacks proper null termination, the function fails validation
  but still allows allocation of an insufficient buffer via _TIFFsetNString(). This
  allocated buffer does not include space for a null terminator. Later, when the
  tiffcp harness retrieves the ink names and calls strlen() to parse them, it reads
  beyond the allocated buffer boundary, causing a heap buffer overflow. This can
  lead to denial of service, information disclosure through heap memory reads, or
  potential arbitrary code execution.

locations:
- type: crash_site
  path_from_root: contrib/oss-fuzz/tiffcp.cc
  function_name: tiffcp
  startLine: 976
  startColumn: 57
  endLine: 976
  endColumn: 57
- type: root_cause
  path_from_root: libtiff/tif_dir.c
  function_name: checkInkNamesString
  startLine: 142
  startColumn: 1
  endLine: 166
  endColumn: 1
