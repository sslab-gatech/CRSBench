id: cpv_3

name: TIFF InkNames Heap Buffer Overflow due to Inconsistent Metadata Validation

cwes:
- CWE-125
- CWE-122
- CWE-20

description: |
  A heap buffer overflow vulnerability occurs when processing TIFF InkNames metadata.
  The vulnerability has two components: insufficient validation in the checkInkNamesString()
  function in libtiff/tif_dir.c and the tiffcp harness trusting unchecked metadata values.
  
  The checkInkNamesString() function does not properly validate that the InkNames string
  buffer contains the expected number of null-terminated strings based on the NUMBEROFINKS
  field. The tiffcp.cc harness retrieves NUMBEROFINKS and INKNAMES from the input TIFF file
  and iterates through ink names by searching for null terminators with strchr() and
  calling strlen() on each ink name.
  
  When a maliciously crafted TIFF file specifies more ink names (via NUMBEROFINKS) than
  actually exist in the INKNAMES buffer, the loop in tiffcp.cc moves past the end of the
  allocated buffer when searching for null terminators, causing strlen() to read beyond
  the allocated heap buffer bounds. This results in a heap buffer overflow read that can
  lead to information disclosure, denial of service, or potential code execution when
  chained with other vulnerabilities.

locations:
- path_from_root: contrib/oss-fuzz/tiffcp.cc
  function_name: tiffcp
  startLine: 976
  startColumn: 57
  endLine: 976
  endColumn: 57
- path_from_root: libtiff/tif_dir.c
  function_name: checkInkNamesString
  startLine: 139
  startColumn: 0
  endLine: 165
  endColumn: 0