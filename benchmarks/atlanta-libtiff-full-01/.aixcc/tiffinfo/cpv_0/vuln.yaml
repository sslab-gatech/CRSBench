id: cpv_0

name: LibTIFF IFD Loop Denial of Service

author:

validator: Yu-Fu Fu

origin: 1-day

release_date: 01/19/2018

references:
- https://nvd.nist.gov/vuln/detail/CVE-2018-5784
- https://gitlab.com/libtiff/libtiff/-/commit/473851d211cf8805a161820337ca74cc9615d6ef
- https://gitlab.com/libtiff/libtiff/-/issues/455
- https://gitlab.com/libtiff/libtiff/-/merge_requests/386

cwes:
- CWE-400 # Uncontrolled Resource Consumption
- CWE-835 # Loop with Unreachable Exit Condition ('Infinite Loop')

description: |
  In LibTIFF 4.0.9, there is an uncontrolled resource consumption in the TIFFSetDirectory function of tif_dir.c.
  Remote attackers could leverage this vulnerability to cause a denial of service via a crafted tif file.
  This occurs because the declared number of directory entries is not validated against the actual number of directory entries.

locations:
  # NOTE: loop in the fuzzing harness
- type: crash_site # timeout bugs => change to the while loop location
  path_from_root: contrib/oss-fuzz/tiffinfo.cc
  function_name: LLVMFuzzerTestOneInput
  startLine: 127
  startColumn: 5
  endLine: 127
  endColumn: 35
- type: root_cause # from gitlab issue and NVD
  path_from_root: libtiff/tif_dir.c
  function_name: TIFFSetDirectory
  startLine: 1699
  startColumn: 1
  endLine: 1699
  endColumn: 25
