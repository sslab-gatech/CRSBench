id: cpv_0

name: LibTIFF IFD Loop Denial of Service

origin: 1-day

release_date: 01/19/2018

references:
- https://nvd.nist.gov/vuln/detail/CVE-2018-5784
- https://gitlab.com/libtiff/libtiff/-/commit/473851d211cf8805a161820337ca74cc9615d6ef
- https://gitlab.com/libtiff/libtiff/-/issues/455
- https://gitlab.com/libtiff/libtiff/-/merge_requests/386

cwes:
- CWE-400
- CWE-835

description: |
  A denial of service vulnerability exists in LibTIFF's Image File Directory (IFD)
  traversal logic. The TIFFAdvanceDirectory function in libtiff/tif_dir.c does not
  detect circular references in IFD chains, allowing specially crafted TIFF files
  to cause infinite loops. When functions like TIFFReadCustomDirectory or
  TIFFNumberOfDirectories traverse the IFD chain, they can get stuck in an infinite
  loop if the chain is circular. This leads to uncontrolled resource consumption,
  causing the application to hang indefinitely and resulting in denial of service.

locations:
- type: crash_site
  path_from_root: libtiff/tif_dirread.c
  function_name: TIFFFetchDirectory
  startLine: 5129
  startColumn: 4
  endLine: 5129
  endColumn: 4
- type: root_cause
  path_from_root: libtiff/tif_dir.c
  function_name: TIFFAdvanceDirectory
  startLine: 1503
  startColumn: 1
  endLine: 1600
  endColumn: 1