id: cpv_0

name: TIFF IFD Loop Infinite Loop Denial of Service

cwes:
- CWE-835
- CWE-400
- CWE-834

description: |
  An infinite loop vulnerability exists in libtiff's IFD (Image File Directory) 
  traversal mechanism. The TIFFCheckDirOffset() function in tif_dirread.c attempts 
  to detect circular IFD references by tracking previously visited directory offsets, 
  but this detection is insufficient. The function only tracks directory offsets 
  without tracking directory numbers, allowing maliciously crafted TIFF files to 
  create circular references between main IFDs and sub-IFDs (EXIF/GPS) that bypass 
  the loop detection. When TIFFReadCustomDirectory() or TIFFReadDirectory() encounters 
  such circular references, it enters an infinite loop, causing a denial of service 
  through CPU exhaustion and application timeout. An attacker can exploit this by 
  crafting a TIFF file with circular IFD pointers (e.g., IFD 0 → IFD 1 → IFD 0) or 
  custom directories that reference each other in a loop, causing applications 
  processing the file to hang indefinitely.

locations:
