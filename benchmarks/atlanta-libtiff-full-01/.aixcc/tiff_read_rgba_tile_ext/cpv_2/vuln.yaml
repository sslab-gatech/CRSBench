id: cpv_2

name: Integer Underflow in TIFFReadRGBATileExt Leading to Out-of-Bounds Access

cwes:
- CWE-191
- CWE-787
- CWE-125

description: |
  An integer underflow vulnerability exists in the TIFFReadRGBATileExt function
  in libtiff's tif_getimage.c. The function fails to validate that the row and
  col parameters are within image bounds before performing unsigned integer
  subtraction operations. When called with row >= img.height or col >= img.width,
  the calculations 'read_ysize = img.height - row' and 'read_xsize = img.width - col'
  produce underflowed values that wrap around to near UINT32_MAX. These underflowed
  values are subsequently used as loop bounds and array offsets in memmove operations,
  resulting in wild pointer dereferences that access memory far outside the allocated
  raster buffer. This can lead to denial of service (segmentation fault), potential
  information disclosure through out-of-bounds reads, and memory corruption through
  out-of-bounds writes. The vulnerability is triggered by malformed TIFF files with
  invalid tile configurations and out-of-bounds row/column parameters.

locations:
- path_from_root: libtiff/tif_getimage.c
  function_name: TIFFReadRGBATileExt
  startLine: 3028
  startColumn: 0
  endLine: 3063
  endColumn: 0