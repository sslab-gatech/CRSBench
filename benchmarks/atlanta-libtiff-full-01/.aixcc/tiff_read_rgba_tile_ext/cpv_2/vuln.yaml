id: cpv_2

name: Missing Bounds Check in TIFFReadRGBATileExt Leading to Heap Buffer Overflow

author:

validator: Yu-Fu Fu

origin: 1-day

release_date: 01/25/2024

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-52356

cwes:
- CWE-787 # Out-of-bounds Write
- CWE-122 # Heap-based Buffer Overflow
- CWE-125 # Out-of-bounds Read

description: |
  A heap buffer overflow vulnerability exists in the TIFFReadRGBATileExt function
  in libtiff/tif_getimage.c. The function fails to validate that the caller-provided
  row and col parameters are within the bounds of the actual image dimensions before
  performing memory operations. When row or col exceed the image dimensions, integer
  underflow occurs during read_ysize/read_xsize calculation, leading to invalid memory
  access during memmove operations. This can result in denial of service through
  segmentation fault or potential arbitrary code execution through heap buffer overflow.

locations:
- type: crash_site
  path_from_root: libtiff/tif_getimage.c
  function_name: TIFFReadRGBATileExt
  startLine: 3061
  startColumn: 9
  endLine: 3061
  endColumn: 9
- type: root_cause # missing checks
  path_from_root: libtiff/tif_getimage.c
  function_name: TIFFReadRGBATileExt
  startLine: 3015
  startColumn: 1
  endLine: 3019
  endColumn: 20
