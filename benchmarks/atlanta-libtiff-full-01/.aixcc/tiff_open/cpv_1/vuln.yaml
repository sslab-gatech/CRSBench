id: cpv_1

name: LibTIFF Excessive Memory Allocation in Strip Array Processing

author:

validator: Yu-Fu Fu

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-770 # Allocation of Resources Without Limits or Throttling
- CWE-400 # Uncontrolled Resource Consumption
- CWE-789 # Memory Allocation with Excessive Size Value

description: |
  An excessive memory allocation vulnerability exists in the allocChoppedUpStripArrays
  function in libtiff/tif_dirread.c. When processing a maliciously crafted TIFF file
  with invalid directory entries specifying an extremely large number of strips, the
  function attempts to allocate memory based on untrusted file metadata without proper
  validation. This allows an attacker to cause a denial of service through memory
  exhaustion by providing a relatively small crafted TIFF file that triggers allocation
  of multiple gigabytes of memory.

locations:
- type: root_cause
  path_from_root: libtiff/tif_dirread.c
  function_name: allocChoppedUpStripArrays
  startLine: 6498
  startColumn: 5
  endLine: 6501
  endColumn: 74
- type: crash_site # the same
  path_from_root: libtiff/tif_dirread.c
  function_name: allocChoppedUpStripArrays
