id: cpv_1

name: Uncontrolled Memory Allocation in libtiff allocChoppedUpStripArrays

cwes:
- CWE-770
- CWE-789
- CWE-400

description: |
  An uncontrolled memory allocation vulnerability exists in libtiff's TIFF directory
  reading functionality. The allocChoppedUpStripArrays function attempts to allocate
  memory for strip arrays based on the nstrips value read from a TIFF file without
  validating that the allocation size is reasonable relative to the actual file size.
  
  A maliciously crafted TIFF file can specify an extremely large number of strips,
  causing the application to attempt allocating multiple gigabytes of memory (e.g.,
  3489662144 bytes as observed in the crash). This leads to out-of-memory conditions,
  application crashes, and denial of service.
  
  The vulnerability is triggered during TIFFReadDirectory when processing malformed
  TIFF files with invalid directory structures and attacker-controlled metadata values.
  The root cause is the lack of sanity checking before calling _TIFFCheckMalloc with
  nstrips * sizeof(uint64_t) bytes for both StripByteCounts and StripOffsets arrays.

locations:
- path_from_root: libtiff/tif_dirread.c
  function_name: allocChoppedUpStripArrays
  startLine: 6498
  startColumn: 29
  endLine: 6501
  endColumn: 0