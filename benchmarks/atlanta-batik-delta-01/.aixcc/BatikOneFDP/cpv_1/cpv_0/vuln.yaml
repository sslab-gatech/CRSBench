id: cpv_0

name: Apache Batik JAR Protocol SSRF Bypass

origin: 1-day

release_date: 09/22/2022

references:
- https://nvd.nist.gov/vuln/detail/CVE-2022-38398
- https://issues.apache.org/jira/browse/BATIK-1331

cwes:
- CWE-918

description: |
  A Server-Side Request Forgery (SSRF) vulnerability exists in Apache Batik
  versions 1.0 through 1.14 in the DefaultExternalResourceSecurity class.
  The security validation logic uses ParsedURL.getHost() to compare the
  document host with the external resource host. However, for JAR protocol
  URLs (e.g., jar:http://attacker.com/malicious.jar!/), the getHost()
  method returns null, bypassing the same-origin security check. An attacker
  can craft a malicious SVG file with a JAR protocol URL to make unauthorized
  HTTP requests to arbitrary servers, potentially exfiltrating sensitive data
  or accessing internal services.

locations:
- type: crash_site
  path_from_root: batik-util/src/main/java/org/apache/batik/util/ParsedURLData.java
  function_name: openStreamInternal
  startLine: 554
  startColumn: 0
  endLine: 554
  endColumn: 0
- type: root_cause
  path_from_root: batik-bridge/src/main/java/org/apache/batik/bridge/DefaultExternalResourceSecurity.java
  function_name: DefaultExternalResourceSecurity
  startLine: 82
  startColumn: 0
  endLine: 96
  endColumn: 0