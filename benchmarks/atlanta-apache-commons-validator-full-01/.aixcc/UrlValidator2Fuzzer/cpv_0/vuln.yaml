id: cpv_0

name: ReDoS in UrlValidator DOMAIN_PATTERN

origin: synthetic

release_date: 01/15/2024

references: []

cwes:
- CWE-1333
- CWE-400
- CWE-770

description: |
  A Regular Expression Denial of Service (ReDoS) vulnerability exists in the
  DOMAIN_PATTERN regex used by Apache Commons Validator's UrlValidator class.
  The pattern uses nested quantifiers that cause catastrophic backtracking when
  processing specially crafted inputs with alternating dots and valid characters.
  This leads to excessive CPU consumption and stack overflow, resulting in
  application crash or hang. An attacker can exploit this by providing malicious
  URL inputs to cause denial of service.

locations:
