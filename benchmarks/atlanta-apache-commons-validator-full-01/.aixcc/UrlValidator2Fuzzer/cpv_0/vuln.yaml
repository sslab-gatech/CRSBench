id: cpv_0

name: Regular Expression Denial of Service in URL Domain Validator

cwes:
- CWE-1333
- CWE-400
- CWE-674

description: |
  A Regular Expression Denial of Service (ReDoS) vulnerability exists in the Apache Commons 
  Validator's URL validation logic. The DOMAIN_PATTERN regex used in the isValidAuthority 
  method contains nested quantifiers that cause catastrophic backtracking when processing 
  specially crafted domain strings.
  
  The vulnerable pattern ^[^\s;/@&=,.?:+$]+(\.[^\s;/@&=,.?:+$]+)*$ uses both an inner 
  greedy quantifier (+) and an outer greedy quantifier (*) on a capturing group. When given 
  input with many alternating valid characters and dots (e.g., "0.0.0A.00.0A.0.A00..."), 
  the regex engine attempts exponentially many backtracking combinations, leading to stack 
  overflow and application crash.
  
  An attacker can trigger this vulnerability by submitting URLs with crafted domain parts 
  containing repetitive patterns, causing denial of service through resource exhaustion and 
  stack overflow errors.

locations:
- path_from_root: src/main/java/org/apache/commons/validator/UrlValidator.java
  function_name: isValidAuthority
  startLine: 313
  startColumn: 0
  endLine: 313
  endColumn: 0