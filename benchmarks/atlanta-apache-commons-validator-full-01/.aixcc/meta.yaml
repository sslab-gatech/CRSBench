patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

full_mode:
  base_commit: 4ac623ec9f0930b76d046091f5dbceede72d0b1a

harness_files:
- name: CreditCardValidatorFuzzer
  path: $PROJECT/CreditCardValidatorFuzzer.java

- name: IBANValidatorFuzzer
  path: $PROJECT/IBANValidatorFuzzer.java

- name: UrlValidator2Fuzzer
  path: $PROJECT/UrlValidator2Fuzzer.java
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: '== Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueLow: Stack overflow'

- name: UrlValidatorFuzzer
  path: $PROJECT/UrlValidatorFuzzer.java
