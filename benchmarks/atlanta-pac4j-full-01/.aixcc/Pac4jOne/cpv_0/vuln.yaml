id: cpv_0

name: Java RMI Deserialization SSRF in pac4j InternalAttributeHandler

cwes:
- CWE-502
- CWE-918

description: |
  Server-Side Request Forgery (SSRF) vulnerability through insecure Java deserialization in pac4j's InternalAttributeHandler.
  The vulnerability occurs when user-controlled input with the {#sb64} prefix is deserialized via JavaSerializationHelper.
  Although RestrictedObjectInputStream attempts to block proxy class resolution, this protection is bypassed when RMI remote 
  objects are deserialized. The automatic network connection triggered by java.rmi.server.RemoteObject.readObject() occurs 
  during deserialization before any validation, allowing attackers to force the server to make arbitrary network connections.
  The trusted packages list includes "java." which permits java.rmi.* classes to be deserialized, enabling exploitation.
  This can lead to internal network enumeration, data exfiltration, access to cloud metadata services, and abuse of internal 
  services that trust the application server.

locations:
- path_from_root: pac4j-core/src/main/java/org/pac4j/core/profile/InternalAttributeHandler.java
  function_name: restore
  startLine: 95
  startColumn: 0
  endLine: 95
  endColumn: 0
- path_from_root: pac4j-core/src/main/java/org/pac4j/core/util/JavaSerializationHelper.java
  function_name: deserializeFromBytes
  startLine: 82
  startColumn: 0
  endLine: 82
  endColumn: 0