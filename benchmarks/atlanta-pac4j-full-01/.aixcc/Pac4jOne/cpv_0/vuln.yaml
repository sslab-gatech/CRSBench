id: cpv_0

name: Unsafe Deserialization Leading to SSRF via RMI Objects

origin: 1-day

release_date: 10/10/2024

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-25581
- https://github.com/advisories/GHSA-76mw-6p95-x9x5
- https://securitylab.github.com/advisories/GHSL-2022-085_pac4j/

cwes:
- CWE-502
- CWE-918

description: |
  An unsafe deserialization vulnerability exists in pac4j-core prior to version 4.0.0.
  The InternalAttributeHandler.restore() method deserializes Base64-encoded Java objects
  from user-controlled attributes without proper validation. The RestrictedObjectInputStream
  class fails to block dangerous Java built-in classes like java.rmi.*, java.net.*, and
  sun.rmi.*, allowing attackers to craft malicious serialized RMI objects that trigger
  network connections during deserialization. This enables Server-Side Request Forgery
  (SSRF) attacks and potentially Remote Code Execution (RCE) through gadget chains.

locations:
- type: crash_site
  path_from_root: pac4j-core/src/main/java/org/pac4j/core/profile/InternalAttributeHandler.java
  function_name: restore
  startLine: 95
  startColumn: 1
  endLine: 95
  endColumn: 80
- type: root_cause
  path_from_root: pac4j-core/src/main/java/org/pac4j/core/util/JavaSerializationHelper.java
  function_name: resolveClass
  startLine: 153
  startColumn: 1
  endLine: 163
  endColumn: 80