id: cpv_0

name: Spring Expression Language (SpEL) String Repetition DoS

origin: 1-day

release_date: 03/23/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-20861
- https://spring.io/security/cve-2023-20861/
- https://www.code-intelligence.com/blog/expression-dos-spring

cwes:
- CWE-400
- CWE-770

description: |
  A Denial of Service (DoS) vulnerability exists in the Spring Framework's
  Spring Expression Language (SpEL) parser. The OpMultiply class allows
  string repetition using the multiply operator without validating the
  resulting string length. An attacker can provide a malicious SpEL
  expression with a string and very large integer (e.g., 'xyz' * 941859717)
  causing the application to attempt allocating an enormous string, resulting
  in an OutOfMemoryError and application crash.

locations:
- type: crash_site
  path_from_root: spring-expression/src/main/java/org/springframework/expression/spel/ast/OpMultiply.java
  function_name: getValueInternal
  startLine: 109
  startColumn: 1
  endLine: 109
  endColumn: 50