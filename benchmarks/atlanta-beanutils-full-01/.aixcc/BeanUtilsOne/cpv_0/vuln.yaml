id: cpv_0

name: Apache Commons BeanUtils ClassLoader Access via Class Property

origin: 1-day

release_date: 08/20/2019

references:
- https://nvd.nist.gov/vuln/detail/CVE-2019-10086
- https://github.com/advisories/GHSA-wxr5-93ph-8wr9

cwes:
- CWE-284
- CWE-470
- CWE-502

description: |
  A vulnerability in Apache Commons BeanUtils versions 1.0 through 1.9.3 allows
  attackers to access the ClassLoader through the "class" property. The 
  PropertyUtilsBean does not enable the SuppressPropertiesBeanIntrospector.SUPPRESS_CLASS
  introspector by default, allowing attackers to craft malicious property paths like
  "class.classLoader" to access the ClassLoader, load arbitrary classes, and achieve
  arbitrary file access or code execution. This occurs because resetBeanIntrospectors()
  does not add the class property suppression introspector to the introspectors list.

locations:
- type: root_cause
  path_from_root: src/main/java/org/apache/commons/beanutils/PropertyUtilsBean.java
  function_name: resetBeanIntrospectors
  startLine: 188
  startColumn: 1
  endLine: 191
  endColumn: 6