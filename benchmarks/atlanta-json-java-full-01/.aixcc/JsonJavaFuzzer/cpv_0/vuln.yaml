id: cpv_0

name: JSON-Java Nested Object Key Memory Exhaustion

origin: 1-day

release_date: 10/12/2023

references:
- https://nvd.nist.gov/vuln/detail/CVE-2023-5072
- https://github.com/advisories/GHSA-4jq9-2xhw-jpx7
- https://github.com/stleary/JSON-java/issues/505

cwes:
- CWE-770
- CWE-400
- CWE-674

description: |
  A Denial of Service vulnerability in the JSON-Java library allows attackers
  to cause memory exhaustion through specially crafted JSON input. The parser
  incorrectly allows JSON objects to be used as dictionary keys, violating the
  JSON specification. When nested objects become keys, the parser converts them
  to strings via toString() and quote() methods. Each nesting level causes
  escape characters to multiply exponentially, leading to OutOfMemoryError.
  A modest 367-character input can trigger indefinite memory consumption,
  crashing the application. Unauthenticated remote attackers can exploit this
  without user interaction (CVSS 7.5 HIGH).

