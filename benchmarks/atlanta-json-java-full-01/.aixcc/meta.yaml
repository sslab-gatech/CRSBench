patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
full_mode:
  base_commit: a07ec34266e05e78c2e0999836cda80cb94b02c3
harness_files:
- name: JsonJavaFuzzer
  path: $PROJECT/JsonJavaFuzzer.java
  vulns:
