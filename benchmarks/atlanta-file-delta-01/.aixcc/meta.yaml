patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
delta_mode:
  base_commit: 201c577b72e03bc0a098fe3382d4de57eeb6dade
  ref_commit: c7c244f360287c7079cae6f9af7b3d663580fcc6
full_mode:
  base_commit: c7c244f360287c7079cae6f9af7b3d663580fcc6
harness_files:
- name: magic_fuzzer
  path: $PROJECT/magic_fuzzer.cc
- name: magic_fuzzer_fd
  path: $PROJECT/magic_fuzzer_fd.cc
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: stack-buffer-overflow'
- name: magic_fuzzer_loaddb
  path: $PROJECT/magic_fuzzer_loaddb.cc
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: libFuzzer: timeout'
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: ABRT'
  - vuln_keyword: cpv_3
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: SEGV'
