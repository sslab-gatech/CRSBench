id: cpv_2

name: Abort on Duplicate Magic Entry in apprentice_sort

origin: 1-day

release_date: 04/06/2024

cwes:
- CWE-617
- CWE-703

description: |
  A denial of service vulnerability exists in the apprentice_sort function
  in src/apprentice.c. When two magic entries have identical strength values
  and identical memory content, the comparison function calls abort(), 
  immediately terminating the program. An attacker can craft a malicious 
  magic database file containing duplicate magic entries to trigger this
  condition, causing a denial of service.

locations:
- type: crash_site
  path_from_root: src/apprentice.c
  function_name: apprentice_sort
  startLine: 1143
  endLine: 1143
