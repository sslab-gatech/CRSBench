id: cpv_2

name: Denial of Service via Duplicate Magic Entry Abort

cwes:
- CWE-703
- CWE-730
- CWE-624

description: |
  A denial of service vulnerability exists in the apprentice_sort() function in src/apprentice.c.
  When processing magic database files, if two entries have identical strength values and identical
  content in their struct magic structures, the function calls abort(), immediately terminating
  the program with SIGABRT. This occurs during the qsort() operation when loading magic databases
  via file_apprentice() → apprentice_load() → apprentice_sort(). An attacker can craft a malicious
  magic database file containing duplicate entries to trigger this condition, causing complete
  application termination. The vulnerability affects any code path that loads untrusted magic
  database files.

locations:
- path_from_root: src/apprentice.c
  function_name: apprentice_sort
  startLine: 1143
  startColumn: 0
  endLine: 1143
  endColumn: 0