id: cpv_1

name: Regular Expression Denial of Service via Cascading Repetition Operators in check_regex

origin: 1-day

release_date: 06/10/2024

cwes:
- CWE-1333
- CWE-400
- CWE-407

description: |
  A Regular Expression Denial of Service (ReDoS) vulnerability exists in the
  check_regex() function in src/funcs.c. The function validates regex patterns
  before compilation but only checks for consecutive repetition of the same
  operator (e.g., **, ++), allowing malicious patterns with different repetition
  operators in sequence (e.g., *+, +*, .*+*+*+) to pass validation. When such
  patterns are passed to the POSIX regcomp() function, they cause catastrophic
  backtracking with exponential time complexity, resulting in process hangs and
  denial of service. An attacker can exploit this by crafting a malicious magic
  database file containing regex patterns with cascading repetition operators.

locations:
- type: crash_site
  path_from_root: src/funcs.c
  function_name: file_regcomp
  startLine: 734
  endLine: 734
- type: root_cause
  path_from_root: src/funcs.c
  function_name: check_regex
  startLine: 681
  endLine: 681
