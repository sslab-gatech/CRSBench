id: cpv_1

name: Regular Expression Denial of Service via Cascading Repetition Operators

cwes:
- CWE-1333
- CWE-400
- CWE-185

description: |
  A Regular Expression Denial of Service (ReDoS) vulnerability exists in the libmagic
  file type identification library. The vulnerability occurs in the check_regex() function
  in src/funcs.c, which performs insufficient validation of regular expression patterns
  before compiling them with regcomp().
  
  The validation logic only detects identical consecutive repetition operators (e.g., **
  or ++) but fails to catch different repetition operators in sequence (e.g., *+, +*, *{)
  or cascading patterns like .*+*+*+*+]. When a malicious magic database file contains
  regex patterns with cascading repetition operators, it causes catastrophic backtracking
  in the regex engine, resulting in timeouts exceeding 25 seconds, CPU exhaustion, and
  application hangs.
  
  The vulnerability is triggered when loading magic database files through the
  magic_fuzzer_loaddb harness. Malicious patterns like "0regex.*+*+*+*+]+*+*]&" bypass
  the weak validation and cause the regex engine to explore exponential combinations
  during compilation, leading to denial of service conditions.

locations:
- path_from_root: src/funcs.c
  function_name: check_regex
  startLine: 681
  startColumn: 0
  endLine: 681
  endColumn: 0
- path_from_root: src/funcs.c
  function_name: file_regcomp
  startLine: 734
  startColumn: 7
  endLine: 734
  endColumn: 7