id: cpv_3

name: NULL pointer dereference in file_magwarn function

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-476

description: |
  A NULL pointer dereference vulnerability exists in the file_magwarn function
  in src/print.c. The function accepts a struct magic_set pointer parameter but
  fails to validate whether it is NULL before dereferencing it. When processing
  magic files with FILE_DEFAULT type that have unsupported factor_op values,
  the apprentice_magic_strength_1 function explicitly passes NULL to file_magwarn,
  causing a segmentation fault at offset 0x64 when attempting to access the
  magwarn field. This leads to denial of service when loading maliciously crafted
  magic database files.

