id: cpv_0

name: Stack Buffer Overflow in ELF PT_INTERP Segment Parser

cwes:
- CWE-121
- CWE-787
- CWE-805

description: |
  A stack-based buffer overflow vulnerability exists in the dophn_exec function
  when parsing PT_INTERP segments in ELF files. The interp buffer is allocated
  with only 128 bytes on the stack, but the code attempts to copy up to 8192
  bytes (BUFSIZ) into it using memcpy() without proper bounds checking. When
  processing a malformed ELF file with a large PT_INTERP segment, the code reads
  up to 8192 bytes into the nbuf buffer and then copies the entire content to
  the undersized interp buffer at line 1765, causing a stack buffer overflow of
  up to 8064 bytes. This can lead to memory corruption, arbitrary code execution,
  or denial of service. The vulnerability is triggered when the file command
  processes untrusted ELF files, making it exploitable in security-sensitive
  contexts such as malware scanning or file type detection systems.

locations:
- path_from_root: src/readelf.c
  function_name: dophn_exec
  startLine: 1765
  startColumn: 5
  endLine: 1765
  endColumn: 5