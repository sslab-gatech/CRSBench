id: cpv_0

name: Stack Buffer Overflow in dophn_exec PT_INTERP Handler

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-121
- CWE-787

description: |
  A stack-based buffer overflow vulnerability exists in the dophn_exec function
  in src/readelf.c when processing ELF files with PT_INTERP program headers.
  The interp buffer is declared with a fixed size of 128 bytes, but the code
  attempts to copy up to BUFSIZ (8192 bytes) from nbuf into it without proper
  bounds checking. This allows an attacker to overflow the stack buffer by
  providing a specially crafted ELF file with a large PT_INTERP section,
  potentially leading to denial of service or arbitrary code execution.

locations:
