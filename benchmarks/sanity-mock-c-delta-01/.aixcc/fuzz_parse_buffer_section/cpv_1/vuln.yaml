id: cpv_1

name: Unchecked Index Heap Buffer Overflow in parse_buffer_section

cwes:
- CWE-122
- CWE-787
- CWE-119

description: |
  A heap buffer overflow vulnerability exists in the parse_buffer_section function
  in mock.c at line 22. The function allocates a heap buffer of buf_size bytes but
  uses an unchecked idx value as an offset when copying data via memcpy. When idx
  is greater than 0, the memcpy operation writes beyond the allocated buffer
  boundaries. For example, if buf_size=16 and idx=16, memcpy writes to buf[16]
  through buf[31], but only buf[0] through buf[15] were allocated. This allows an
  attacker to corrupt adjacent heap memory, potentially leading to arbitrary code
  execution, denial of service, or information disclosure.

locations:
- path_from_root: mock.c
  function_name: parse_buffer_section
  startLine: 22
  startColumn: 3
  endLine: 22
  endColumn: 3