id: cpv_0

name: Stack Buffer Overflow in process_input_header Function

cwes:
- CWE-121
- CWE-787
- CWE-805

description: |
  A stack-based buffer overflow vulnerability exists in the process_input_header function
  in mock.c. The function allocates a 64-byte buffer on the stack but fails to validate
  that the size parameter does not exceed the buffer capacity before performing a memcpy
  operation. The only validation checks that size > 0 and data[0] == 'A', but does not
  verify that size <= sizeof(buf). An attacker can trigger this vulnerability by providing
  input larger than 64 bytes that starts with 'A', resulting in a stack buffer overflow
  that can corrupt adjacent stack memory, overwrite return addresses, and potentially
  lead to arbitrary code execution.

locations:
- path_from_root: mock.c
  function_name: process_input_header
  startLine: 11
  startColumn: 7
  endLine: 11
  endColumn: 7