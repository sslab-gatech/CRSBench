patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

delta_mode:
  base_commit: 39ce264d546f93a0ddb7a1d7987670b8b905c165
  ref_commit: 18b113539bd324a69d31c6954282c9d7bccdd427

full_mode:
  base_commit: 18b113539bd324a69d31c6954282c9d7bccdd427

harness_files:
- name: api
  path: $REPO/fuzz/api.c

- name: html
  path: $REPO/fuzz/html.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'

- name: lint
  path: $REPO/fuzz/lint.c

- name: reader
  path: $REPO/fuzz/reader.c

- name: regexp
  path: $REPO/fuzz/regexp.c

- name: schema
  path: $REPO/fuzz/schema.c

- name: uri
  path: $REPO/fuzz/uri.c

- name: valid
  path: $REPO/fuzz/valid.c

- name: xinclude
  path: $REPO/fuzz/xinclude.c

- name: xml
  path: $REPO/fuzz/xml.c

- name: xpath
  path: $REPO/fuzz/xpath.c
