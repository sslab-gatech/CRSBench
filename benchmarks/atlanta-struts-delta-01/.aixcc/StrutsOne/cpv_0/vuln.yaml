id: cpv_0

name: Expression Language Injection in Apache Tiles Attribute setValue

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-917
- CWE-94

description: |
  An Expression Language (EL) injection vulnerability exists in the Apache Tiles
  framework's Attribute.setValue() method. The method automatically converts string
  values into EL expressions with insufficient escaping, allowing attackers to inject
  malicious EL code. When the expression is later evaluated by ELAttributeEvaluator.evaluate(),
  it executes with full application context access, enabling remote code execution.
  Attackers can use alternative EL syntax (#{...}) to bypass the insufficient escaping
  mechanism and achieve arbitrary code execution, data exfiltration, and complete
  system compromise.

locations:
- type: root_cause
  path_from_root: plugins/tiles/src/main/java/org/apache/tiles/api/Attribute.java
  function_name: setValue
  startLine: 235
  startColumn: 1
  endLine: 244
  endColumn: 6
- type: crash_site
  path_from_root: plugins/tiles/src/main/java/org/apache/tiles/el/ELAttributeEvaluator.java
  function_name: evaluate
  startLine: 82
  startColumn: 1
  endLine: 91
  endColumn: 6