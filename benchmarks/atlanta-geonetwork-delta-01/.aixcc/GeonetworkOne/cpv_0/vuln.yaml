id: cpv_0

name: GeoNetwork LocalFilesystem Harvester OS Command Injection via beforeScript

cwes:
- CWE-78
- CWE-88
- CWE-74

description: |
  Critical OS Command Injection vulnerability in the GeoNetwork LocalFilesystem harvester component.
  The vulnerability exists in the runBeforeScript() method which executes arbitrary shell commands
  based on user-controlled XML input without proper validation or sanitization.
  
  The vulnerable code extracts a <beforeScript> element from XML configuration, naively splits it
  by spaces, and passes it directly to ProcessBuilder for execution. An attacker can craft malicious
  XML input to inject arbitrary OS commands, leading to remote code execution with the privileges
  of the GeoNetwork application.
  
  This enables attackers to execute system commands, exfiltrate sensitive data, compromise the host
  system, perform lateral movement, or cause denial of service. The vulnerability is exploitable
  through harvester configuration without requiring authentication to the underlying system.

locations:
- path_from_root: harvesters/src/main/java/org/fao/geonet/kernel/harvest/harvester/localfilesystem/LocalFilesystemHarvester.java
  function_name: runBeforeScript
  startLine: 242
  startColumn: 5
  endLine: 242
  endColumn: 5