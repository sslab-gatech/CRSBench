id: cpv_0

name: OS Command Injection in Local Filesystem Harvester Before-Script

origin: 1-day

release_date: 09/05/2022

references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-28398
- https://github.com/geonetwork/core-geonetwork/security/advisories/GHSA-cf8p-c88c-h9jf

cwes:
- CWE-78
- CWE-94
- CWE-676

description: |
  An OS Command Injection vulnerability exists in the runBeforeScript() method
  of the LocalFilesystemHarvester class. The method takes user-controlled input
  from params.beforeScript, performs a simple split on spaces, and directly
  passes the resulting array to ProcessBuilder.start() without any validation
  or sanitization. An authenticated administrator can craft malicious XML input
  containing arbitrary OS commands in the <beforeScript> element, which will be
  executed on the server with the privileges of the GeoNetwork process. This
  can lead to remote code execution, complete system compromise, data theft,
  or denial of service.

locations:
