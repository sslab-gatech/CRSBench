id: cpv_0

name: "Polymorphic Deserialization - JNDIConnectionPool Gadget (CVE-2020-14060)"

origin: 1-day

release_date: 06/14/2020

references:
- https://nvd.nist.gov/vuln/detail/CVE-2020-14060
- https://github.com/FasterXML/jackson-databind/issues/2469

cwes:
- CWE-502
- CWE-918

description: |
  A polymorphic deserialization vulnerability in Jackson Databind allows
  remote attackers to perform Server-Side Request Forgery (SSRF) or achieve
  Remote Code Execution through the org.apache.xalan.lib.sql.JNDIConnectionPool
  gadget class. When polymorphic typing is enabled, Jackson can be tricked
  into instantiating arbitrary classes specified in JSON payloads. The
  JNDIConnectionPool class performs JNDI lookups during deserialization,
  allowing attackers to trigger connections to malicious LDAP/RMI servers
  that can return serialized objects leading to code execution.

