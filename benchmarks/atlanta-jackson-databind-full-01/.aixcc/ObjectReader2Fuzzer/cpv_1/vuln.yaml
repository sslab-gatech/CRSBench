id: cpv_1

name: Deep Wrapper Array Nesting in Primitive Deserializers

origin: 1-day

release_date: 10/02/2022

references:
- https://nvd.nist.gov/vuln/detail/CVE-2022-42003
- https://github.com/FasterXML/jackson-databind/issues/3590
- https://github.com/advisories/GHSA-jjjh-jjxp-wpff
- https://osv.dev/vulnerability/CVE-2022-42003

cwes:
- CWE-674
- CWE-400

description: |
  A stack overflow vulnerability exists in the Jackson-databind library's
  StdDeserializer._parseBooleanPrimitive() method. When the UNWRAP_SINGLE_VALUE_ARRAYS
  deserialization feature is enabled, the method recursively unwraps nested arrays
  without any depth limitation. An attacker can provide a maliciously crafted JSON
  input with excessive array nesting, causing each nested array level to trigger
  another recursive call. This leads to stack exhaustion and denial of service
  through uncontrolled recursion.

locations:
