patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

full_mode:
  base_commit: e0057d507c8cd9a05f8d4bf5a31b2ab6ed497695

harness_files:
- name: AdaLObjectReader3Fuzzer
  path: $PROJECT/AdaLObjectReader3Fuzzer.java
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueMedium: Server Side Request Forgery
        (SSRF)'

- name: ConvertValueFuzzer
  path: $PROJECT/ConvertValueFuzzer.java

- name: ObjectReader2Fuzzer
  path: $PROJECT/ObjectReader2Fuzzer.java
  vulns:
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'Java Exception: com.code_intelligence.jazzer.api.FuzzerSecurityIssueLow: Stack overflow'

- name: ObjectReaderFuzzer
  path: $PROJECT/ObjectReaderFuzzer.java

- name: ObjectReaderRandomClassFuzzer
  path: $PROJECT/ObjectReaderRandomClassFuzzer.java

- name: ObjectWriterFuzzer
  path: $PROJECT/ObjectWriterFuzzer.java

- name: ReadTreeFuzzer
  path: $PROJECT/ReadTreeFuzzer.java