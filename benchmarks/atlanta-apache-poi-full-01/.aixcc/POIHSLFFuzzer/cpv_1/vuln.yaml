id: cpv_1

name: Uncontrolled Resource Consumption in EscherContainerRecord Parsing

cwes:
- CWE-770
- CWE-400
- CWE-789

description: |
  A Denial of Service vulnerability exists in Apache POI's HSLF (PowerPoint Slide Show Format) 
  parser when processing maliciously crafted Escher drawing records. The EscherContainerRecord.fillFields() 
  method parses child records in a loop without limiting the total number of sibling child records 
  at each nesting level. While the code checks for excessive nesting depth (MAX_NESTED_CHILD_NODES = 1000), 
  it does not limit the number of children at a single level. A malicious PowerPoint file can specify 
  an extremely large number of child records, causing unbounded ArrayList growth in _childRecords, 
  excessive object allocation (EscherMetafileBlip and other record types), memory exhaustion, and 
  GC thrashing leading to OutOfMemoryError. This results in application crash or unresponsiveness.

