id: cpv_1

name: Apache POI EscherContainerRecord unbounded child record allocation denial of service

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-770
- CWE-400
- CWE-789

description: |
  A denial of service vulnerability exists in Apache POI's Escher record parsing
  logic. The EscherContainerRecord class allows unlimited child records to be added
  without any bounds checking in the addChildRecord() and setChildRecords() methods.
  When processing a maliciously crafted PowerPoint file with excessive nested Escher
  container records, the parser recursively adds child records until the JVM exhausts
  available memory, resulting in an OutOfMemoryError with "GC overhead limit exceeded".
  This allows an attacker to cause application crashes and denial of service by
  providing a specially crafted PPT file.

