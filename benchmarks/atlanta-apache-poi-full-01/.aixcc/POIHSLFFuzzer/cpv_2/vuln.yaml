id: cpv_2

name: Unbounded Memory Allocation in HSLFSlideShowImpl Picture Processing

origin: synthetic

release_date: 01/01/2024

cwes:
- CWE-770
- CWE-400

description: |
  A resource exhaustion vulnerability exists in the readPictures method of
  HSLFSlideShowImpl.java in Apache POI's PowerPoint (HSLF) processing functionality.
  The method reads picture data from PowerPoint files without imposing a maximum
  size limit on memory allocation. A maliciously crafted PowerPoint file can
  specify an extremely large size value for the Pictures stream entry, causing
  the method to attempt to allocate unbounded memory, leading to Java heap space
  exhaustion and denial of service.

locations:
- type: crash_site
  path_from_root: poi-scratchpad/src/main/java/org/apache/poi/hslf/usermodel/HSLFSlideShowImpl.java
  function_name: readPictures
  startLine: 414
  startColumn: 0
  endLine: 414
  endColumn: 0