id: cpv_3

name: Apache POI HDGF Uncontrolled Recursion in PointerContainingStream

origin: synthetic

release_date: 04/06/2025

references:
- https://bz.apache.org/bugzilla/show_bug.cgi?id=66425
- https://www.mail-archive.com/commits@poi.apache.org/msg16820.html
- https://poi.apache.org/changes.html

cwes:
- CWE-674
- CWE-400
- CWE-770

description: |
  An uncontrolled recursion vulnerability exists in Apache POI's HDGF (Visio file format)
  parsing component. When processing maliciously crafted Visio (.vsd) files with deeply
  nested pointer-containing streams, the PointerContainingStream.findChildren() method
  recursively processes child streams without effectively enforcing the MAX_CHILDREN_NESTING
  limit. The vulnerable code checks if nesting exceeds the limit and logs a warning, but
  only returns from the current recursion level after memory has already been allocated for
  all nested calls. This leads to GC overhead from managing deeply nested objects, causing
  an OutOfMemoryError and denial of service.

locations:
- type: root_cause
  path_from_root: poi-scratchpad/src/main/java/org/apache/poi/hdgf/streams/PointerContainingStream.java
  function_name: findChildren
  startLine: 70
  startColumn: 0
  endLine: 76
  endColumn: 0