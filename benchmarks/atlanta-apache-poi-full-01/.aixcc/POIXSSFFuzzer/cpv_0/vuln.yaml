id: cpv_0

name: Apache POI ReadOnlySharedStringsTable Uncontrolled Memory Allocation

origin: 1-day

release_date: 01/26/2024

references:
- https://issues.oss-fuzz.com/42532341
- https://www.mail-archive.com/commits@poi.apache.org/msg16524.html

cwes:
- CWE-789
- CWE-400
- CWE-770

description: |
  A memory allocation vulnerability exists in Apache POI's ReadOnlySharedStringsTable
  class when parsing XLSX files. The startElement function reads the uniqueCount
  attribute from an untrusted XML file and directly uses it to allocate an ArrayList
  without validation or bounds checking. An attacker can craft a malicious XLSX file
  with an extremely large uniqueCount value (e.g., 2 billion), causing the application
  to attempt allocating excessive memory and triggering an OutOfMemoryError. This
  leads to denial of service through resource exhaustion.

locations:
- type: root_cause
  path_from_root: poi-ooxml/src/main/java/org/apache/poi/xssf/eventusermodel/ReadOnlySharedStringsTable.java
  function_name: startElement
  startLine: 251
  startColumn: 13
  endLine: 251
  endColumn: 60