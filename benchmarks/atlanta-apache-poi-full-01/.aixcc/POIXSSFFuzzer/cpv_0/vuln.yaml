id: cpv_0

name: Uncontrolled Memory Allocation in XSSF Shared Strings Table Parser

cwes:
- CWE-770
- CWE-789
- CWE-400

description: |
  An uncontrolled memory allocation vulnerability exists in the ReadOnlySharedStringsTable
  class of Apache POI's XSSF event-based parser. When parsing Excel XLSX files, the code
  reads the uniqueCount attribute from the sharedStrings.xml file and directly uses this
  value to pre-allocate an ArrayList without validation. A maliciously crafted XLSX file
  can specify an extremely large uniqueCount value (e.g., Integer.MAX_VALUE), causing the
  ArrayList constructor to attempt allocating massive amounts of memory, resulting in an
  OutOfMemoryError. This leads to application crashes and denial of service. The vulnerability
  can be exploited by attackers who can supply crafted XLSX files to applications that process
  untrusted documents, causing resource exhaustion and service disruption.

locations:
- path_from_root: poi-ooxml/src/main/java/org/apache/poi/xssf/eventusermodel/ReadOnlySharedStringsTable.java
  function_name: startElement
  startLine: 251
  startColumn: 0
  endLine: 251
  endColumn: 0