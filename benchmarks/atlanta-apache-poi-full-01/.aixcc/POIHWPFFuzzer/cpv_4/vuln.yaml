id: cpv_4

name: Apache POI HWPF Bullet Text Memory Exhaustion

origin: synthetic

release_date: 01/11/2025

references:
- https://issues.oss-fuzz.com/issues/42537720

cwes:
- CWE-400
- CWE-770
- CWE-789

description: |
  A denial of service vulnerability exists in the AbstractWordUtils.getBulletText()
  method when processing Word documents with malicious list formatting. The method
  fails to validate or limit the size of generated bullet text before appending to
  a StringBuilder. When a crafted document specifies large numbering values with
  Roman numeral formatting, the NumberFormatter generates extremely long strings
  (e.g., thousands of 'M' characters), causing uncontrolled memory allocation and
  eventual OutOfMemoryError. A small 56KB malicious .doc file can consume all
  available heap space, resulting in application crash.

locations:
- type: crash_site
  path_from_root: poi-scratchpad/src/main/java/org/apache/poi/hwpf/converter/WordToTextConverter.java
  function_name: getText
  startLine: 178
  startColumn: 0
  endLine: 178
  endColumn: 0
- type: root_cause
  path_from_root: poi-scratchpad/src/main/java/org/apache/poi/hwpf/converter/AbstractWordUtils.java
  function_name: getBulletText
