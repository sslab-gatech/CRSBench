id: cpv_1

name: Array Index Out of Bounds in Template Expression Parser

cwes:
- CWE-129
- CWE-20

description: |
  An ArrayIndexOutOfBoundsException occurs in the Feign template expression parser when
  processing variable names containing a colon character. The vulnerability is triggered
  when input contains a template expression with an empty variable name but includes a
  colon delimiter (e.g., "{:}" or "{:pattern}"). 
  
  The root cause is in Expressions.create() where the code splits variable names on the
  colon character to separate variable names from patterns. When split(":") is called on
  a string that is just ":", Java's split() method produces an empty array. The subsequent
  attempt to access parts[0] throws an ArrayIndexOutOfBoundsException.
  
  This vulnerability causes a denial-of-service condition where any API endpoint or
  functionality accepting user-controlled template strings can be crashed with specially
  crafted input like "{:}". The crash is 100% reproducible and allows attackers to
  reliably disrupt application availability.

locations:
- path_from_root: core/src/main/java/feign/template/Expressions.java
  function_name: create
  startLine: 85
  startColumn: 5
  endLine: 85
  endColumn: 5