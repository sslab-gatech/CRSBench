id: cpv_1

name: ArrayIndexOutOfBounds in Template Expression Parser

origin: 1-day

release_date: 09/05/2023

references:
- https://github.com/OpenFeign/feign/pull/2146
- https://github.com/OpenFeign/feign/releases/tag/12.5

cwes:
- CWE-129
- CWE-20

description: |
  An ArrayIndexOutOfBoundsException vulnerability exists in the Expressions.create()
  method when processing template expressions containing colons. The code uses
  String.split(":") without a limit parameter when parsing variable names. When the
  input is a single colon or starts with a colon (e.g., {:} or {::}), the split
  operation produces an empty array. Accessing parts[0] and parts[1] without bounds
  checking causes an ArrayIndexOutOfBoundsException, leading to application crash
  and denial of service.

locations:
