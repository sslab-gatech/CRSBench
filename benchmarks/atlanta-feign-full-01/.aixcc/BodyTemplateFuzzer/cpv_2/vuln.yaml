id: cpv_2

name: Regex Injection in Feign Template Expression Pattern Parsing

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-185
- CWE-400
- CWE-20

description: |
  A regular expression injection vulnerability exists in the Feign template
  expression parser when processing variable patterns. The code allows users
  to specify patterns in the format {variable:pattern}, but the pattern portion
  is not sanitized before being passed to Pattern.compile(). When malicious
  input like {str1:{str2:}} is provided, the unescaped regex metacharacter {
  causes a PatternSyntaxException. This can lead to denial of service through
  application crashes or resource exhaustion via ReDoS (Regular Expression
  Denial of Service) attacks.

locations:
- type: crash_site
  path_from_root: core/src/main/java/feign/template/Expression.java
  function_name: Expression
  startLine: 35
