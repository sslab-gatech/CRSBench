id: cpv_0

name: ReDoS via Regex Stack Overflow in Expression Parsing

origin: 1-day

release_date: 09/05/2023

references:
- https://github.com/OpenFeign/feign/pull/2150

cwes:
- CWE-400
- CWE-1333
- CWE-674

description: |
  A Regular Expression Denial of Service (ReDoS) vulnerability exists in the
  Expressions.create method in core/src/main/java/feign/template/Expressions.java.
  The EXPRESSION_PATTERN and VARIABLE_LIST_PATTERN regex patterns contain complex
  structures with repetitive alternative paths and nested quantifiers. When applied
  to very long input strings (especially crafted malicious inputs), the Java regex
  engine's backtracking algorithm consumes excessive stack space, leading to a
  StackOverflowError. An attacker can trigger this by providing a maliciously crafted
  expression template with a very long string of repeated characters, causing the
  application to crash and resulting in denial of service.

locations:
- type: root_cause
  path_from_root: core/src/main/java/feign/template/Expressions.java
  function_name: create
  startLine: 63
