patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*

full_mode:
  base_commit: c13f2af89ebf2a295bf6c3577b647550724b5881

harness_files:
- name: pcre2_fuzzer
  path: $REPO/src/pcre2_fuzzsupport.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_1
    povs:
    - id: pov_0
      sanitizer: address
      error_token: 'ERROR: AddressSanitizer: heap-buffer-overflow'
  - vuln_keyword: cpv_2
    povs:
    - id: pov_0
      sanitizer: undefined
      error_token: 'runtime error: signed integer overflow'

- name: pcre2_fuzzer_3l
  path: $REPO/src/pcre2_fuzzsupport.c

- name: pcre2_fuzzer_4l
  path: $REPO/src/pcre2_fuzzsupport.c
