id: cpv_2

name: PCRE2 Lookbehind Integer Overflow Due to Incorrect Overflow Check

author:

validator: Yu-Fu Fu

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-190
- CWE-682

description: |
  A signed integer overflow vulnerability exists in the get_branchlength()
  function of PCRE2's pattern compilation code. The function calculates the
  length of lookbehind assertions in regular expressions. At line 9657, the
  code performs an incorrect overflow check using the 'min' variable instead
  of 'max' before computing itemlength = (max - 1) * lastitemlength. This
  allows specially crafted regex patterns with lookbehind assertions containing
  large quantifiers to bypass the overflow protection. When a minimum quantifier
  is small but the maximum is very large, the check passes incorrectly, allowing
  a massive value to be computed. Later, when adding this value to branchlength,
  a signed integer overflow occurs, triggering undefined behavior that could
  lead to incorrect lookbehind length calculations or denial of service.

locations:
- type: root_cause # INT_MAX/lastitemlength < min - 1
  path_from_root: src/pcre2_compile.c
  function_name: get_branchlength
  startLine: 9657
  startColumn: 11
  endLine: 9657
  endColumn: 42
- type: crash_site # INT_MAX - branchlength
  path_from_root: src/pcre2_compile.c
  function_name: get_branchlength
  startLine: 9683
  startColumn: 7
  endLine: 9683
  endColumn: 28
