id: cpv_0

name: Heap-buffer-overflow in PCRE2 OP_VREVERSE UTF-8 handling

author:

validator: Yu-Fu Fu

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-787
- CWE-125

description: |
  A heap buffer overflow vulnerability exists in the match function in
  src/pcre2_match.c during the handling of variable-length reverse lookbehind
  assertions (OP_VREVERSE opcode) when processing UTF-8 encoded input. The
  FORWARDCHAR macro used at line 5795 advances the pointer through UTF-8
  continuation bytes without performing bounds checking against the end of
  the subject string. When the regular expression matching algorithm moves
  forward character-by-character after a failed match attempt in a lookbehind
  assertion, it can read past the end of the allocated buffer if the pointer
  is already at or near the end of the subject string. This out-of-bounds
  read could lead to information disclosure, denial of service, or potential
  use in exploit chains.

locations:
- type: crash_site
  path_from_root: src/pcre2_match.c
  function_name: match
  startLine: 5795
  startColumn: 18
  endLine: 5795
  endColumn: 18
- type: root_cause # same
  path_from_root: src/pcre2_match.c
  function_name: match
  startLine: 5795
  startColumn: 18
  endLine: 5795
  endColumn: 18
