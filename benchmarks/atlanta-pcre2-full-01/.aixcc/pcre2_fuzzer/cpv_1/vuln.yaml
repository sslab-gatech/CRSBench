id: cpv_1

name: PCRE2 Lookbehind Group Info Buffer Overflow

origin: synthetic

release_date: 02/01/2026

cwes:
- CWE-122
- CWE-787
- CWE-131

description: |
  A heap-based buffer overflow vulnerability exists in PCRE2's regular expression
  compiler when processing lookbehind assertions with nested groups. The vulnerability
  arises from an off-by-one error in the buffer size calculation for the groupinfo
  array. The code allocates space for (2 * cb.bracount + 1) elements but can access
  cb.groupinfo[2*N + 1] when group == cb.bracount, writing 4 bytes beyond the
  allocated buffer. This can lead to heap corruption and potential arbitrary code
  execution when processing specially crafted regex patterns with nested capturing
  groups in lookbehind assertions.

locations:
- type: crash_site
  path_from_root: src/pcre2_compile.c
  function_name: get_grouplength
  startLine: 9277
  startColumn: 3
  endLine: 9278
  endColumn: 22
- type: root_cause
  path_from_root: src/pcre2_compile.c
  function_name: pcre2_compile_8
