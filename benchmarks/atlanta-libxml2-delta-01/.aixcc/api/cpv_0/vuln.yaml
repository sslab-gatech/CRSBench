id: cpv_0

name: Use of uninitialized value in xmlSearchNsByHref namespace lookup

origin: synthetic

release_date: 02/01/2026

references: []

cwes:
- CWE-457
- CWE-908

description: |
  A use-of-uninitialized-value vulnerability exists in libxml2's namespace
  handling code. The xmlSearchNsByHrefSafe function has a logic error in its
  parameter validation where it returns early without initializing the output
  parameter when node validation fails. The caller function xmlSearchNsByHref
  declares a local variable without initialization and passes it to
  xmlSearchNsByHrefSafe. If the function returns early due to invalid node
  conditions, the variable remains uninitialized, leading to unpredictable
  behavior, potential crashes, or information disclosure when the
  uninitialized pointer is returned and used.

