patch_exclude_list:
- build.sh
- Makefile
- CMakeLists.txt
- configure*
- '*.ac'
- '*.am'
- .gitignore
- .aixcc/**
- '**/*test*.c'
- '**/*test*.cc'
- '**/*test*.cpp'
- '**/*test*.h'
- test/**
- tests/**
- docs/**
- '*.md'
- README*
delta_mode:
  base_commit: 5b71dca61397021a686ee2e722b8bdb541b0419b
  ref_commit: e916386e04f483bb04e803410f3340aaa3467b13
full_mode:
  base_commit: e916386e04f483bb04e803410f3340aaa3467b13
harness_files:
- name: api
  path: $REPO/fuzz/api.c
  vulns:
  - vuln_keyword: cpv_0
    povs:
    - id: pov_0
      sanitizer: memory
      error_token: 'MemorySanitizer: use-of-uninitialized-value'
- name: html
  path: $REPO/fuzz/html.c
- name: lint
  path: $REPO/fuzz/lint.c
- name: reader
  path: $REPO/fuzz/reader.c
- name: regexp
  path: $REPO/fuzz/regexp.c
- name: schema
  path: $REPO/fuzz/schema.c
- name: uri
  path: $REPO/fuzz/uri.c
- name: valid
  path: $REPO/fuzz/valid.c
- name: xinclude
  path: $REPO/fuzz/xinclude.c
- name: xml
  path: $REPO/fuzz/xml.c
- name: xpath
  path: $REPO/fuzz/xpath.c
