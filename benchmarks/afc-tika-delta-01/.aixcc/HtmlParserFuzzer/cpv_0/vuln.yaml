name: ExternalParser at Your Command

author: Tim Allison

validator: Ze Sheng

difficulty_level:

origin: synthetic

release_date: 02/01/2026

reference:

cwes:
- CWE-78

description: >
  ExternalParser allows its command to be rewritten by user controlled data via
  the html parser. The handleDataURIScheme method reads an exiftool_path from
  HTML metadata and passes it to configureExifTool, which sets the external
  command without validation, enabling OS command injection via a crafted HTML
  file with an embedded JPEG.

